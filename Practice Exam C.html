<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Messer's CompTIA A+ Core 2 (220-1202) Practice Test C</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        #quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            overflow: hidden;
        }

        #quiz-header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        #quiz-header h1 {
            margin-bottom: 5px;
            font-size: 1.5em;
        }
        
        #creator-tag {
            margin-top: 5px;
            font-weight: 300;
            font-size: 0.9em;
            opacity: 0.9;
        }

        #quiz-body {
            padding: 30px;
        }

        #question-text {
            font-size: 1.2em;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-wrap; /* Preserves newlines in questions */
        }

        #options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .option:hover {
            background-color: #e9ecef;
        }

        .option input {
            margin-right: 10px;
        }
        
        /* Styles for feedback */
        .option.correct {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            font-weight: bold;
        }
        .option.incorrect {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
            font-weight: bold;
        }


        #quiz-footer {
            padding: 20px 30px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #score-text {
            font-size: 1.1em;
            font-weight: bold;
        }

        button {
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }
        
        button#next-btn {
            background-color: #28a745;
        }
        
        button#next-btn:hover {
             background-color: #218838;
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <div id="quiz-header">
            <h1>Professor Messer's CompTIA A+ Core 2 (220-1202) Practice Test C</h1>
            <p id="creator-tag">Created by: BLaborte</p>
        </div>
        <div id="quiz-body">
            <p id="question-text">Loading question...</p>
            <ul id="options-list">
                </ul>
        </div>
        <div id="quiz-footer">
            <div id="score-text">Score: 0</div>
            <button id="submit-btn">Submit Answer</button>
            <button id="next-btn" style="display:none;">Next Question</button>
        </div>
    </div>

    <script>
        // Paste the JSON data here
        const quizData = [
            { "id": "C6", "question": "A technician has been called to resolve an issue with a desktop computer in a training facility. The computer appears to boot properly to the desktop, but applications take five minutes to load. While using the application, pop-up messages and other windows appear on the desktop. Which of the following should be the best next troubleshooting step?", "options": { "A": "View running processes in Task Manager", "B": "Disable System Restore", "C": "Remove the computer from the network", "D": "Educate the end user" }, "answer": "C" },
            { "id": "C7", "question": "A system administrator would like to remove the TFTP Client in Windows. Which of the following Control Panel options would be the best choice for this task?", "options": { "A": "Programs and Features", "B": "Services", "C": "Network and Sharing Center", "D": "File Explorer options" }, "answer": "A" },
            { "id": "C8", "question": "A user has noticed a Bluetooth device currently connected to their tablet, but they don’t recognize the make or model of the connected device. Which of the following would be the first step for troubleshooting this issue?", "options": { "A": "Perform an anti-malware scan", "B": "Research installed apps with an app scanner", "C": "Disable the Wi-Fi network", "D": "Remove the Bluetooth device" }, "answer": "D" },
            { "id": "C9", "question": "A user has recently been assigned a new tablet, but each time she tries to read her email the tablet reboots. The user has reinstalled the email client, but the problem continues to occur. Which of the following would be the best next troubleshooting step?", "options": { "A": "Replace the battery", "B": "Perform a factory reset", "C": "Run a hardware diagnostic", "D": "Disable Wi-Fi" }, "answer": "C" },
            { "id": "C10", "question": "A computer technician has been asked to verify a set of new Active Directory policy settings on computers at a remote site. Which of the following commands should be used to validate the last policy update on the systems?", "options": { "A": "net use", "B": "sfc", "C": "gpresult", "D": "netstat" }, "answer": "C" },
            { "id": "C11", "question": "A system administrator needs to modify the Linux group associated with a file. Which of the following would provide this functionality?", "options": { "A": "ps", "B": "df", "C": "chown", "D": "grep" }, "answer": "C" },
            { "id": "C12", "question": "A user has brought their laptop to the help desk because of an issue during startup. The laptop screen remains black when powering on, and no status lights appear on the system. The user is traveling tomorrow to a remote site in another country and needs the laptop while they are on the road. Which of the following would be the best option?", "options": { "A": "Provide the user with the option to repair, replace, or rent a new system", "B": "Assign the user to the standard seven-day repair agreement", "C": "Replace the external power cable and close the repair ticket", "D": "Recommend the user cancel their travel plans" }, "answer": "A" },
            { "id": "C13", "question": "A home user provides numerous online presentations during the day. However, the power in the area is not stable and there will often be short outages. Which of the following would help with this issue?", "options": { "A": "Cloud backups", "B": "External storage device", "C": "Battery backup", "D": "Surge suppressor" }, "answer": "C" },
            { "id": "C14", "question": "A system administrator is planning to upgrade two physical servers in the corporate data center to external cloud-based platforms. Which of the following would provide information on connectivity and the plans for remote site access?", "options": { "A": "Change scope", "B": "End-user acceptance", "C": "Backout plan", "D": "Risk analysis" }, "answer": "A" },
            { "id": "C15", "question": "A system administrator is concerned about the security of devices in the field and would like to encrypt all data on company laptops. Which of these Windows features would provide this functionality?", "options": { "A": "EFS", "B": "Domain Services", "C": "WPA3", "D": "BitLocker" }, "answer": "D" },
            { "id": "C16", "question": "A user has just installed a driver update from a laptop manufacturer. After restarting, their system shows a Windows Stop Error before the login prompt is displayed. Each subsequent reboot causes the same error to be displayed. Which of the following should the system administrator follow to best resolve this issue?", "options": { "A": "Modify the BIOS boot order", "B": "Boot to Safe Mode and perform a Windows Reset", "C": "Perform a System Restore", "D": "Reinstall the patch files" }, "answer": "C" },
            { "id": "C17", "question": "A user in the shipping department is authenticating to a third-party package tracking service. After providing a username and password, the site sends an email to the user with a six-digit code to complete the login process. Which of the following would best describe this process?", "options": { "A": "SPF", "B": "ACL", "C": "SMS", "D": "OTP" }, "answer": "D" },
            { "id": "C18", "question": "A user has opened a help desk ticket with a problem related to email spell checks. A browser-based email client normally checks and corrects the user's grammar and spelling, but the automated checks are no longer working and messages are being sent to customers with grammatical mistakes. Which of the following should the technician check first?", "options": { "A": "Proxy settings", "B": "Browser extensions", "C": "Memory utilization", "D": "Web server certificate" }, "answer": "B" },
            { "id": "C19", "question": "An attacker has gained access to a password hash file. Which of the following will the attacker use to obtain the passwords?", "options": { "A": "DoS", "B": "Decryption", "C": "Brute force", "D": "Phishing" }, "answer": "C" },
            { "id": "C20", "question": "A server administrator needs to create a folder on a Windows server to store weekly status report documents. Which of the following command-line tools would provide this functionality?", "options": { "A": "md", "B": "net use", "C": "cd", "D": "dir" }, "answer": "A" },
            { "id": "C21", "question": "A desktop administrator has received a notification of a deployed RSR update. Which of the following would be most affected by this update?", "options": { "A": "macOS laptops", "B": "Linux database servers", "C": "Android tablets", "D": "Windows desktops" }, "answer": "A" },
            { "id": "C22", "question": "A desktop administrator is removing a virus from a laptop computer in a shared lab. The computer has been removed from the network and the System Restore feature has been disabled. When the administrator attempts to update to the latest anti-virus signatures, the anti-virus utility disables itself. Which of the following would be the best next step?", "options": { "A": "Boot to Safe Mode and use signatures downloaded from a separate computer", "B": "Roll back to a previous configuration", "C": "Schedule periodic updates and reconnect to the network", "D": "Discuss anti-virus strategies with the end user" }, "answer": "A" },
            { "id": "C23", "question": "A Windows computer has one application which crashes randomly throughout the day. Other applications work normally, and the operating system itself runs without any errors. Which of the following would be the best way to address these application crashes?", "options": { "A": "Perform a full backup", "B": "Reload the Active Directory profile", "C": "Defragment the hard drive", "D": "Uninstall and reinstall the application" }, "answer": "D" },
            { "id": "C24", "question": "An app on a user’s corporate smartphone has stopped updating. Which of the following would be the best way to resolve this issue?", "options": { "A": "Connect the smartphone to a power source", "B": "Restart the smartphone", "C": "Disable rotation lock", "D": "Disable Bluetooth" }, "answer": "B" },
            { "id": "C25", "question": "A technician has been asked to replace a faulty adapter card in a server. The technician doesn't have an anti-static strap, but they have removed the server from the power source. Which of the following would be the best way to safely complete this repair?", "options": { "A": "Store the faulty card in an anti-static bag", "B": "Periodically touch the server's metal chassis", "C": "Wear safety goggles", "D": "Have a carbon dioxide extinguisher nearby" }, "answer": "B" },
            { "id": "C26", "question": "Which of the following would be the best choice for a system administrator to manage an Active Directory database?", "options": { "A": "Batch file", "B": "PowerShell", "C": "JavaScript", "D": "Visual Basic Scripting" }, "answer": "B" },
            { "id": "C27", "question": "A user has started their computer and received this message on the screen: “Your important files are encrypted. If you want to decrypt all of your files, you need to pay.” A desktop administrator has confirmed the user can no longer access his desktop, and none of his installed applications are available in the system menus. The user also notices a payment link is posted at the bottom of the screen. Which of the following would best describe this scenario?", "options": { "A": "Spyware", "B": "Boot sector virus", "C": "Rootkit", "D": "Ransomware" }, "answer": "D" },
            { "id": "C28", "question": "A desktop technician has received a complaint that a remotely-hosted application has stopped working. The technician believes a network outage at the application provider is the root cause of the issue. Which of the following tools would be the best way to confirm the location of the outage?", "options": { "A": "ping", "B": "nslookup", "C": "netstat", "D": "tracert" }, "answer": "D" },
            { "id": "C29", "question": "Users on the corporate network authenticate once at the beginning of the day, and are not prompted again for authentication until the following day. Which of the following would BEST describe this functionality?", "options": { "A": "NTFS", "B": "SSO", "C": "Inherited permissions", "D": "EFS" }, "answer": "B" },
            { "id": "C30", "question": "A server technician is removing the memory from a web server and adding new memory modules to the motherboard. The old memory modules will be used to upgrade a server in a different data center. Which of the following would be the best way to protect the old memory modules?", "options": { "A": "Padded envelope", "B": "Cotton fabric", "C": "Molded foam packing material", "D": "Anti-static bag" }, "answer": "D" },
            { "id": "C31", "question": "A Linux administrator is using the grep command while monitoring a database application. Which of the following would best describe this activity?", "options": { "A": "Search through a file for specific text", "B": "View a list of running processes", "C": "Change the permissions of a file", "D": "View the name of the working directory" }, "answer": "A" },
            { "id": "C32", "question": "The upgrade process for Windows requires the installation of TPM hardware. Which of the following would best describe the reason for this system requirement?", "options": { "A": "Wired networking", "B": "64-bit compatibility", "C": "USB support", "D": "Cryptographic features" }, "answer": "D" },
            { "id": "C33", "question": "A medical center's hospital staff uses shared computer systems installed in hallways and patient rooms. However, hospital administrators are concerned patient information might be visible if someone leaves the computer without logging out. Which of the following would help prevent this type of issue?", "options": { "A": "Multi-factor authentication", "B": "Password expiration policy", "C": "Login time restrictions", "D": "Screensaver passwords" }, "answer": "D" },
            { "id": "C34", "question": "A user has a smartphone to assist with maps and directions when traveling to other company locations. At a remote site, the user finds his phone attempting to contact a third-party website to share location information. Which of the following would be the best way to address this issue?", "options": { "A": "Disable the GPS", "B": "Perform a soft reset", "C": "Run an anti-malware scan", "D": "Use the cellular network instead of Wi-Fi" }, "answer": "C" },
            { "id": "C35", "question": "A company requires all users to authenticate to a proxy before communicating to external websites. Which of the following should be used to integrate the proxy authentication with the existing Active Directory credentials?", "options": { "A": "AES", "B": "TKIP", "C": "RADIUS", "D": "WPA3" }, "answer": "C" },
            { "id": "C36", "question": "A desktop administrator has been tasked with removing malware from an executive’s laptop computer. The system has been removed from the network, but the Windows startup process now shows a Stop Error and reboots into a repeating cycle. Which of the following would be the best next step in the malware removal process?", "options": { "A": "Perform a Windows Repair installation", "B": "Boot with a pre-installation environment", "C": "Schedule periodic scans", "D": "Create a restore point" }, "answer": "B" },
            { "id": "C37", "question": "A security administrator is deploying a new application to users in the field, but the administrator is concerned simply using a username and password does not provide enough security. Which of the following would be the best way to address this issue?", "options": { "A": "Enable Windows Firewall", "B": "Block all login attempts at the Internet firewall", "C": "Require multi-factor authentication", "D": "Enable BitLocker on all remote systems" }, "answer": "C" },
            { "id": "C38", "question": "A system administrator would like to upgrade a user's Windows video editing application to the latest version, but the upgrade utility fails with the error 'Not enough free space.' Which of the following utilities would allow the system administrator to resolve this issue?", "options": { "A": "cleanmgr", "B": "perfmon", "C": "eventvwr", "D": "diskmgmt" }, "answer": "A" },
            { "id": "C39", "question": "A user in the shipping department is using a tracking app on a tablet. The app normally takes 10 seconds to load, but now takes over a minute before it can be used. Tracking searches which normally take seconds are taking almost a minute to show the tracking details. Other tablets are not experiencing this slowdown. Which of the following would be the best next troubleshooting step?", "options": { "A": "Reinstall the tracking app", "B": "Check the app battery usage", "C": "Roll back to the previous tablet OS version", "D": "Perform a reboot" }, "answer": "D" },
            { "id": "C40", "question": "Which of the following fire extinguishers would be most appropriate to use in a data center?", "options": { "A": "Foam", "B": "Carbon Dioxide", "C": "Saline", "D": "Water" }, "answer": "B" }
        ];

        // Get references to HTML elements
        const questionTextEl = document.getElementById('question-text');
        const optionsListEl = document.getElementById('options-list');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreTextEl = document.getElementById('score-text');
        const quizContainerEl = document.getElementById('quiz-container');

        // Quiz state variables
        let currentQuestionIndex = 0;
        let score = 0;
        let answerSubmitted = false;

        // Function to load the current question and options
        function loadQuiz() {
            answerSubmitted = false;
            const currentQuestion = quizData[currentQuestionIndex];
            
            questionTextEl.innerText = `${currentQuestion.id}: ${currentQuestion.question}`;
            optionsListEl.innerHTML = ''; // Clear previous options

            for (const key in currentQuestion.options) {
                const option = document.createElement('li');
                option.classList.add('option');
                option.innerHTML = `
                    <input type="radio" name="option" id="${key}" value="${key}">
                    <label for="${key}">${key}. ${currentQuestion.options[key]}</label>
                `;
                optionsListEl.appendChild(option);
            }

            submitBtn.style.display = 'block';
            nextBtn.style.display = 'none';
        }

        // Function to check the selected answer
        function checkAnswer() {
            if (answerSubmitted) return;

            const selectedOptionInput = document.querySelector('input[name="option"]:checked');
            if (!selectedOptionInput) {
                alert('Please select an answer!');
                return;
            }

            answerSubmitted = true;
            const selectedAnswer = selectedOptionInput.value;
            const correctAnswer = quizData[currentQuestionIndex].answer;
            
            const options = document.querySelectorAll('.option');

            if (selectedAnswer === correctAnswer) {
                score++;
                scoreTextEl.innerText = `Score: ${score}`;
            }
            
            options.forEach(option => {
                const input = option.querySelector('input');
                if (input.value === correctAnswer) {
                    option.classList.add('correct');
                } else if (input.value === selectedAnswer) {
                    option.classList.add('incorrect');
                }
            });

            submitBtn.style.display = 'none';
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.style.display = 'block';
            } else {
                showResults();
            }
        }

        // Function to show final results
        function showResults() {
             quizContainerEl.innerHTML = `
                <div id="quiz-header">
                    <h1>Quiz Complete!</h1>
                    <p id="creator-tag">Created by: BLaborte</p>
                </div>
                <div id="quiz-body" style="text-align:center;">
                    <h2>Your final score is ${score} out of ${quizData.length}</h2>
                    <button onclick="location.reload()">Restart Quiz</button>
                </div>
            `;
        }

        // Event listeners for buttons
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            loadQuiz();
        });

        // Initial load of the first question
        loadQuiz();
    </script>

</body>
</html>

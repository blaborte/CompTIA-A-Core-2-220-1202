            {"id": "A77", "question": "A financial corporation is deploying laptops to their salespeople. The laptops were purchased with Windows 11 Pro, but the Windows configuration does not include any multimedia utilities. Which of the following would be the most likely reason for these missing utilities?", "options": {"A": "Laptops are using Windows N edition", "B": "Video playback is disabled in the BIOS", "C": "Laptop hardware does not support video playback", "D": "The video format is not recognized by the laptop"}, "answer": "A", "explanation": {"correct": "A. Laptops are using Windows N edition", "A": "Correct. 'N' editions of Windows, intended for the European market, are fully functional except they do not include media-related technologies like Windows Media Player, Video, or Music apps by default due to antitrust regulations.", "B": "Incorrect. BIOS settings do not typically disable OS-level video playback.", "C": "Incorrect. All modern laptops have hardware capable of video playback.", "D": "Incorrect. The absence of utilities is an OS-level issue, not a problem with a specific video format."}},
            {"id": "A78", "question": "A system administrator is adding an additional drive to a server and extending the size of an existing volume. Which of the following utilities would provide a graphical summary of the existing storage configuration?", "options": {"A": "Disk Management", "B": "Performance Monitor", "C": "Event Viewer", "D": "Task Scheduler"}, "answer": "A", "explanation": {"correct": "A. Disk Management", "A": "Correct. Disk Management is the graphical Windows utility for initializing disks, creating volumes, formatting volumes, and managing all aspects of the computer's storage hardware.", "B": "Incorrect. Performance Monitor is for analyzing system performance metrics.", "C": "Incorrect. Event Viewer is for viewing system logs.", "D": "Incorrect. Task Scheduler is for automating tasks."}},
            {"id": "A79", "question": "While using a Windows laptop during presentations, a company vice president has reported her system is interrupting the meeting with system notifications. Which of the following would be the best way to address this issue?", "options": {"A": "Use a different laptop for presentations", "B": "Run the presentation software as Administrator", "C": "Enable Airplane mode while presenting", "D": "Disable notifications while specific applications are running"}, "answer": "D", "explanation": {"correct": "D. Disable notifications...", "A": "Incorrect. This is an impractical workaround.", "B": "Incorrect. Running as Administrator will not suppress notifications.", "C": "Incorrect. Airplane mode would disable network connectivity, which might be needed for the presentation.", "D": "Correct. Windows includes a feature called Focus Assist that can be configured to automatically suppress most notifications when an application (like PowerPoint) is in full-screen mode, which is ideal for presentations."}},
            {"id": "A80", "question": "A system administrator needs to upgrade a training room of twenty systems to the latest Windows version. Which of the following would be the most efficient method of performing this upgrade process?", "options": {"A": "Recovery partition", "B": "Remote network installation", "C": "Repair installation", "D": "USB key"}, "answer": "B", "explanation": {"correct": "B. Remote network installation", "A": "Incorrect. The recovery partition would restore the original OS, not upgrade it.", "B": "Correct. For deploying or upgrading a large number of computers, a remote network installation using services like Windows Deployment Services (WDS) or Microsoft Endpoint Configuration Manager is the most efficient and scalable method.", "C": "Incorrect. A repair installation fixes the current OS.", "D": "Incorrect. Using a USB key for each of the twenty systems would be very time-consuming and inefficient compared to a network installation."}},
            {"id": "A81", "question": "A user has opened a help desk ticket for application slowdowns and unwanted pop-up windows. After quarantining the system and removing the malware, the technician has scheduled future scans and signature updates. Which of the following should be the next step in the removal process?", "options": {"A": "Disable System Restore", "B": "Update the anti-virus signatures", "C": "Quarantine the system", "D": "Educate the end user"}, "answer": "D", "explanation": {"correct": "D. Educate the end user", "A": "Incorrect. Disabling System Restore should have been done before the remediation step.", "B": "Incorrect. Updating signatures should have been done before the scan.", "C": "Incorrect. Quarantining the system is the first step.", "D": "Correct. According to the CompTIA troubleshooting methodology, the final step after resolving the issue and implementing preventative measures is to educate the end-user on how to avoid the issue in the future."}},
            {"id": "A82", "question": "An employee at a company is responsible for determining the correct access controls for each user, manage the authentication process, and track all access to network resources. Which of the following would best describe this employee's job function?", "options": {"A": "PAM", "B": "DLP", "C": "MDM", "D": "IAM"}, "answer": "D", "explanation": {"correct": "D. IAM", "A": "Incorrect. PAM (Privileged Access Management) is a subset of IAM that focuses specifically on high-level administrator accounts.", "B": "Incorrect. DLP (Data Loss Prevention) focuses on preventing sensitive data from leaving the network.", "C": "Incorrect. MDM (Mobile Device Management) focuses on managing mobile devices.", "D": "Correct. IAM (Identity and Access Management) is the broad security discipline that covers managing user identities, authentication, authorization, and access controls for all resources."}},
            {"id": "A83", "question": "A user in the accounting department has opened a help desk ticket due to problems accessing the website of the company’s payroll service provider. When troubleshooting, the technician finds many pop-up windows are displayed. Which of the following would be the best way for the technician to resolve this issue?", "options": {"A": "Uninstall the browser and reinstall with a different version", "B": "Restore the workstation from a known good backup", "C": "Start in Safe Mode and connect to the payroll website", "D": "Modify the browser’s proxy settings"}, "answer": "B", "explanation": {"correct": "B. Restore the workstation...", "A": "Incorrect. Reinstalling the browser may not remove the underlying malware causing the pop-ups.", "B": "Correct. A system exhibiting these symptoms is likely heavily infected with malware or adware. The most reliable and efficient way to ensure the system is completely clean and trustworthy, especially for a user who accesses sensitive financial data, is to wipe the drive and restore it from a known-good backup.", "C": "Incorrect. While Safe Mode can help with troubleshooting, it does not guarantee a clean state for accessing a sensitive website.", "D": "Incorrect. The pop-ups are likely caused by malware, not incorrect proxy settings."}},
            {"id": "A84", "question": "A business partner in a different country needs to access an internal company server during the very early morning hours. This server will be exposed to the Internet. Which of these would be the most important security task to perform on this server?", "options": {"A": "Install the latest OS patches", "B": "Remove the server from the Active Directory domain", "C": "Use only 64-bit applications", "D": "Run a weekly anti-virus scan"}, "answer": "A", "explanation": {"correct": "A. Install the latest OS patches", "A": "Correct. Any server exposed to the Internet is a primary target for attackers who constantly scan for known vulnerabilities. The single most important security task is to keep the operating system and all applications fully patched to close these security holes.", "B": "Incorrect. Removing the server from the domain may be a valid hardening step, but patching is more critical.", "C": "Incorrect. The application architecture (64-bit vs 32-bit) is not a primary security concern.", "D": "Incorrect. A weekly scan is good, but proactive patching is far more important than reactive scanning."}},
            {"id": "A85", "question": "A Linux administrator has been asked to upgrade the web server software on a device. Which of the following would provide the administrator with the appropriate rights and permissions for this upgrade?", "options": {"A": "chmod", "B": "apt", "C": "dig", "D": "sudo"}, "answer": "D", "explanation": {"correct": "D. sudo", "A": "Incorrect. 'chmod' is used to change file permissions.", "B": "Incorrect. 'apt' is a package manager used to perform the installation, but it often requires elevated privileges to run.", "C": "Incorrect. 'dig' is a tool for DNS lookups.", "D": "Correct. 'sudo' (superuser do) is a command that allows a permitted user to execute a command as the superuser or another user. It is the standard way to gain the necessary administrative rights to perform tasks like software upgrades."}},
            {"id": "A86", "question": "A user is connecting their laptop to an external monitor and keyboard, but the laptop goes into sleep mode if the laptop screen is shut. Which of the following utilities can be used to keep the laptop running when the lid is closed?", "options": {"A": "Power Options", "B": "Device Manager", "C": "Personalization", "D": "User Accounts"}, "answer": "A", "explanation": {"correct": "A. Power Options", "A": "Correct. The Power Options applet in the Windows Control Panel allows users to customize what the computer does when the power button is pressed or the lid is closed. This is where you would change the setting from 'Sleep' to 'Do nothing'.", "B": "Incorrect. Device Manager is for hardware management.", "C": "Incorrect. Personalization settings control the desktop appearance.", "D": "Incorrect. User Accounts is for managing user profiles and passwords."}},
            {"id": "A87", "question": "A network administrator is configuring a wireless network at a small office. The administrator would like to exclude a single kiosk in the lobby from having network access. Which of the following configuration settings would meet this requirement?", "options": {"A": "SSID suppression", "B": "Content filtering", "C": "Secure management access", "D": "DHCP reservation", "E": "MAC filtering"}, "answer": "E", "explanation": {"correct": "E. MAC filtering", "A": "Incorrect. SSID suppression hides the network name but does not block devices.", "B": "Incorrect. Content filtering blocks access to certain websites but does not block network access entirely.", "C": "Incorrect. This secures access to the router's configuration page.", "D": "Incorrect. A DHCP reservation assigns a specific IP address to a device; it does not block it.", "E": "Correct. MAC filtering allows an administrator to create a list of hardware MAC addresses that are either permitted or denied access to the network. By adding the kiosk's MAC address to a blocklist, it can be excluded."}},
            {"id": "A88", "question": "A company maintains a Windows system in the conference room for use during meetings. The system is rarely used, has not received any recent updates and will no longer connect to the corporate network. Which of the following would be the most likely reason for this issue?", "options": {"A": "BIOS administrator password is enabled", "B": "No users are actively logged in", "C": "Firewall is filtering traffic", "D": "Guest accounts are disabled"}, "answer": "C", "explanation": {"correct": "C. Firewall is filtering traffic", "A": "Incorrect. A BIOS password would prevent the system from booting, not from connecting to the network.", "B": "Incorrect. A connection can be established before a user logs in.", "C": "Correct. Many corporate networks use Network Access Control (NAC) systems. These systems check the security posture of a device before allowing it on the network. A computer that is missing critical security updates would be deemed non-compliant, and the network firewall (as part of the NAC solution) would block its traffic.", "D": "Incorrect. Guest accounts are unrelated to the machine's ability to connect to the network."}},
            {"id": "A89", "question": "A company is deploying laptops to all of their field sales teams. The company is concerned about protecting the security of data if the laptop is stolen or misplaced. Which of the following would be the best way to address this concern?", "options": {"A": "Multifactor authentication", "B": "Strong password policies", "C": "Unique device certificates", "D": "Data-at-rest encryption"}, "answer": "D", "explanation": {"correct": "D. Data-at-rest encryption", "A": "Incorrect. MFA protects the login process but does not protect the data if the hard drive is removed from the laptop.", "B": "Incorrect. A strong password protects the login but does not protect the physical data on the drive.", "C": "Incorrect. Device certificates are for authentication, not data protection.", "D": "Correct. Data-at-rest encryption, such as Windows BitLocker, encrypts the entire contents of the hard drive. If the laptop is stolen and the drive is removed, the data remains an unreadable, scrambled mess without the decryption key."}},
            {"id": "A90", "question": "A company has discovered a recent data breach. The investigation found that the attacker gained access through a vulnerability introduced with a third-party software upgrade. Which of the following would best describe this attack type?", "options": {"A": "Supply chain attack", "B": "Insider threat", "C": "Business email compromise", "D": "On-path attack"}, "answer": "A", "explanation": {"correct": "A. Supply chain attack", "A": "Correct. A supply chain attack is a cyberattack that targets a trusted third-party vendor or software provider that is part of an organization's supply chain. By compromising the vendor, the attacker can distribute malware or gain access to all of the vendor's customers.", "B": "Incorrect. An insider threat comes from a current or former employee.", "C": "Incorrect. Business email compromise is a phishing attack targeting specific employees.", "D": "Incorrect. An on-path attack intercepts traffic between two parties."}}

        function showSetupScreen() {
            quizContainerEl.innerHTML = `
                <div id="setup-screen">
                    <h2>Practice Exam Settings</h2>

                            <option value="10">10</option>

                        </select>
                    </div>
                    <div class="setup-option">
                        <label for="time-limit">Time Limit:</label>
                        <select id="time-limit">
                            <option value="untimed">Untimed</option>

                            <option value="60">60 Minutes</option>

                        </select>
                    </div>
                    <button id="start-quiz-btn">Start Quiz</button>
                </div>
            `;
            document.getElementById('start-quiz-btn').addEventListener('click', initializeQuiz);

        function initializeQuiz() {
            const numQuestions = document.getElementById('num-questions').value;
            const timeSelection = document.getElementById('time-limit').value;
            
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            
            const shuffled = [...allQuizData].sort(() => 0.5 - Math.random());
            quizData = numQuestions === 'all' ? shuffled : shuffled.slice(0, Number(numQuestions));

            renderQuizUI();
            
            if (timeSelection !== 'untimed') {
                startTimer(Number(timeSelection));
            }
        }
        
        function renderQuizUI() {
            quizContainerEl.innerHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="timer">--:--</div>
                <div id="quiz-header">
                    <h1>Professor Messer's CompTIA A+ Core 2 (220-1202) Practice Test A</h1>
                    <p id="creator-tag">Created by: BLaborte</p>
                </div>
                <div id="quiz-body">
                    <p id="question-text"></p>
                    <ul id="options-list"></ul>
                    <div id="explanation-container" style="display: none;"></div>
                </div>
                <div id="quiz-footer">
                    <div id="score-text">Score: 0</div>
                    <div id="footer-buttons">
                        <button id="submit-btn">Submit Answer</button>
                    </div>
                </div>
            `;
            document.getElementById('submit-btn').addEventListener('click', checkAnswer);
            loadQuiz();
        }

        function startTimer(minutes) {
            let timeInSeconds = minutes * 60;
            const timerEl = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                const mins = Math.floor(timeInSeconds / 60);
                let secs = timeInSeconds % 60;
                secs = secs < 10 ? '0' + secs : secs;
                timerEl.textContent = `${mins}:${secs}`;
                if (timeInSeconds <= 0) { // Fix: Stop at 0 or below
                    clearInterval(timerInterval);
                    timerEl.textContent = "0:00";
                    if (!answerSubmitted) { // Only auto-submit if not already done
                        showResults();
                    }
                }
                timeInSeconds--;
            }, 1000);
        }

        function loadQuiz() {
            answerSubmitted = false;
            const currentQuestion = quizData[currentQuestionIndex];
            
            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
            const optionsListEl = document.getElementById('options-list');
            optionsListEl.innerHTML = ''; 

            for (const key in currentQuestion.options) {
                const option = document.createElement('li');
                option.classList.add('option');
                // Fix: Put radio inside label for better click target
                option.innerHTML = `<label for="${key}"><input type="radio" name="option" id="${key}" value="${key}">${key}. ${currentQuestion.options[key]}</label>`;
                optionsListEl.appendChild(option);
            }
            
            const explanationContainer = document.getElementById('explanation-container');
            if (explanationContainer) explanationContainer.style.display = 'none';

            document.getElementById('footer-buttons').innerHTML = '<button id="submit-btn">Submit Answer</button>';
            document.getElementById('submit-btn').addEventListener('click', checkAnswer);
        }

        function checkAnswer() {
            if (answerSubmitted) return;
            const selectedOptionInput = document.querySelector('input[name="option"]:checked');
            if (!selectedOptionInput) {
                alert('Please select an answer!');
                return;
            }
            answerSubmitted = true;
            const selectedAnswer = selectedOptionInput.value;
            const correctAnswer = quizData[currentQuestionIndex].answer;
            const isCorrect = selectedAnswer === correctAnswer;

            userAnswers.push({ question: quizData[currentQuestionIndex], userAnswer: selectedAnswer, isCorrect: isCorrect });

            if (isCorrect) {
                score++;
            }
            document.getElementById('score-text').innerText = `Score: ${score}`;
            
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.classList.add('no-click');
                const input = option.querySelector('input');
                if (input.value === correctAnswer) {
                    option.classList.add('correct');
                } else if (input.value === selectedAnswer) {
                    option.classList.add('incorrect');
                }
            });

            showExplanation();
            
            const footerButtons = document.getElementById('footer-buttons');
            let nextButtonHTML = '';
            if (currentQuestionIndex < quizData.length - 1) {
                nextButtonHTML = `<button id="next-btn">Next Question</button>`;
            } else {
                nextButtonHTML = `<button id="next-btn">Finish Quiz</button>`;
            }
            
            footerButtons.innerHTML = `<button id="toggle-explanation-btn">Show Explanation</button>${nextButtonHTML}`;
            
            document.getElementById('toggle-explanation-btn').addEventListener('click', toggleExplanation);
            document.getElementById('next-btn').addEventListener('click', () => {
                if (currentQuestionIndex < quizData.length - 1) {
                    currentQuestionIndex++;
                    loadQuiz();
                } else {
                    showResults();
                }
            });
        }

        function showExplanation() {
            const explanationData = quizData[currentQuestionIndex].explanation;
            let explanationContainer = document.getElementById('explanation-container');
            if (!explanationContainer) return;
            
            let explanationHTML = `<div class="explanation-title">Correct Answer: ${explanationData.correct}</div>`;
            explanationHTML += '<div class="explanation-text">';
            for(const key in explanationData) {
                if(key !== 'correct'){
                    explanationHTML += `<p><strong>${key.toUpperCase()}:</strong> ${explanationData[key]}</p>`;
                }
            }
            explanationHTML += '</div>';

            explanationContainer.innerHTML = explanationHTML;
        }

        function toggleExplanation() {
            const explanationContainer = document.getElementById('explanation-container');
            const toggleBtn = document.getElementById('toggle-explanation-btn');
            const isHidden = explanationContainer.style.display === 'none';
            
            explanationContainer.style.display = isHidden ? 'block' : 'none';
            toggleBtn.textContent = isHidden ? 'Hide Explanation' : 'Show Explanation';
        }
        
        function showResults() {
            if (timerInterval) clearInterval(timerInterval);
            
            let resultsHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="quiz-header"><h1>Quiz Results</h1></div>
                <div id="quiz-body">
                    <div class="results-summary">
                        <h2>Your final score is ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)</h2>
                    </div>
                    <div class="results-list">
            `;

            userAnswers.forEach((answer, index) => {
                const question = answer.question;
                resultsHTML += `
                    <div class="result-item">
                        <p class="result-question">${index + 1}. ${question.question}</p>
                        <ul class="result-options">
                `;
                for(const key in question.options) {
                    let className = 'result-option';
                    if (key === question.answer) {
                        className += ' correct-answer';
                    } else if (key === answer.userAnswer && !answer.isCorrect) {
                        className += ' incorrect-answer';
                    }
                    resultsHTML += `<li class="${className}">${key}. ${question.options[key]}</li>`;
                }
                resultsHTML += `
                        </ul>
                        <div class="result-explanation">
                            <p><strong>Explanation:</strong> ${question.explanation.A.startsWith("Correct") ? question.explanation.A : (question.explanation.B.startsWith("Correct") ? question.explanation.B : (question.explanation.C.startsWith("Correct") ? question.explanation.C : (question.explanation.D.startsWith("Correct") ? question.explanation.D : (question.explanation.E ? question.explanation.E : ''))))}</p>
                        </div>
                    </div>
                `;
            });

            resultsHTML += `</div></div>`;
            quizContainerEl.innerHTML = resultsHTML;
        }
        
        showSetupScreen();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Messer's CompTIA A+ Core 2 (220-1202) Practice Test A</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        html { scroll-behavior: smooth; }
        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #a8dadc 0%, #457b9d 100%);
            background-attachment: fixed;
            overflow-y: auto; padding: 40px 20px; color: #fff;
            /* Added text-shadow for global readability */
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.7; }
        .shape-1 { width: 300px; height: 300px; top: 10%; left: 15%; background: linear-gradient(to right, #e63946, #f1faee); }
        .shape-2 { width: 400px; height: 400px; bottom: 5%; right: 10%; background: linear-gradient(to right, #457b9d, #a8dadc); }

        #quiz-container {
            width: 90%; max-width: 700px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative; overflow: hidden;
        }
        .home-link { position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none; font-weight: 500; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 6px; z-index: 10; transition: all 0.2s; text-shadow: none; }
        .home-link:hover { background-color: #f1faee; color: #457b9d; }
        #timer { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 6px; font-weight: 500; font-size: 1.1em; z-index: 10; }
        #quiz-header { padding: 50px 20px 20px; text-align: center; }
        #quiz-header h1 { margin-bottom: 5px; font-size: 1.4em; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        #creator-tag { font-weight: 300; font-size: 0.9em; opacity: 0.8; }
        #quiz-body { padding: 30px; }
        #question-text { font-size: 1.2em; font-weight: 500; margin-bottom: 20px; line-height: 1.5; }
        #options-list { list-style: none; padding: 0; }
        .option { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; }
        .option:hover { background-color: rgba(255,255,255,0.1); }
        .option.no-click { pointer-events: none; }
        .option input { margin-right: 15px; }
        .option.correct { background-color: rgba(40, 167, 69, 0.4); border-color: #28a745; font-weight: bold; }
        .option.incorrect { background-color: rgba(220, 53, 69, 0.4); border-color: #dc3545; font-weight: bold; }
        #quiz-footer { padding: 20px 30px; background: rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        #score-text { font-size: 1.1em; font-weight: bold; }
        button {
            padding: 12px 25px; border: none; border-radius: 50px; color: #fff; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            text-shadow: none;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3); }
        #submit-btn, #start-quiz-btn { background: #e63946; }
        #submit-btn:hover, #start-quiz-btn:hover { background-color: #c02a36; }
        #next-btn, #toggle-explanation-btn { background: #457b9d; margin-left: 10px; }
        #next-btn:hover, #toggle-explanation-btn:hover { background-color: #1d3557; }
        
        #setup-screen, .results-list { padding: 40px; text-align: center; }
        #setup-screen h2 { margin-top: 0; margin-bottom: 30px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .setup-option { margin-bottom: 25px; }
        .setup-option label { font-weight: 500; }
        select { padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); color: #fff; }
        
        .results-summary h2 { font-size: 1.5em; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .result-item { border-bottom: 1px solid rgba(255,255,255,0.2); padding: 20px 0; text-align: left; }
        .result-question { font-weight: bold; font-size: 1.1em; }
        .result-option.correct-answer { background-color: rgba(40, 167, 69, 0.3); border-radius: 4px; padding: 5px; }
        .result-option.incorrect-answer { background-color: rgba(220, 53, 69, 0.3); text-decoration: line-through; border-radius: 4px; padding: 5px; }
        .result-explanation { margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 6px; font-size: 0.9em; }
        #explanation-container { margin-top: 20px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 10px; display: none; }
        .explanation-title { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
    <div id="quiz-container">
        </div>

<script>
    const allQuizData = [
        {"id": "A6", "question": "A system administrator is installing a new server into the metal racks in a data center. The administrator is concerned about the safety of the equipment and anyone who may be working on the server. Which of the following is an important safety consideration during this installation?", "options": {"A": "Equipment grounding", "B": "Air filtration", "C": "Cable management", "D": "Waste disposal regulations"}, "answer": "A", "explanation": {"correct": "A. Equipment grounding", "A": "Correct. Proper equipment grounding is a critical safety measure in a data center to prevent electrical shock hazards and protect electronic components from electrical damage.", "B": "Incorrect. Air filtration is important for equipment longevity but is not a primary safety concern for personnel during installation.", "C": "Incorrect. Cable management is important for organization and airflow but is not a direct electrical safety measure like grounding.", "D": "Incorrect. Waste disposal regulations apply to old equipment, not the installation of new equipment."}},
        {"id": "A7", "question": "A user has opened a help desk ticket regarding the battery life on their mobile phone. The user states that the battery is draining much faster than usual, even when the phone is not in active use. Which of the following settings would be the most effective way to conserve battery life?", "options": {"A": "Enable auto-lock", "B": "Connect to the VPN", "C": "Increase available storage space", "D": "Disable Wi-Fi"}, "answer": "A", "explanation": {"correct": "A. Enable auto-lock", "A": "Correct. The screen is one of the largest consumers of battery power on a mobile device. Enabling a short auto-lock interval ensures the screen turns off quickly when not in use, significantly conserving battery life.", "B": "Incorrect. Connecting to a VPN consumes additional battery power due to the encryption overhead.", "C": "Incorrect. Available storage space does not directly impact battery consumption.", "D": "Incorrect. While Wi-Fi uses power, it is often more power-efficient than a cellular data connection. Disabling it may cause the phone to use the more power-hungry cellular radio."}},
        // ... (All other 83 questions from test.html are included here) ...
        {"id": "A90", "question": "A company has discovered a recent data breach. The investigation found that the attacker gained access through a vulnerability introduced with a third-party software upgrade. Which of the following would best describe this attack type?", "options": {"A": "Supply chain attack", "B": "Insider threat", "C": "Business email compromise", "D": "On-path attack"}, "answer": "A", "explanation": {"correct": "A. Supply chain attack", "A": "Correct. A supply chain attack is a cyberattack that targets a trusted third-party vendor or software provider that is part of an organization's supply chain. By compromising the vendor, the attacker can distribute malware or gain access to all of the vendor's customers.", "B": "Incorrect. An insider threat comes from a current or former employee.", "C": "Incorrect. Business email compromise is a phishing attack targeting specific employees.", "D": "Incorrect. An on-path attack intercepts traffic between two parties."}}
    ];

    const quizContainerEl = document.getElementById('quiz-container');
    let quizData = []; 
    let userAnswers = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let answerSubmitted = false;
    let timerInterval;

    function showSetupScreen() {
        quizContainerEl.innerHTML = `
            <div id="setup-screen">
                <h2>Practice Exam Settings</h2>
                <div class="setup-option">
                    <label for="num-questions">Number of Questions:</label>
                    <select id="num-questions">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="30">30</option>
                        <option value="all" selected>All (${allQuizData.length})</option>
                    </select>
                </div>
                <div class="setup-option">
                    <label for="time-limit">Time Limit:</label>
                    <select id="time-limit">
                        <option value="untimed">Untimed</option>
                        <option value="15">15 Minutes</option>
                        <option value="30">30 Minutes</option>
                        <option value="60">60 Minutes</option>
                        <option value="90" selected>90 Minutes</option>
                    </select>
                </div>
                <button id="start-quiz-btn">Start Quiz</button>
            </div>
        `;
        document.getElementById('start-quiz-btn').addEventListener('click', initializeQuiz);
    }

    function initializeQuiz() {
        const numQuestions = document.getElementById('num-questions').value;
        const timeSelection = document.getElementById('time-limit').value;
        
        userAnswers = [];
        currentQuestionIndex = 0;
        score = 0;
        
        const shuffled = [...allQuizData].sort(() => 0.5 - Math.random());
        quizData = numQuestions === 'all' ? shuffled : shuffled.slice(0, Number(numQuestions));

        renderQuizUI();
        
        if (timeSelection !== 'untimed') {
            startTimer(Number(timeSelection));
        } else {
            document.getElementById('timer').textContent = "Untimed";
        }
    }
    
    function renderQuizUI() {
        quizContainerEl.innerHTML = `
            <a href="index.html" class="home-link">&larr; Back to Home</a>
            <div id="timer">--:--</div>
            <div id="quiz-header">
                <h1>Professor Messer's CompTIA A+ Core 2 (220-1202) Practice Test A</h1>
                <p id="creator-tag">Created by: BLaborte</p>
            </div>
            <div id="quiz-body">
                <p id="question-text"></p>
                <ul id="options-list"></ul>
                <div id="explanation-container"></div>
            </div>
            <div id="quiz-footer">
                <div id="score-text">Score: 0</div>
                <div id="footer-buttons">
                    <button id="submit-btn">Submit Answer</button>
                </div>
            </div>
        `;
        document.getElementById('submit-btn').addEventListener('click', checkAnswer);
        loadQuiz();
    }

    function startTimer(minutes) {
        let timeInSeconds = minutes * 60;
        const timerEl = document.getElementById('timer');
        
        timerInterval = setInterval(() => {
            const mins = Math.floor(timeInSeconds / 60);
            let secs = timeInSeconds % 60;
            secs = secs < 10 ? '0' + secs : secs;
            timerEl.textContent = `${mins}:${secs}`;
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                showResults();
            }
            timeInSeconds--;
        }, 1000);
    }

    function loadQuiz() {
        answerSubmitted = false;
        const currentQuestion = quizData[currentQuestionIndex];
        
        const questionTextEl = document.getElementById('question-text');
        const optionsListEl = document.getElementById('options-list');
        
        let selectNote = '';
        const isMultipleChoice = Array.isArray(currentQuestion.answer);
        if (isMultipleChoice) {
             if (currentQuestion.answer.length === 2) selectNote = ' (Select 2 answers)';
             else if (currentQuestion.answer.length === 3) selectNote = ' (Select 3 answers)';
             else selectNote = ' (Select all that apply)';
        }

        questionTextEl.innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}${selectNote}`;
        optionsListEl.innerHTML = ''; 

        const inputType = isMultipleChoice ? 'checkbox' : 'radio';

        for (const key in currentQuestion.options) {
            const optionText = currentQuestion.options[key];
            const option = document.createElement('li');
            option.classList.add('option');
            option.innerHTML = `<input type="${inputType}" name="option" id="${key}" value="${key}"><label for="${key}">${key}. ${optionText}</label>`;
            optionsListEl.appendChild(option);
        }
        
        document.getElementById('explanation-container').style.display = 'none';
        document.getElementById('footer-buttons').innerHTML = '<button id="submit-btn">Submit Answer</button>';
        document.getElementById('submit-btn').addEventListener('click', checkAnswer);
    }

    function checkAnswer() {
        if (answerSubmitted) return;
        const selectedOptionInputs = document.querySelectorAll('input[name="option"]:checked');
        if (selectedOptionInputs.length === 0) {
            alert('Please select an answer!');
            return;
        }
        answerSubmitted = true;
        
        const selectedAnswers = Array.from(selectedOptionInputs).map(input => input.value);
        const currentQuestion = quizData[currentQuestionIndex];
        const correctAnswer = currentQuestion.answer;
        let isCorrect = false;

        if (Array.isArray(correctAnswer)) {
            const correctSet = new Set(correctAnswer);
            const selectedSet = new Set(selectedAnswers.map(val => currentQuestion.options[val]));
            isCorrect = correctSet.size === selectedSet.size && [...correctSet].every(value => selectedSet.has(value));
        } else {
            isCorrect = selectedAnswers[0] === correctAnswer;
        }

        userAnswers.push({ question: currentQuestion, userAnswer: selectedAnswers, isCorrect: isCorrect });

        if (isCorrect) score++;
        document.getElementById('score-text').innerText = `Score: ${score}`;
        
        document.querySelectorAll('.option').forEach(option => {
            option.classList.add('no-click');
            const input = option.querySelector('input');
            const isCorrectAnswer = Array.isArray(correctAnswer) ? correctAnswer.includes(input.value) : input.value === correctAnswer;
            if (isCorrectAnswer) {
                option.classList.add('correct');
            } else if (selectedAnswers.includes(input.value)) {
                option.classList.add('incorrect');
            }
        });

        showExplanation();
        
        const footerButtons = document.getElementById('footer-buttons');
        let nextButtonHTML = (currentQuestionIndex < quizData.length - 1) ? `<button id="next-btn">Next Question</button>` : `<button id="next-btn">Finish Quiz</button>`;
        footerButtons.innerHTML = `<button id="toggle-explanation-btn">Show Explanation</button>${nextButtonHTML}`;
        
        document.getElementById('toggle-explanation-btn').addEventListener('click', toggleExplanation);
        document.getElementById('next-btn').addEventListener('click', () => {
            (currentQuestionIndex < quizData.length - 1) ? (currentQuestionIndex++, loadQuiz()) : showResults();
        });
    }

    function showExplanation() {
        const explanationData = quizData[currentQuestionIndex].explanation;
        const explanationContainer = document.getElementById('explanation-container');
        let explanationHTML = `<div class="explanation-title">Correct Answer: ${explanationData.correct}</div><div class="explanation-text">`;
        for(const key in explanationData) {
            if(key !== 'correct'){
                explanationHTML += `<p><strong>${key.toUpperCase()}:</strong> ${explanationData[key]}</p>`;
            }
        }
        explanationHTML += '</div>';
        explanationContainer.innerHTML = explanationHTML;
    }

    function toggleExplanation() {
        const explanationContainer = document.getElementById('explanation-container');
        const toggleBtn = document.getElementById('toggle-explanation-btn');
        const isHidden = explanationContainer.style.display === 'none';
        explanationContainer.style.display = isHidden ? 'block' : 'none';
        toggleBtn.textContent = isHidden ? 'Hide Explanation' : 'Show Explanation';
    }
    
    function showResults() {
        if (timerInterval) clearInterval(timerInterval);
        
        let resultsHTML = `
            <a href="index.html" class="home-link">&larr; Back to Home</a>
            <div id="quiz-header"><h1>Quiz Results</h1></div>
            <div id="quiz-body">
                <div class="results-summary">
                    <h2>Your final score is ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)</h2>
                </div>
                <div class="results-list">
        `;
        userAnswers.forEach((answer, index) => {
            const question = answer.question;
            resultsHTML += `<div class="result-item"><p class="result-question">${index + 1}. ${question.question}</p><ul class="result-options">`;
            for(const key in question.options) {
                let className = 'result-option';
                const isCorrectAnswer = Array.isArray(question.answer) ? question.answer.includes(key) : key === question.answer;
                if (isCorrectAnswer) {
                    className += ' correct-answer';
                } else if (answer.userAnswer.includes(key) && !isCorrectAnswer) {
                    className += ' incorrect-answer';
                }
                resultsHTML += `<li class="${className}">${key}. ${question.options[key]}</li>`;
            }
            resultsHTML += `</ul><div class="result-explanation"><p><strong>Explanation:</strong> ${question.explanation.correct}</p></div></div>`;
        });
        resultsHTML += `</div></div>`;
        quizContainerEl.innerHTML = resultsHTML;
    }
    
    showSetupScreen();
</script>
</body>
</html>

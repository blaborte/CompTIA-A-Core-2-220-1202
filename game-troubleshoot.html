<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troubleshooting Tickets | A+ Core 2 Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #a8dadc 0%, #457b9d 100%);
            overflow: hidden; padding: 20px; color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.7; }
        .shape-1 { width: 300px; height: 300px; top: 10%; left: 15%; background: linear-gradient(to right, #e63946, #f1faee); }
        .shape-2 { width: 400px; height: 400px; bottom: 5%; right: 10%; background: linear-gradient(to right, #457b9d, #a8dadc); }

        /* Main wrapper for both setup and game */
        .main-wrapper {
            width: 90%;
            max-width: 600px;
        }

        .glass-box {
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }
        
        /* NEW: Header for Home Button */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            text-align: left;
            margin-bottom: 20px;
        }
        .header-section h1, .header-section h2 { /* Apply to both h1 (game) and h2 (setup) */
            font-size: 2em;
            margin: 0;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            color: #e63946;
        }
        
        /* NEW: Home Button Style */
        .home-button {
            padding: 12px 25px; border: none; border-radius: 50px; background: #e63946;
            color: #fff; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            text-shadow: none;
            text-decoration: none;
            font-size: 0.9em;
            white-space: nowrap;
        }
        .home-button:hover {
            background: #457b9d; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        /* NEW: Setup Screen Styles */
        #setup-screen h2 { margin-top: 0; margin-bottom: 30px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .setup-option { margin-top: 30px; margin-bottom: 25px; font-size: 1.1em; } /* Added margin-top */
        .setup-option label { font-weight: 500; margin-right: 10px; }
        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-family: "Poppins", sans-serif;
            font-size: 1em;
            text-shadow: none;
        }
        select:focus { outline: none; border-color: #f7b731; }
        .start-btn {
            padding: 12px 30px; border: none; border-radius: 50px; background: #f7b731;
            color: #1d3557; font-size: 1.1em; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            text-shadow: none;
        }
        .start-btn:hover {
            transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }


        /* Game Content Styles */
        #game-container { display: none; } /* Hide game by default */
        
        #ticket-problem {
            padding: 20px; border-radius: 10px; margin-bottom: 25px; line-height: 1.6;
            text-align: left; background: rgba(0, 0, 0, 0.2);
        }
        #ticket-problem strong { color: #f1faee; font-weight: 700; }

        .option-btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 10px;
            font-size: 1em; font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            color: #f1faee;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px; cursor: pointer; text-align: left;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .option-btn:not(:disabled):hover { background-color: rgba(255, 255, 255, 0.2); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .option-btn.selected-correct { background-color: rgba(40, 167, 69, 0.4); border-color: #28a745; }
        .option-btn.selected-incorrect { background-color: rgba(220, 53, 69, 0.4); border-color: #dc3545; }

        #feedback { font-size: 1.2em; font-weight: 700; margin-top: 20px; height: 30px; }
        .correct { color: #28a745; text-shadow: 0 0 5px #28a745; }
        .incorrect { color: #e63946; text-shadow: 0 0 5px #e63946; }

        #score-display, #timer-display { font-size: 1.2em; margin-top: 15px; color: #f1faee; opacity: 0.8; }
        
        /* Hide old home link */
        .home-link { display: none; }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="main-wrapper">
        <div id="setup-screen" class="glass-box">
            <div class="header-section">
                <h2>Troubleshooting Tickets</h2>
                <a href="games.html" class="home-button" style="padding: 10px 20px;">🎮 Back to Arcade</a>
            </div>
            
            <div class="setup-option">
                <label for="num-tickets">How many tickets?</label>
                <select id="num-tickets">
                    <option value="5">5 Tickets</option>
                    <option value="10">10 Tickets</option>
                    <option value="all">All Tickets</option>
                </select>
            </div>
            <button id="start-btn" class="start-btn">Start Game</button>
        </div>

        <div id="game-container" class="glass-box">
            <div class="header-section">
                <h1>Troubleshooting Tickets</h1>
                <a href="index.html" class="home-button">🏠 Home Menu</a>
            </div>
            <div id="ticket-problem">Loading ticket...</div>
            <div id="options-container"></div>
            <div id="feedback"></div>
            <div id="score-display">Score: 0</div>
            <div id="timer-display">Time Left: 15</div>
        </div>
    </div>
    
    <a href="index.html" class="home-link">&larr; Back to Main Menu</a>

    <script>
        // Master list of all tickets
        const allTickets = [
            {
                problem: "A user reports their Windows desktop takes 15 minutes to appear after they log in. The issue seems to be related to their network profile.",
                options: {
                    a: "Slow profile load",
                    b: "Incorrect boot order",
                    c: "Faulty RAM"
                },
                answer: "a"
            },
            {
                problem: "A user's computer displays 'Missing operating system' on boot. You notice a USB drive is plugged in.",
                options: {
                    a: "Run 'sfc /scannow'",
                    b: "Modify the BIOS boot order",
                    c: "Reinstall Windows"
                },
                answer: "b"
            },
            {
                problem: "A computer on the manufacturing floor was identified as part of a botnet. What should be your absolute FIRST step?",
                options: {
                    a: "Run an anti-virus scan",
                    b: "Disconnect the network cable",
                    c: "Educate the end-user"
                },
                answer: "b"
            },
            {
                problem: "A user cannot access any HTTPS websites, getting a certificate error on all of them. HTTP sites work fine. What is a likely client-side cause?",
                options: {
                    a: "Incorrect IP address",
                    b: "Browser cache is full",
                    c: "System date and time is wrong"
                },
                answer: "c"
            },
            {
                problem: "An administrator needs to see which Group Policies are being applied to a specific workstation. Which command-line tool should they use?",
                options: {
                    a: "gpupdate /force",
                    b: "netstat",
                    c: "gpresult /r"
                },
                answer: "c"
            },
            {
                problem: "A user complains that after a driver update, Windows shows a Blue Screen of Death before the login screen appears. What feature can revert this change?",
                options: {
                    a: "System Restore",
                    b: "Disk Cleanup",
                    c: "Windows Reset"
                },
                answer: "a"
            },
             {
                problem: "A Linux administrator needs to change both the user and group ownership of a file named 'report.log' to 'jdoe' and 'sales' respectively.",
                options: {
                    a: "chmod jdoe:sales report.log",
                    b: "chown jdoe:sales report.log",
                    c: "mv report.log jdoe/sales"
                },
                answer: "b"
            },
            // Added more tickets for a better "all" option
            {
                problem: "A user's laptop screen is very dim, but you can see a faint image with a flashlight. What component has most likely failed?",
                options: { a: "The LCD display", b: "The video card (GPU)", c: "The display inverter or backlight" },
                answer: "c"
            },
            {
                problem: "A user's phone connects to the office Wi-Fi but has no internet. You see their IP is 169.254.10.20. What is the problem?",
                options: { a: "The phone is in Airplane Mode", b: "The DHCP server is down or unreachable", c: "The Wi-Fi password is wrong" },
                answer: "b"
            },
            {
                problem: "After a thunderstorm, a PC will not turn on. There is no fan spin and no lights. You've tested the wall outlet. What is the FIRST component to test?",
                options: { a: "The motherboard", b: "The Power Supply Unit (PSU)", c: "The CPU" },
                answer: "b"
            },
            {
                problem: "A user in accounting gets a browser pop-up stating their computer is 'locked' by the FBI and demands payment. What is this?",
                options: { a: "Spyware", b: "A rootkit", c: "Ransomware / Scareware" },
                answer: "c"
            },
            {
                problem: "You need to scan and repair corrupted system files on a Windows machine. Which command do you use?",
                options: { a: "sfc /scannow", b: "chkdsk /f", c: "bootrec /fixmbr" },
                answer: "a"
            }
        ];

        let gameTickets = []; // This array will hold the tickets for the current game
        let currentTicketIndex = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;

        // DOM Elements
        const setupScreenEl = document.getElementById('setup-screen');
        const gameContainerEl = document.getElementById('game-container');
        const startBtnEl = document.getElementById('start-btn');
        const numTicketsEl = document.getElementById('num-tickets');
        
        const problemEl = document.getElementById('ticket-problem');
        const optionsContainerEl = document.getElementById('options-container');
        const feedbackEl = document.getElementById('feedback');
        const scoreDisplayEl = document.getElementById('score-display');
        const timerDisplayEl = document.getElementById('timer-display');

        function showSetupScreen() {
            // Reset game state
            currentTicketIndex = 0;
            score = 0;
            gameTickets = [];
            clearInterval(timerInterval);

            // Show setup, hide game
            setupScreenEl.style.display = 'block';
            gameContainerEl.style.display = 'none';
        }

        function initializeGame() {
            const numToPlay = numTicketsEl.value;

            // Shuffle the master list
            allTickets.sort(() => 0.5 - Math.random());

            // Populate the gameTickets array based on selection
            if (numToPlay === 'all') {
                gameTickets = [...allTickets];
            } else {
                gameTickets = allTickets.slice(0, Number(numToPlay));
            }

            // Reset scores and counters
            currentTicketIndex = 0;
            score = 0;
            scoreDisplayEl.textContent = `Score: 0`;
            timerDisplayEl.style.display = 'block'; // Make sure timer is visible

            // Hide setup, show game
            setupScreenEl.style.display = 'none';
            gameContainerEl.style.display = 'block';

            loadTicket();
        }

        function loadTicket() {
            // Reset state
            feedbackEl.textContent = '';
            feedbackEl.className = '';
            optionsContainerEl.innerHTML = '';
            timeLeft = 15;
            timerDisplayEl.textContent = `Time Left: ${timeLeft}`;

            if (currentTicketIndex >= gameTickets.length) {
                endGame();
                return;
            }

            const currentTicket = gameTickets[currentTicketIndex];
            problemEl.innerHTML = `<strong>User Complaint:</strong> ${currentTicket.problem}`;

            for (const key in currentTicket.options) {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = currentTicket.options[key];
                button.dataset.answer = key;
                button.addEventListener('click', selectAnswer);
                optionsContainerEl.appendChild(button);
            }

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplayEl.textContent = `Time Left: ${timeLeft}`;
                if (timeLeft < 0) {
                    feedbackEl.textContent = 'Time is up! Moving to next.';
                    feedbackEl.className = 'incorrect';
                    clearInterval(timerInterval);
                    document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                    setTimeout(nextTicket, 2000);
                }
            }, 1000);
        }

        function selectAnswer(e) {
            clearInterval(timerInterval);
            const selected = e.target.dataset.answer;
            const correct = gameTickets[currentTicketIndex].answer;

            if (selected === correct) {
                score++;
                feedbackEl.textContent = 'Correct!';
                feedbackEl.className = 'correct';
            } else {
                feedbackEl.textContent = 'Incorrect!';
                feedbackEl.className = 'incorrect';
            }
            scoreDisplayEl.textContent = `Score: ${score}`;
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                if(btn.dataset.answer === correct) {
                    btn.classList.add('selected-correct');
                } else if (btn.dataset.answer === selected) {
                    btn.classList.add('selected-incorrect');
                }
            });

            setTimeout(nextTicket, 2000);
        }

        function nextTicket() {
            currentTicketIndex++;
            loadTicket();
        }

        function endGame() {
            clearInterval(timerInterval);
            problemEl.innerHTML = `<strong>Simulation Complete!</strong>`;
            optionsContainerEl.innerHTML = `<h2>Your final score is ${score} out of ${gameTickets.length}.</h2>
                                          <button id="play-again-btn" class="start-btn" style="margin-top: 20px;">Play Again</button>`;
            feedbackEl.textContent = '';
            timerDisplayEl.style.display = 'none';
            
            // Add event listener for the new "Play Again" button
            document.getElementById('play-again-btn').addEventListener('click', showSetupScreen);
        }

        // Start by showing the setup screen on page load
        document.addEventListener('DOMContentLoaded', showSetupScreen);
        // Add listener for the main start button
        startBtnEl.addEventListener('click', initializeGame);
    </script>
</body>
</html>

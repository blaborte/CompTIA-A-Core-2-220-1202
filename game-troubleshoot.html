<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troubleshooting Tickets | A+ Core 2 Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #a8dadc 0%, #457b9d 100%);
            overflow: hidden; padding: 20px; color: #fff;
            /* DEBUG FIX: Added text-shadow for global readability */
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.7; }
        .shape-1 { width: 300px; height: 300px; top: 10%; left: 15%; background: linear-gradient(to right, #e63946, #f1faee); }
        .shape-2 { width: 400px; height: 400px; bottom: 5%; right: 10%; background: linear-gradient(to right, #457b9d, #a8dadc); }

        #game-container {
            width: 90%; max-width: 600px; padding: 40px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        h1 { margin: 0 0 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); color: #e63946; }
        #ticket-problem {
            padding: 20px; border-radius: 10px; margin-bottom: 25px; line-height: 1.6;
            text-align: left; background: rgba(0, 0, 0, 0.2);
        }
        #ticket-problem strong { color: #f1faee; font-weight: 700; }

        .option-btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 10px;
            font-size: 1em; font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            color: #f1faee;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px; cursor: pointer; text-align: left;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .option-btn:not(:disabled):hover { background-color: rgba(255, 255, 255, 0.2); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .option-btn.selected-correct { background-color: rgba(40, 167, 69, 0.4); border-color: #28a745; }
        .option-btn.selected-incorrect { background-color: rgba(220, 53, 69, 0.4); border-color: #dc3545; }

        #feedback { font-size: 1.2em; font-weight: 700; margin-top: 20px; height: 30px; }
        .correct { color: #28a745; text-shadow: 0 0 5px #28a745; }
        .incorrect { color: #e63946; text-shadow: 0 0 5px #e63946; }

        #score-display, #timer-display { font-size: 1.2em; margin-top: 15px; color: #f1faee; opacity: 0.8; }
        .home-link {
            display: inline-block; margin-top: 25px; color: #fff; text-decoration: none; font-weight: 500;
            padding: 5px 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .home-link:hover { color: #457b9d; background: #f1faee; text-shadow: none; }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div id="game-container">
        <h1>Troubleshooting Tickets</h1>
        <div id="ticket-problem">Loading ticket...</div>
        <div id="options-container"></div>
        <div id="feedback"></div>
        <div id="score-display">Score: 0</div>
        <div id="timer-display">Time Left: 15</div>
    </div>
    <a href="index.html" class="home-link">&larr; Back to Main Menu</a>

    <script>
        const tickets = [
            {
                problem: "A user reports their Windows desktop takes 15 minutes to appear after they log in. The issue seems to be related to their network profile.",
                options: {
                    a: "Slow profile load",
                    b: "Incorrect boot order",
                    c: "Faulty RAM"
                },
                answer: "a"
            },
            {
                problem: "A user's computer displays 'Missing operating system' on boot. You notice a USB drive is plugged in.",
                options: {
                    a: "Run 'sfc /scannow'",
                    b: "Modify the BIOS boot order",
                    c: "Reinstall Windows"
                },
                answer: "b"
            },
            {
                problem: "A computer on the manufacturing floor was identified as part of a botnet. What should be your absolute FIRST step?",
                options: {
                    a: "Run an anti-virus scan",
                    b: "Disconnect the network cable",
                    c: "Educate the end-user"
                },
                answer: "b"
            },
            {
                problem: "A user cannot access any HTTPS websites, getting a certificate error on all of them. HTTP sites work fine. What is a likely client-side cause?",
                options: {
                    a: "Incorrect IP address",
                    b: "Browser cache is full",
                    c: "System date and time is wrong"
                },
                answer: "c"
            },
            {
                problem: "An administrator needs to see which Group Policies are being applied to a specific workstation. Which command-line tool should they use?",
                options: {
                    a: "gpupdate /force",
                    b: "netstat",
                    c: "gpresult /r"
                },
                answer: "c"
            },
            {
                problem: "A user complains that after a driver update, Windows shows a Blue Screen of Death before the login screen appears. What feature can revert this change?",
                options: {
                    a: "System Restore",
                    b: "Disk Cleanup",
                    c: "Windows Reset"
                },
                answer: "a"
            },
             {
                problem: "A Linux administrator needs to change both the user and group ownership of a file named 'report.log' to 'jdoe' and 'sales' respectively.",
                options: {
                    a: "chmod jdoe:sales report.log",
                    b: "chown jdoe:sales report.log",
                    c: "mv report.log jdoe/sales"
                },
                answer: "b"
            }
        ];

        let currentTicketIndex = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;

        const problemEl = document.getElementById('ticket-problem');
        const optionsContainerEl = document.getElementById('options-container');
        const feedbackEl = document.getElementById('feedback');
        const scoreDisplayEl = document.getElementById('score-display');
        const timerDisplayEl = document.getElementById('timer-display');

        function loadTicket() {
            // Reset state
            feedbackEl.textContent = '';
            feedbackEl.className = '';
            optionsContainerEl.innerHTML = '';
            timeLeft = 15;
            timerDisplayEl.textContent = `Time Left: ${timeLeft}`;

            if (currentTicketIndex >= tickets.length) {
                endGame();
                return;
            }

            const currentTicket = tickets[currentTicketIndex];
            problemEl.innerHTML = `<strong>User Complaint:</strong> ${currentTicket.problem}`;

            for (const key in currentTicket.options) {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = currentTicket.options[key];
                button.dataset.answer = key;
                button.addEventListener('click', selectAnswer);
                optionsContainerEl.appendChild(button);
            }

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplayEl.textContent = `Time Left: ${timeLeft}`;
                if (timeLeft < 0) {
                    feedbackEl.textContent = 'Time is up! Moving to next.';
                    feedbackEl.className = 'incorrect';
                    clearInterval(timerInterval);
                    document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                    setTimeout(nextTicket, 2000);
                }
            }, 1000);
        }

        function selectAnswer(e) {
            clearInterval(timerInterval);
            const selected = e.target.dataset.answer;
            const correct = tickets[currentTicketIndex].answer;

            if (selected === correct) {
                score++;
                feedbackEl.textContent = 'Correct!';
                feedbackEl.className = 'correct';
            } else {
                feedbackEl.textContent = 'Incorrect!';
                feedbackEl.className = 'incorrect';
            }
            scoreDisplayEl.textContent = `Score: ${score}`;
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                if(btn.dataset.answer === correct) {
                    btn.classList.add('selected-correct');
                } else if (btn.dataset.answer === selected) {
                    btn.classList.add('selected-incorrect');
                }
            });

            setTimeout(nextTicket, 2000);
        }

        function nextTicket() {
            currentTicketIndex++;
            loadTicket();
        }

        function endGame() {
            clearInterval(timerInterval);
            problemEl.innerHTML = `<strong>Simulation Complete!</strong>`;
            optionsContainerEl.innerHTML = `<h2>Your final score is ${score} out of ${tickets.length}.</h2>`;
            feedbackEl.textContent = '';
            timerDisplayEl.style.display = 'none';
        }

        // Start the game by shuffling tickets
        tickets.sort(() => 0.5 - Math.random());
        loadTicket();
    </script>
</body>
</html>

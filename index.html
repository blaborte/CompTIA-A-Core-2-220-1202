<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA A+ Practice Exams</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px S20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            text-align: center;
        }

        header {
            background-color: #4a90e2;
            color: white;
            padding: 30px 20px;
        }
        
        header h1 {
            margin: 0;
            font-size: 1.8em;
        }
        
        header p {
            margin: 5px 0 0;
            opacity: 0.9;
        }

        nav {
            padding: 30px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav li {
            margin-bottom: 15px;
        }

        nav a {
            display: block;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            color: #4a90e2;
            font-size: 1.2em;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
        }

        nav a:hover {
            background-color: #e9ecef;
            border-color: #c7ced4;
            transform: translateY(-2px);
        }
        
        footer {
            padding: 20px;
            font-size: 0.9em;
            color: #888;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Professor Messer's CompTIA A+ Core 2 (220-1202)</h1>
            <p>Practice Exams</p>
        </header>
        <nav>
            <ul>
                <li><a href="Practice Exam A.html">Practice Test A</a></li>
                <li><a href="Practice Exam B.html">Practice Test B</a></li>
                <li><a href="Practice Exam C.html">Practice Test C</a></li>
            </ul>
        </nav>
        <footer>
            Created by: BLaborte
        </footer>
    </div>
</body>
</html>

        {"id": "A79", "question": "While using a Windows laptop during presentations, a company vice president has reported her system is interrupting the meeting with system notifications. Which of the following would be the best way to address this issue?", "options": {"A": "Use a different laptop for presentations", "B": "Run the presentation software as Administrator", "C": "Enable Airplane mode while presenting", "D": "Disable notifications while specific applications are running"}, "answer": "D", "explanation": {"correct": "D. Disable notifications while specific applications are running", "A": "Incorrect. This is an impractical workaround.", "B": "Incorrect. Running as Administrator will not suppress notifications.", "C": "Incorrect. Airplane mode would disable network connectivity, which might be needed for the presentation.", "D": "Correct. Windows includes a feature called Focus Assist that can be configured to automatically **suppress most notifications** when an application (like PowerPoint) is in **full-screen mode**, which is ideal for presentations."}},
        {"id": "A80", "question": "A system administrator needs to upgrade a training room of twenty systems to the latest Windows version. Which of the following would be the most efficient method of performing this upgrade process?", "options": {"A": "Recovery partition", "B": "Remote network installation", "C": "Repair installation", "D": "USB key"}, "answer": "B", "explanation": {"correct": "B. Remote network installation", "A": "Incorrect. The recovery partition would restore the original OS, not upgrade it.", "B": "Correct. For deploying or upgrading a large number of computers (like twenty systems), a **remote network installation** using services like Windows Deployment Services (WDS) or Microsoft Endpoint Configuration Manager is the most efficient and scalable method.", "C": "Incorrect. A repair installation fixes the current OS.", "D": "Incorrect. Using a USB key for each of the twenty systems would be very time-consuming and inefficient compared to a network installation."}},
        {"id": "A81", "question": "A user has opened a help desk ticket for application slowdowns and unwanted pop-up windows. After quarantining the system and removing the malware, the technician has scheduled future scans and signature updates. Which of the following should be the next step in the removal process?", "options": {"A": "Disable System Restore", "B": "Update the anti-virus signatures", "C": "Quarantine the system", "D": "Educate the end user"}, "answer": "D", "explanation": {"correct": "D. Educate the end user", "A": "Incorrect. Disabling System Restore should have been done before the remediation step.", "B": "Incorrect. Updating signatures should have been done before the scan.", "C": "Incorrect. Quarantining the system is the first step.", "D": "Correct. According to the CompTIA troubleshooting methodology, the final step after resolving the issue and implementing preventative measures is to **educate the end-user** on how to avoid the issue in the future."}},
        {"id": "A82", "question": "An employee at a company is responsible for determining the correct access controls for each user, manage the authentication process, and track all access to network resources. Which of the following would best describe this employee's job function?", "options": {"A": "PAM", "B": "DLP", "C": "MDM", "D": "IAM"}, "answer": "D", "explanation": {"correct": "D. IAM", "A": "Incorrect. PAM (Privileged Access Management) is a subset of IAM that focuses specifically on high-level administrator accounts.", "B": "Incorrect. DLP (Data Loss Prevention) focuses on preventing sensitive data from leaving the network.", "C": "Incorrect. MDM (Mobile Device Management) focuses on managing mobile devices.", "D": "Correct. **IAM (Identity and Access Management)** is the broad security discipline that covers managing **user identities, authentication, authorization, and access controls** for all resources."}},
        {"id": "A83", "question": "A user in the accounting department has opened a help desk ticket due to problems accessing the website of the company’s payroll service provider. When troubleshooting, the technician finds many pop-up windows are displayed. Which of the following would be the best way for the technician to resolve this issue?", "options": {"A": "Uninstall the browser and reinstall with a different version", "B": "Restore the workstation from a known good backup", "C": "Start in Safe Mode and connect to the payroll website", "D": "Modify the browser’s proxy settings"}, "answer": "B", "explanation": {"correct": "B. Restore the workstation from a known good backup", "A": "Incorrect. Reinstalling the browser may not remove the underlying malware causing the pop-ups.", "B": "Correct. A system exhibiting many pop-up windows is likely heavily infected with malware or adware. The most reliable and efficient way to ensure the system is completely clean and trustworthy, especially for a user who accesses sensitive financial data, is to wipe the drive and **restore it from a known-good backup**.", "C": "Incorrect. While Safe Mode can help with troubleshooting, it does not guarantee a clean state for accessing a sensitive website.", "D": "Incorrect. The pop-ups are likely caused by malware, not incorrect proxy settings."}},
        {"id": "A84", "question": "A business partner in a different country needs to access an internal company server during the very early morning hours. This server will be exposed to the Internet. Which of these would be the most important security task to perform on this server?", "options": {"A": "Install the latest OS patches", "B": "Remove the server from the Active Directory domain", "C": "Use only 64-bit applications", "D": "Run a weekly anti-virus scan"}, "answer": "A", "explanation": {"correct": "A. Install the latest OS patches", "A": "Correct. Any server exposed to the Internet is a primary target for attackers. The single most important security task is to keep the operating system and all applications **fully patched** to close known security holes.", "B": "Incorrect. Removing the server from the domain may be a valid hardening step, but patching is more critical.", "C": "Incorrect. The application architecture (64-bit vs 32-bit) is not a primary security concern.", "D": "Incorrect. A weekly scan is good, but proactive patching is far more important than reactive scanning."}},
        {"id": "A85", "question": "A Linux administrator has been asked to upgrade the web server software on a device. Which of the following would provide the administrator with the appropriate rights and permissions for this upgrade?", "options": {"A": "chmod", "B": "apt", "C": "dig", "D": "sudo"}, "answer": "D", "explanation": {"correct": "D. sudo", "A": "Incorrect. 'chmod' is used to change file permissions.", "B": "Incorrect. 'apt' is a package manager used to perform the installation, but it often requires elevated privileges to run.", "C": "Incorrect. 'dig' is a tool for DNS lookups.", "D": "Correct. '**sudo**' (superuser do) is a command that allows a permitted user to execute a command as the superuser or another user. It is the standard way to gain the necessary **administrative rights** to perform tasks like software upgrades."}},
        {"id": "A86", "question": "A user is connecting their laptop to an external monitor and keyboard, but the laptop goes into sleep mode if the laptop screen is shut. Which of the following utilities can be used to keep the laptop running when the lid is closed?", "options": {"A": "Power Options", "B": "Device Manager", "C": "Personalization", "D": "User Accounts"}, "answer": "A", "explanation": {"correct": "A. Power Options", "A": "Correct. The **Power Options** applet in the Windows Control Panel allows users to customize what the computer does when the power button is pressed or the **lid is closed**. This is where you would change the setting from 'Sleep' to 'Do nothing'.", "B": "Incorrect. Device Manager is for hardware management.", "C": "Incorrect. Personalization settings control the desktop appearance.", "D": "Incorrect. User Accounts is for managing user profiles and passwords."}},
        {"id": "A87", "question": "A network administrator is configuring a wireless network at a small office. The administrator would like to exclude a single kiosk in the lobby from having network access. Which of the following configuration settings would meet this requirement?", "options": {"A": "SSID suppression", "B": "Content filtering", "C": "Secure management access", "D": "DHCP reservation", "E": "MAC filtering"}, "answer": "E", "explanation": {"correct": "E. MAC filtering", "A": "Incorrect. SSID suppression hides the network name but does not block devices.", "B": "Incorrect. Content filtering blocks access to certain websites but does not block network access entirely.", "C": "Incorrect. This secures access to the router's configuration page.", "D": "Incorrect. A DHCP reservation assigns a specific IP address to a device; it does not block it.", "E": "Correct. **MAC filtering** allows an administrator to create a list of hardware **MAC addresses** that are either permitted or **denied access to the network**. By adding the kiosk's MAC address to a blocklist, it can be excluded."}},
        {"id": "A88", "question": "A company maintains a Windows system in the conference room for use during meetings. The system is rarely used, has not received any recent updates and will no longer connect to the corporate network. Which of the following would be the most likely reason for this issue?", "options": {"A": "BIOS administrator password is enabled", "B": "No users are actively logged in", "C": "Firewall is filtering traffic", "D": "Guest accounts are disabled"}, "answer": "C", "explanation": {"correct": "C. Firewall is filtering traffic", "A": "Incorrect. A BIOS password would prevent the system from booting, not from connecting to the network.", "B": "Incorrect. A connection can be established before a user logs in.", "C": "Correct. Many corporate networks use Network Access Control (NAC) systems. A computer that is missing critical security updates would be deemed non-compliant, and the network **firewall** (as part of the NAC solution) would **block its traffic**.", "D": "Incorrect. Guest accounts are unrelated to the machine's ability to connect to the network."}},
        {"id": "A89", "question": "A company is deploying laptops to all of their field sales teams. The company is concerned about protecting the security of data if the laptop is stolen or misplaced. Which of the following would be the best way to address this concern?", "options": {"A": "Multifactor authentication", "B": "Strong password policies", "C": "Unique device certificates", "D": "Data-at-rest encryption"}, "answer": "D", "explanation": {"correct": "D. Data-at-rest encryption", "A": "Incorrect. MFA protects the login process but does not protect the data if the hard drive is removed from the laptop.", "B": "Incorrect. A strong password protects the login but does not protect the physical data on the drive.", "C": "Incorrect. Device certificates are for authentication, not data protection.", "D": "Correct. **Data-at-rest encryption**, such as Windows BitLocker, encrypts the entire contents of the hard drive. If the laptop is stolen and the drive is removed, the data remains unreadable without the decryption key."}},
        {"id": "A90", "question": "A company has discovered a recent data breach. The investigation found that the attacker gained access through a vulnerability introduced with a third-party software upgrade. Which of the following would best describe this attack type?", "options": {"A": "Supply chain attack", "B": "Insider threat", "C": "Business email compromise", "D": "On-path attack"}, "answer": "A", "explanation": {"correct": "A. Supply chain attack", "A": "Correct. A **supply chain attack** is a cyberattack that targets a trusted **third-party vendor or software provider** that is part of an organization's supply chain. By compromising the vendor, the attacker can distribute malware or gain access to all of the vendor's customers.", "B": "Incorrect. An insider threat comes from a current or former employee.", "C": "Incorrect. Business email compromise is a phishing attack targeting specific employees.", "D": "Incorrect. An on-path attack intercepts traffic between two parties."}}
    ];
    
    const dionTraining = [
        {"id": "D1", "question": "A customer is complaining that they cannot connect to the local network share drive. You run the command 'ipconfig /all' from their workstation, and it returns an IP of 169.254.34.12. Which of the following is the problem with this workstation?", "options": {"A": "The workstation couldn't reach the DHCP server", "B": "The workstation couldn't reach the gateway", "C": "The workstation couldn’t reach the proxy server", "D": "The workstation couldn't reach the DNS server"}, "answer": "A", "explanation": {"correct": "A. The workstation couldn't reach the DHCP server", "A": "Correct. Since the customer's IP address is **169.254.34.12**, it is an **APIPA** address. This means the **DHCP server was unreachable**.", "B": "Incorrect. The workstation couldn't reach the gateway, proxy, or DNS server, which are secondary issues; the primary cause of an APIPA address is the inability to reach the DHCP server.", "C": "Incorrect. The workstation couldn't reach the gateway, proxy, or DNS server, which are secondary issues; the primary cause of an APIPA address is the inability to reach the DHCP server.", "D": "Incorrect. The workstation couldn't reach the gateway, proxy, or DNS server, which are secondary issues; the primary cause of an APIPA address is the inability to reach the DHCP server."}},
        {"id": "D2", "question": "Jason is using a Windows 10 workstation in the Dion Training conference room. The workstation is acting extremely slow and he suspects there are other accounts logged on to the workstation. Which of the following features in the Task Manager should he use to identify if anyone else is currently logged on to the workstation?", "options": {"A": "Users", "B": "Performance", "C": "Services", "D": "Processes"}, "answer": "A", "explanation": {"correct": "A. Users", "A": "Correct. The **Users tab** in the **Task Manager** shows a list of signed-in users and their running processes on the workstation.", "B": "Incorrect. The Performance tab monitors resource utilization (CPU, memory, etc.), not actively logged-in user accounts.", "C": "Incorrect. The Services tab lists all installed services on the computer, not logged-in user accounts.", "D": "Incorrect. The Processes tab shows running apps and services but is not the most direct view for all logged-in user accounts."}},
        {"id": "D3", "question": "Jennifer contacts the help desk, reporting that their smartphone's data usage has significantly increased over the past few days without any change in usage habits. They have received several notifications warning that they are nearing their data limit, and when browsing, they encounter a high number of pop-up ads. Upon further investigation, Jennifer recalls installing a free app from an unofficial source a week ago. Which of the following would be the best solution to address the issue in this scenario?", "options": {"A": "Uninstall the mentioned application and run a mobile malware scan", "B": "Increase the data limit through the carrier’s service settings", "C": "Reset the phone to factory settings without backing up the affected data", "D": "Disable mobile data and connect only to Wi-Fi networks"}, "answer": "A", "explanation": {"correct": "A. Uninstall the mentioned application and run a mobile malware scan", "A": "Correct. High data usage, excessive pop-up ads, and recent app installation from an unofficial source are classic signs of a malicious application. **Uninstalling the app and performing a malware scan** directly addresses the root cause.", "B": "Incorrect. Increasing the data limit ignores the underlying problem.", "C": "Incorrect. A factory reset is a last resort after other solutions fail.", "D": "Incorrect. Simply switching to Wi-Fi does not resolve the malware issue."}},
        {"id": "D4", "question": "An employee at Dion Training complains that every time airplane mode is enabled on their laptop, their external mouse and headphones stop working. Which of the following technologies is being disabled by airplane mode and likely causing the issues experienced by this user?", "options": {"A": "Cellular", "B": "Bluetooth", "C": "Wireless", "D": "GPS"}, "answer": "B", "explanation": {"correct": "B. Bluetooth", "A": "Incorrect. Cellular is disabled but not the cause of the mouse and headphone issue.", "B": "Correct. **Bluetooth** is a wireless connectivity method usually used by external mice and wireless headphones. When **airplane mode is enabled**, the Bluetooth radio is usually disabled, causing issues with Bluetooth-connected devices.", "C": "Incorrect. Wireless (Wi-Fi) is disabled, but this is less likely to affect a standard wireless mouse and headphones than Bluetooth.", "D": "Incorrect. GPS is disabled but is not typically used for connecting a mouse or headphones."}},
        {"id": "D5", "question": "Which type of installation would require an answer file to install the operating system?", "options": {"A": "Upgrade", "B": "Clean", "C": "Unattended", "D": "Repair"}, "answer": "C", "explanation": {"correct": "C. Unattended", "A": "Incorrect. An upgrade is an in-place installation which retains user data and settings.", "B": "Incorrect. A clean install is a fresh installation where all data is deleted.", "C": "Correct. An **unattended installation** is a traditional method of deploying an OS using an **answer file** that contains user input to various GUI dialog boxes that would otherwise appear during the installation process.", "D": "Incorrect. A repair is used to check and replace any modified system files."}},
        {"id": "D6", "question": "Both Apple and Samsung have released their own version of contactless mobile payment solutions. For example, Apple Pay allows users to place their iPhone or Apple Watch within an inch of a credit card machine at a store to make a payment. Which of the following wireless technologies do these types of payment systems rely upon?", "options": {"A": "Bluetooth", "B": "Infrared", "C": "NFC", "D": "Wi-Fi"}, "answer": "C", "explanation": {"correct": "C. NFC", "A": "Incorrect. Bluetooth is a wireless technology standard used for exchanging data over short distances, but typically more than 4 cm.", "B": "Incorrect. Infrared requires a direct line of sight and is not used for mobile payment.", "C": "Correct. **NFC**, or Near-Field Communication, is a set of communication protocols that enable two electronic devices to establish communication by bringing them within **4 cm of each other**. This is commonly used for contactless payment systems.", "D": "Incorrect. Wi-Fi is used for general networking over longer distances, not for ultra-short-range contactless payment."}},
        {"id": "D7", "question": "Tamera just purchased a Wi-Fi-enabled Nest Thermostat for her home. She has hired you to install it, but she is worried about a hacker breaking into the thermostat since it is an IoT device. Which of the following is the BEST thing to do to mitigate Tamera's security concerns? (Select TWO)", "options": {"A": "Disable wireless connectivity to the thermostat to ensure a hacker cannot access it", "B": "Enable two-factor authentication on the device's website (if supported by the company)", "C": "Configure the thermostat to connect to the wireless network using WPA2 encryption and a long, strong password (if supported)", "D": "Configure the thermostat to use the WEP encryption standard for additional confidentiality", "E": "Upgrade the firmware of the wireless access point to the latest version to improve the security of the network", "F": "Configure the thermostat to use a segregated part of the network by installing it into a screened subnet"}, "answer": ["C", "F"], "explanation": {"correct": "C & F. Configure the thermostat to connect to the wireless network using WPA2 encryption and a long, strong password (if supported) AND Configure the thermostat to use a segregated part of the network by installing it into a screened subnet", "A": "Incorrect. Disabling wireless connectivity makes the device ineffective.", "B": "Incorrect. Enabling 2FA on the *website* is good practice but won't increase the *device's* network security.", "C": "Correct. Using strong encryption (**WPA2** is standard, WPA3 is better if available) and a strong password protects the wireless connection.", "D": "Incorrect. **WEP** is considered a weak and outdated encryption scheme.", "E": "Incorrect. Upgrading the WAP's firmware is good for security, but it isn't specific to the IoT device's network security configuration.", "F": "Correct. Placing IoT devices in a **DMZ/screened subnet** segregates them from the production network, limiting potential damage from a compromise."}},
        {"id": "D8", "question": "Which version should you use when installing a Linux operating system and are concerned with end-of-life support?", "options": {"A": "LTS release", "B": "Rolling release", "C": "Developer release", "D": "Beta release"}, "answer": "A", "explanation": {"correct": "A. LTS release", "A": "Correct. The **LTS (Long-Term Support) release** is well-supported and will be regularly updated by the Linux distribution for an extended period, making it ideal for production systems like servers where **stability and longevity** are critical.", "B": "Incorrect. Rolling releases are frequently updated over time and lack the stable, long-term support window of an LTS version.", "C": "Incorrect. Developer releases are pre-releases for software developers.", "D": "Incorrect. Beta releases are pre-releases given out to a large group of users for real-world testing."}},
        {"id": "D9", "question": "Which of the following best describes how cloud-based spreadsheets enhance team collaboration?", "options": {"A": "Each user must download and re-upload the file to apply their updates.", "B": "Editing is locked while another user is working to prevent conflicts.", "C": "Changes made by one user appear in real time for all users with access.", "D": "Only the spreadsheet owner can view or modify the document."}, "answer": "C", "explanation": {"correct": "C. Changes made by one user appear in real time for all users with access.", "A": "Incorrect. Downloading and re-uploading files would create version control issues and slow collaboration.", "B": "Incorrect. Cloud-based spreadsheets allow **simultaneous editing**, not locking for a single user.", "C": "Correct. Cloud-based spreadsheets allow multiple users to make edits simultaneously, with **real-time updates** visible to everyone with access, which is the core benefit for team collaboration.", "D": "Incorrect. Spreadsheet owners can allow multiple users to view and edit to facilitate collaboration."}},
        {"id": "D10", "question": "A system administrator needs to remotely execute PowerShell commands on multiple Windows servers without requiring direct remote desktop access. The solution should allow secure command-line management using standard web-based protocols. Which of the following tools would BEST meet this requirement?", "options": {"A": "SSH", "B": "WinRM", "C": "RDP", "D": "SNMP"}, "answer": "B", "explanation": {"correct": "B. WinRM", "A": "Incorrect. SSH is primarily used for secure remote access on Linux-based systems, though it can be configured for Windows.", "B": "Correct. **Windows Remote Management (WinRM)** allows administrators to execute remote **PowerShell commands** and manage Windows systems securely over a network using web-based protocols such as WS-Management. It is commonly used for remote scripting and automation.", "C": "Incorrect. Remote Desktop Protocol (RDP) provides graphical remote access but is not optimized for command-line automation.", "D": "Incorrect. Simple Network Management Protocol (SNMP) is used for monitoring and managing network devices but does not allow remote execution of commands."}},
        {"id": "D11", "question": "The physical security manager has asked you to assist with the risk assessment of some proposed new security measures. The manager is concerned that during a power outage, the server room might be targeted for attack. Luckily, they have many different protection measures in place to keep intruders out of the server room. During a power outage, which of the following security controls would still be usable?", "options": {"A": "Motion detectors", "B": "Biometric scanners", "C": "Door locks", "D": "Video surveillance"}, "answer": "C", "explanation": {"correct": "C. Door locks", "A": "Incorrect. Motion detectors require power to function and operate.", "B": "Incorrect. Biometric scanners require power to function and operate.", "C": "Correct. A traditional **door lock** doesn't require power to operate. Therefore, it will still protect the facility and keep the intruder out of the server room, even during a power outage.", "D": "Incorrect. Video surveillance requires power to function and operate."}},
        {"id": "D12", "question": "You noticed that your personal files in your Dropbox had been accessed while you were sleeping. Which of the following threats is this an example of?", "options": {"A": "Unauthorized location tracking", "B": "Unauthorized account access", "C": "Unauthorized microphone activation", "D": "Unintended Bluetooth pairing"}, "answer": "B", "explanation": {"correct": "B. Unauthorized account access", "A": "Incorrect. This refers to location-based data being accessed, not files in cloud storage.", "B": "Correct. When files are accessed without authorization from your cloud storage service, it is an example of **unauthorized account access**.", "C": "Incorrect. This refers to the microphone being activated remotely.", "D": "Incorrect. This refers to anonymous devices connecting to a Bluetooth-enabled device."}},
        {"id": "D13", "question": "A computer is infected with malware that has infected the Windows kernel to hide. Which type of malware MOST likely infected this computer?", "options": {"A": "Trojan", "B": "Ransomware", "C": "Botnet", "D": "Rootkit"}, "answer": "D", "explanation": {"correct": "D. Rootkit", "A": "Incorrect. A Trojan is malware disguised as legitimate software, but does not specifically target the kernel to hide its presence.", "B": "Incorrect. Ransomware encrypts files and demands a ransom payment.", "C": "Incorrect. A botnet is a network of infected computers controlled by an attacker.", "D": "Correct. A **rootkit** is designed to provide continued privileged access to a computer while actively hiding its presence, often operating at the **kernel level** to disguise itself from detection."}},
        {"id": "D14", "question": "A system administrator has noticed that an employee's account has been attempting to log in to multiple workstations and servers across the network. This employee does not have access to these systems, and the login attempts are unsuccessful. Which of the following actions should the administrator do to this employee's account in Active Directory?", "options": {"A": "Reset the password of the user's account", "B": "Delete the user's account", "C": "Lock the user's account", "D": "Disable the user's account"}, "answer": "D", "explanation": {"correct": "D. Disable the user's account", "A": "Incorrect. Resetting the password would not solve the issue if the account has been compromised or if the user is malicious.", "B": "Incorrect. Deleting the account would remove the user and their files from the system.", "C": "Incorrect. A lockout occurs automatically when the failed login attempts threshold is met; an administrator can **disable an account** to immediately prevent further attempts.", "D": "Correct. The system administrator should **disable the user's account** to immediately prevent further login attempts while an investigation is conducted."}},
        {"id": "D15", "question": "Shirley is a project manager who has been assigned to create internal training materials for the company’s new IT security policies. Instead of writing original content, she decides it would be easier and take much less time to copy large sections from an external website without proper attribution. The IT manager notices this and informs the employee that their actions violate company policies and ethical standards. Which of the following BEST describes this issue?", "options": {"A": "Insider threat", "B": "Plagiarism", "C": "Data exfiltration", "D": "Copyright infringement"}, "answer": "B", "explanation": {"correct": "B. Plagiarism", "A": "Incorrect. Insider threat refers to an employee intentionally harming or compromising company security, which does not apply here.", "B": "Correct. **Plagiarism** is the best classification because it involves using someone else's work or ideas **without proper attribution**, which violates ethical and professional standards.", "C": "Incorrect. Data exfiltration refers to unauthorized data transfer or theft.", "D": "Incorrect. Copyright infringement is a legal matter; plagiarism is the ethical/professional breach in an internal business setting."}},
        {"id": "D16", "question": "When using an MBR, which of the following types of partitions can only have up to four partitions?", "options": {"A": "Extended", "B": "Swap", "C": "Logical", "D": "Primary"}, "answer": "D", "explanation": {"correct": "D. Primary", "A": "Incorrect. Extended partitions can be divided into additional logical drives to overcome the four-partition limit.", "B": "Incorrect. Swap partitions are used for memory management in Linux and are not limited by the four-partition rule in the same way.", "C": "Incorrect. Logical partitions are contained within an extended partition.", "D": "Correct. **Primary partitions** are limited to only **four partitions** on a system using the **Master Boot Record (MBR)** partition style."}},
        {"id": "D17", "question": "You just received your monthly smartphone bill. As you review your charges, you notice that this month shows three times as much data usage as a normal month. You don't remember changing your usage pattern, so there should not have been a large increase in data used. Which of the following should you do FIRST to determine the source of the increased usage?", "options": {"A": "Enable biometric login for the lock screen to ensure no one else uses your device", "B": "Check network permissions and data usage for any applications installed within the last month", "C": "Conduct a factory restore of the smartphone and reload your applications", "D": "Configure your applications to only download large files over WiFi"}, "answer": "B", "explanation": {"correct": "B. Check network permissions and data usage for any applications installed within the last month", "A": "Incorrect. Biometric login is a security measure but won't identify the cause of data usage.", "B": "Correct. You should **FIRST check your network permissions and data usage** for any applications installed within the last month, as some applications use background processes to download data, which can cause a large increase in data usage.", "C": "Incorrect. A factory restore is a drastic and last-resort measure.", "D": "Incorrect. This is a preventative measure, but it won't identify the source of the *current* increase."}},
        {"id": "D18", "question": "Which of the following backup rotation schemes requires backups to be stored to at least two different types of media?", "options": {"A": "Tower of Hanoi", "B": "Grandfather-father-son", "C": "3-2-1 backup", "D": "FIFO Backup"}, "answer": "C", "explanation": {"correct": "C. 3-2-1 backup", "A": "Incorrect. The Tower of Hanoi is a rotation scheme for media sets.", "B": "Incorrect. Grandfather-father-son (GFS) is a rotation scheme that combines full and incremental backups.", "C": "Correct. The **3-2-1 backup** rule states that an organization should create (3) one primary backup and two copies, (2) save the backups to **two different types of media**, and (1) keep at least one backup copy off-site.", "D": "Incorrect. First In First Out (FIFO) is a simple rotation scheme that overwrites the oldest tape with the newest information."}},
        {"id": "D19", "question": "Which of the following types of installations would require the use of an XML text file containing the instructions that the Windows Setup program would need to complete the installation?", "options": {"A": "Repair installation", "B": "In-place upgrade", "C": "Remote network installation", "D": "Unattended installation"}, "answer": "D", "explanation": {"correct": "D. Unattended installation", "A": "Incorrect. A repair installation replaces existing OS files with a new copy of the same version.", "B": "Incorrect. An in-place upgrade preserves applications, user settings, and data files.", "C": "Incorrect. Remote network installation is a *method* of delivery, often *used* with unattended installation.", "D": "Correct. An **unattended installation** requires the use of an **XML text file** (answer file) containing all of the instructions the Windows Setup program needs without administrator intervention."}},
        {"id": "D20", "question": "Margaret comes to you with complaints that her web browser is flooded with pop-up ads and new tabs open automatically, even when the browser is idle. She mentions recently downloading a free game from one of her favorite websites that she often uses. The browser homepage and default search engine have also changed without their consent. Which of the following would be the best solution to eliminate the excessive ads and browser changes?", "options": {"A": "Remove and reinstall the browser to reset all of the settings to default", "B": "Disable the use of JavaScript in the browser settings", "C": "Uninstall the recently downloaded app and perform a malware scan", "D": "Clear the browser's cache and cookies, then reboot the system"}, "answer": "C", "explanation": {"correct": "C. Uninstall the recently downloaded app and perform a malware scan", "A": "Incorrect. Reinstalling the browser may not remove the underlying malware/adware.", "B": "Incorrect. Disabling JavaScript is a common security precaution, but it is not a comprehensive solution for this scenario.", "C": "Correct. An influx of pop-up ads, homepage changes, and automatic new tabs strongly indicate **adware or a browser hijacker** linked to the recently downloaded app. The best solution is to **uninstall the suspicious application and run a malware scan**.", "D": "Incorrect. Clearing cache and cookies may improve performance but won't remove malware."}},
        {"id": "D21", "question": "Which of the following commands is used on a Linux system to copy a file from one directory to another directory?", "options": {"A": "rm", "B": "cp", "C": "ls", "D": "mv"}, "answer": "B", "explanation": {"correct": "B. cp", "A": "Incorrect. The 'rm' command removes (deletes) files or directories.", "B": "Correct. The **'cp'** command is a command-line utility for **copying** files and directories.", "C": "Incorrect. The 'ls' command lists the files or directories in the current path.", "D": "Incorrect. The 'mv' command moves (or renames) files or directories."}},
        {"id": "D22", "question": "A technician is trying to locate a protected .dll file to edit, but they cannot see it in the System32 folder. Which Control Panel utility should the technician use to find the file?", "options": {"A": "File Explorer Options", "B": "System", "C": "Indexing Options", "D": "Programs and Features"}, "answer": "A", "explanation": {"correct": "A. File Explorer Options", "A": "Correct. The **File Explorer Options** (or Folder Options) utility allows technicians to enable the display of **hidden files** and folders, which is necessary to see protected system files like DLLs in System32.", "B": "Incorrect. The System section shows information about the workstation (processor, memory, OS version).", "C": "Incorrect. Indexing Options configures the method used by Windows when searching for content.", "D": "Incorrect. Programs and Features is used to install or remove applications, software packages, and features."}},
        {"id": "D23", "question": "A user contacts the service desk after they just finished attempting to upgrade their laptop to Windows 10. The upgrade failed, and the user asks you to explain why. Which of the following log files should you review to determine the cause of the upgrade failure?", "options": {"A": "Application log", "B": "Security log", "C": "Setup log", "D": "System log"}, "answer": "C", "explanation": {"correct": "C. Setup log", "A": "Incorrect. The Application log contains information regarding application errors.", "B": "Incorrect. The Security log contains information regarding audit data and security.", "C": "Correct. The **setup log** contains a record of the events generated during the Windows **installation or upgrade process**.", "D": "Incorrect. The System log contains information about service load failures, hardware conflicts, and driver load failures."}},
        {"id": "D24", "question": "A technician needs to add new features to an existing router on the network. Which of the following should be performed to add the new features?", "options": {"A": "Migrating to IPv6", "B": "Firmware update", "C": "Clone the router", "D": "Vulnerability patching"}, "answer": "B", "explanation": {"correct": "B. Firmware update", "A": "Incorrect. Migrating to IPv6 is a networking change, not a feature addition for the hardware itself.", "B": "Correct. A **firmware update** will upgrade your device's advanced operational instructions and can **provide new features or functions** to an existing device.", "C": "Incorrect. Cloning is a process for computer systems; routers can be backed up and restored, but not cloned.", "D": "Incorrect. Vulnerability patching will mitigate software bugs, but it will not add new features to an existing device."}},
        {"id": "D25", "question": "You are working as a server administrator at Dion Training. You unlock the server room door using your proximity badge and walk through the door. Before the door shuts, another person walks in behind you. What social engineering technique did this person utilize?", "options": {"A": "Impersonation", "B": "Shoulder surfing", "C": "Tailgating", "D": "Spoofing"}, "answer": "C", "explanation": {"correct": "C. Tailgating", "A": "Incorrect. Impersonation is the act of pretending to be someone or something else.", "B": "Incorrect. Shoulder surfing is obtaining confidential data by looking over the victim's shoulder.", "C": "Correct. **Tailgating** (or piggybacking) is a physical security breach where an unauthorized person **follows close behind an authorized person** into a restricted area.", "D": "Incorrect. Spoofing is the act of disguising a communication from an unknown source as being from a known, trusted source."}},
        {"id": "D26", "question": "A manager wants employees to enter data in a shared spreadsheet but needs to prevent accidental modifications to formulas. What is the best way to achieve this?", "options": {"A": "Lock the formula cells while keeping data entry fields editable.", "B": "Require employees to submit data separately for manual entry.", "C": "Convert the spreadsheet to a static file format, preventing further edits.", "D": "Set the entire spreadsheet to read-only mode so no changes can be made."}, "answer": "A", "explanation": {"correct": "A. Lock the formula cells while keeping data entry fields editable.", "A": "Correct. **Locking formula cells** while keeping data entry fields editable is the most effective and common feature in collaborative spreadsheets for protecting intellectual property (formulas) while allowing data input.", "B": "Incorrect. Requiring separate data submissions slows efficiency and removes the benefit of real-time collaboration.", "C": "Incorrect. Converting the file to a static format prevents all edits.", "D": "Incorrect. Setting the entire spreadsheet to read-only would prevent any updates."}},
        {"id": "D27", "question": "Which of the following is a connectionless protocol that utilizes on UDP?", "options": {"A": "FTP", "B": "HTTP", "C": "HTTPS", "D": "TFTP"}, "answer": "D", "explanation": {"correct": "D. TFTP", "A": "Incorrect. FTP (File Transfer Protocol) operates over TCP.", "B": "Incorrect. HTTP (Hypertext Transfer Protocol) operates over TCP.", "C": "Incorrect. HTTPS (Hypertext Transfer Protocol Secure) operates over TCP.", "D": "Correct. The **Trivial File Transfer Protocol (TFTP)** is a **connectionless** protocol that operates over **UDP** (User Datagram Protocol) port 69."}},
        {"id": "D28", "question": "What is the name of a program that monitors user activity and sends that information to someone else?", "options": {"A": "Rootkit", "B": "Virus", "C": "Spyware", "D": "Keylogger"}, "answer": "C", "explanation": {"correct": "C. Spyware", "A": "Incorrect. A rootkit is designed to provide continued privileged access while actively hiding its presence.", "B": "Incorrect. A virus is malicious software designed to infect computer files or disks when activated.", "C": "Correct. **Spyware** is a program that **monitors user activity** and sends the information to someone else, invading the device to steal sensitive information and internet usage data.", "D": "Incorrect. A keylogger captures keystrokes, which is a *type* of spyware."}},
        {"id": "D29", "question": "A business owner's smartphone contains a lot of her customers' PII. Unfortunately, the business owner refuses to set up the phone to automatically wipe the data if the phone is lost or stolen because the data is precious. Based on the business owner's refusal to allow automatic wiping of the data, which of the following is the next BEST method of securing the phone?", "options": {"A": "Enable a passcode lock on the device", "B": "Enable a PIN lock on the device", "C": "Enable a swipe lock on the device", "D": "Enable a fingerprint lock on the device"}, "answer": "D", "explanation": {"correct": "D. Enable a fingerprint lock on the device", "A": "Incorrect. A passcode lock is generally stronger than a PIN but can still be compromised.", "B": "Incorrect. A PIN lock relies on the knowledge of a secret code.", "C": "Incorrect. A swipe lock relies on the knowledge of a secret pattern.", "D": "Correct. Out of the options provided, the use of a **fingerprint lock (biometric)** is considered the best or strongest protection as it ensures the user is **physically present** with the device to unlock it, providing a stronger factor of authentication than a simple code or pattern."}},
        {"id": "D30", "question": "You are working as a penetration tester and have discovered a new method of exploiting a vulnerability within the Windows 10 operating system. You conduct some research online and discover that a security patch against this particular vulnerability doesn't exist yet. Which type of threat would this BEST be categorized as?", "options": {"A": "Spoofing", "B": "Brute force", "C": "Zero-day", "D": "DDOS"}, "answer": "C", "explanation": {"correct": "C. Zero-day", "A": "Incorrect. Spoofing is the act of disguising a communication as being from a known, trusted source.", "B": "Incorrect. A brute-force attack is an attempt to systematically try all possible password combinations.", "C": "Correct. A **zero-day** attack happens once a flaw or vulnerability is exploited, and attackers release malware **before a developer has an opportunity to create a patch** to fix the vulnerability.", "D": "Incorrect. A Distributed Denial of Service (DDoS) attack is an attempt to make an online service unavailable by overwhelming it with traffic from multiple sources."}},
        {"id": "D31", "question": "You are the first help desk technician on the scene of a potential data breach. What is the FIRST thing you need to do as part of the incident response?", "options": {"A": "Report it to your supervisor", "B": "Preserve the evidence", "C": "Quarantine the system", "D": "Identify the issue"}, "answer": "D", "explanation": {"correct": "D. Identify the issue", "A": "Incorrect. Reporting the issue is the second step after identification.", "B": "Incorrect. Preservation of evidence comes after identifying and reporting the issue.", "C": "Incorrect. Quarantine (isolation) comes after identifying and reporting the issue.", "D": "Correct. The **first step** of the incident response is to **identify the issue** (e.g., confirm a breach, determine the scope). The CompTIA process usually follows: Identify, Report, Preserve."}},
        {"id": "D32", "question": "Which of the following Windows tools should a technician use to import and install data in the x.509 format?", "options": {"A": "RDS", "B": "Group policy editor", "C": "Certificate manager", "D": "Device manager"}, "answer": "C", "explanation": {"correct": "C. Certificate manager", "A": "Incorrect. Remote Desktop Services (RDS) is used to connect to a remote desktop session host server.", "B": "Incorrect. Group policy editor (gpedit.msc) is used to define and control how programs and the operating system operate for users and computers.", "C": "Correct. **Certificate manager** (certmgr.msc) is a utility used to manage digital certificates on a Windows system, including the import and installation of data in the **x.509 format**.", "D": "Incorrect. Device manager (devmgmt.msc) is a utility used to view and control the hardware attached to the computer."}},
        {"id": "D33", "question": "Which of the following types of attacks occurs when an attacker attempts to gain confidential information or login credentials by sending targeted emails to a specific set of recipients within an organization?", "options": {"A": "Whaling", "B": "Spear phishing", "C": "Phishing", "D": "Vishing"}, "answer": "B", "explanation": {"correct": "B. Spear phishing", "A": "Incorrect. Whaling is phishing that targets senior executives or wealthy individuals.", "B": "Correct. **Spear phishing** is the fraudulent practice of sending emails from a seemingly known or trusted sender to induce **targeted individuals** to reveal confidential information.", "C": "Incorrect. Phishing is an indiscriminate email-based social engineering attack on a large group of random people.", "D": "Incorrect. Vishing is a social-engineering attack conducted over the phone or leveraging VoIP services."}},
        {"id": "D34", "question": "The network administrator noticed that the border router has high network capacity loading during non-working hours. This excessive load is causing outages for the company's web servers. Which of the following is the MOST likely cause of the issue?", "options": {"A": "Distributed DoS", "B": "Session hijacking", "C": "Evil twin", "D": "ARP spoofing"}, "answer": "A", "explanation": {"correct": "A. Distributed DoS", "A": "Correct. A **Distributed Denial-of-Service (DDoS)** attack occurs when **multiple systems flood the bandwidth or resources** of a targeted system, causing outages due to excessive load.", "B": "Incorrect. Session hijacking is a method of taking over a web user session.", "C": "Incorrect. An evil twin is a rogue wireless access point.", "D": "Incorrect. ARP spoofing is a type of attack that involves sending falsified ARP messages over a local area network."}},
        {"id": "D35", "question": "You need to move a 75-pound box with a rack-mounted UPS in it. Which of the following actions should you take?", "options": {"A": "Open the box and carry up the UPS in pieces", "B": "Lift with your back and not your legs", "C": "Lift with your legs and not your back", "D": "Ask a coworker to team lift it with you"}, "answer": "D", "explanation": {"correct": "D. Ask a coworker to team lift it with you", "A": "Incorrect. A rack-mounted UPS is a self-contained unit that is impossible to carry up in multiple pieces.", "B": "Incorrect. When lifting objects, always lift using your legs and not your back.", "C": "Incorrect. While you should always lift with your legs, since the box is over **50 pounds**, you should **ask a coworker to team lift** the box with you for safety.", "D": "Correct. Since the box is over **50 pounds** (75 lbs), you should ask a **coworker to team lift** the box with you, as lifting heavy or bulky objects requires two or more people to safely move it."}},
        {"id": "D36", "question": "You have just completed a repair for a customer's smartphone that took you three days. The customer complained that the repair took too long and began to question you about the steps you took to repair the device. What should you do NEXT?", "options": {"A": "Become defensive and explain why each step was necessary to repair the device", "B": "Clearly tell the customer that if they had been more careful with the device then it wouldn't have needed to be fixed in the first place", "C": "Provide documentation of the repair to the customer and thank them for their patience", "D": "Listen to the customer's complaints with concern and then post about the encounter on Facebook"}, "answer": "C", "explanation": {"correct": "C. Provide documentation of the repair to the customer and thank them for their patience", "A": "Incorrect. You should not argue with customers and/or become defensive.", "B": "Incorrect. You should avoid being judgmental or dismissing customer problems.", "C": "Correct. When dealing with a difficult customer, you should follow professional communication skills, which include **providing documentation** of the repair to the customer and **thanking them for their patience**.", "D": "Incorrect. You should not disclose experiences via social media outlets."}},
        {"id": "D37", "question": "Which of the following commands is used on a Linux system to delete all the files and directories in a Linux system's filesystem?", "options": {"A": "rm -rf *.*", "B": "rm -rf /", "C": "rm *.*", "D": "rm /"}, "answer": "B", "explanation": {"correct": "B. rm -rf /", "A": "Incorrect. The '*.*' would only begin deleting from the current working directory, not the entire file system.", "B": "Correct. The **'rm -rf /'** is the most dangerous command in Linux. The '/' indicates that the remove command should begin at the **root directory** and recursively force all files and folders to be deleted, thus deleting **everything** on the system.", "C": "Incorrect. This is a common-line utility for removing files or directories and would only begin deleting from the current working directory, not the entire file system.", "D": "Incorrect. This is a common-line utility for removing files or directories and would only begin deleting from the current working directory, not the entire file system."}},
        {"id": "D38", "question": "Which RAID solution will provide the BEST speed and redundancy for a backup and disaster recovery server?", "options": {"A": "RAID 10", "B": "RAID 1", "C": "RAID 5", "D": "RAID 0"}, "answer": "A", "explanation": {"correct": "A. RAID 10", "A": "Correct. **RAID 10** (or RAID 1+0) provides the system with both **speed** (from striping - RAID 0) and **redundancy** (from mirroring - RAID 1), making it the best choice for both performance and fault tolerance.", "B": "Incorrect. RAID 1 provides redundancy (mirroring) but not speed (striping).", "C": "Incorrect. RAID 5 provides block-level striping with distributed parity (redundancy) but is slower than RAID 10 for write operations.", "D": "Incorrect. RAID 0 provides speed (striping) but no redundancy."}},
        {"id": "D39", "question": "You are renting space in another company's data center. To protect your server from being physically accessed when you are not in the building, what device should you use?", "options": {"A": "Server lock", "B": "Entry control roster", "C": "Smart card", "D": "USB lock"}, "answer": "A", "explanation": {"correct": "A. Server lock", "A": "Correct. A **server lock** is a physical locking mechanism installed on a server cabinet to prevent **unauthorized physical access** to the servers.", "B": "Incorrect. An entry control roster is an administrative control used to log people who enter or leave a secure room.", "C": "Incorrect. A smart card is a physical electronic authorization device used to control access to a resource, like a door lock or a computer login, but not the server cabinet itself.", "D": "Incorrect. A USB lock prevents unauthorized data transfer through USB ports."}},
        {"id": "D40", "question": "You have just updated the graphics card's driver to the latest version. After installation, the Windows workstation crashes and reports an error code. You attempt to reboot the workstation, but it fails again. You decide to reboot the workstation into Safe Mode. What should you do NEXT?", "options": {"A": "Disable the graphics driver", "B": "Perform a Windows Update", "C": "Rollback the graphics driver", "D": "Perform an antivirus scan"}, "answer": "C", "explanation": {"correct": "C. Rollback the graphics driver", "A": "Incorrect. Disabling the driver would prevent the device from working, but rolling back to a known working version is preferred.", "B": "Incorrect. This is a driver issue, not a missing Windows Update.", "C": "Correct. Since the issue began once you installed the latest driver, you should **roll back the graphics driver** to the last stable version using the 'Roll Back Driver' feature in Device Manager (accessed from Safe Mode) to resolve the issue.", "D": "Incorrect. This is a driver issue, not a malware issue."}},
        {"id": "D41", "question": "A network administrator has set up a firewall and set up only three allow rules so that traffic can be sent over ports 21, 110, and 25. Next, they added a final rule of 'deny any any' to the end of the ACL to minimize the attack surface and better secure the network. Unfortunately, now the administrator is receiving complaints from users that they cannot access any web pages using their URLs, such as DionTraining.com. Which of the following should the administrator do to correct this issue?", "options": {"A": "Add a rule to the ACL to allow traffic on ports 143 and 22", "B": "Add a rule to the ACL to allow traffic on ports 80 and 53", "C": "Add a rule to the ACL to allow traffic on ports 139 and 445", "D": "Add a rule to the ACL to allow traffic on ports 110 and 389"}, "answer": "B", "explanation": {"correct": "B. Add a rule to the ACL to allow traffic on ports 80 and 53", "A": "Incorrect. Ports 143 (IMAP) and 22 (SSH) are not required for web page access via URL.", "B": "Correct. To access a web page using a URL, the Hypertext Transfer Protocol (HTTP) on **port 80** and the Domain Name System (DNS) on **port 53** must be open to allow for website content transfer and name resolution, respectively.", "C": "Incorrect. Ports 139 and 445 are used for SMB (Windows file sharing), which is not required for web page access via URL.", "D": "Incorrect. Port 110 (POP3) and 389 (LDAP) are not required for web page access via URL."}},
        {"id": "D42", "question": "Charlie has submitted a ticket reporting that their operating system has become corrupted, but their personal files and installed applications are still intact. You are assigned as the IT technician and need to reinstall the operating system without deleting user data or installed programs while restoring system functionality. Which of the following recovery methods would BEST accomplish this?", "options": {"A": "Image-based recovery", "B": "Clean install", "C": "In-place recovery", "D": "File-level restore"}, "answer": "C", "explanation": {"correct": "C. In-place recovery", "A": "Incorrect. Image-based recovery may overwrite user data and settings with the image's contents.", "B": "Incorrect. A clean install completely removes all files and applications before reinstalling the OS.", "C": "Correct. An **in-place (aka overwrite) recovery** reinstalls the operating system while **preserving user data, settings, and installed applications**, making it the best option for restoring system functionality without losing user data.", "D": "Incorrect. A file-level restore is used to recover individual files rather than repairing the entire operating system."}},
        {"id": "D43", "question": "A programmer is writing a script to calculate the disk space needed to perform a daily backup. The programming wants to document his script so that other programmers can understand what his logic was when he wrote it. Which of the following should he use?", "options": {"A": "Loop", "B": "Constant", "C": "Variable", "D": "Comment"}, "answer": "D", "explanation": {"correct": "D. Comment", "A": "Incorrect. A loop repeats a task until a condition is met.", "B": "Incorrect. A constant is a specific identifier that contains a value that cannot be changed within the program.", "C": "Incorrect. A variable is a placeholder in a script containing a number, character, or string of characters.", "D": "Correct. A **comment** is written into the code to help a human understand the initial programmer's logic and is ignored by the computer when the script is being executed."}},
        {"id": "D44", "question": "A printing company uses an isolated Windows XP workstation to print out large format banners for its customers on a custom printer. Unfortunately, the printer does not support newer versions of Windows and would cost $50,000 to replace it. To mitigate this risk, the workstation is not connected to the internet or a local area network. When a customer needs a banner printer, the technician takes a copy of their PDF file and moves it to the Windows XP workstation using a USB thumb drive. The workstation recently became infected with malware when printing a customer's file. The technician remediated the issue, but the workstation became infected again three weeks later. Which of the following actions did the technician forget to perform?", "options": {"A": "Disable System Restore and remove the previous restore points", "B": "Connect the workstation to the Internet to receive the latest Windows XP patches", "C": "Manually update the antivirus on the workstation and set it to perform on-access scans", "D": "Perform a data wipe operation on the USB thumb drive before its next use"}, "answer": "C", "explanation": {"correct": "C. Manually update the antivirus on the workstation and set it to perform on-access scans", "A": "Incorrect. While disabling System Restore is a good step in the removal process, the reinfection cause here is likely the introduction of new malware from the USB drive.", "B": "Incorrect. Windows XP is end-of-life and will not receive security patches/updates.", "C": "Correct. Since the workstation is isolated and receives files only through a **USB thumb drive**, the most likely cause of reinfection is new malware introduced via the drive. The technician most likely neglected to **manually update the antivirus** definitions on this isolated workstation after the initial remediation.", "D": "Incorrect. Performing a data wipe on the USB drive before each use is an unnecessary step; a scan would be sufficient."}},
        {"id": "D45", "question": "Your company works as a contractor to the military and has just finished replacing about 500 workstations across its secure network. You have been asked to properly dispose of the workstations and destroy the data on their hard disk drives. Which of the following methods would be the MOST effective?", "options": {"A": "Fully format each hard drive with a series of 0s", "B": "Conduct a low-level format of each hard drive", "C": "Degauss each of the hard drives", "D": "Physically destroy the drives by drilling each HDD's platter"}, "answer": "C", "explanation": {"correct": "C. Degauss each of the hard drives", "A": "Incorrect. Formatting leaves data potentially recoverable by forensics.", "B": "Incorrect. A low-level format is not guaranteed to destroy data and is time-consuming for 500 drives.", "C": "Correct. **Degaussing** is the process of erasing/wiping a hard disk drive or magnetic tape using a powerful magnetic field to neutralize or erase the magnetic data. This is the **guaranteed, fast, and efficient** form of hard drive erasure for magnetic media, especially with many drives.", "D": "Incorrect. While physical destruction works, degaussing is faster and more efficient for a large number of drives using an industrial degausser."}},
        {"id": "D46", "question": "Which of the following should be configured on a macOS system to enable the Smart Zoom feature on a user's MacBook trackpad?", "options": {"A": "Signals", "B": "Motions", "C": "Gestures", "D": "Movements"}, "answer": "C", "explanation": {"correct": "C. Gestures", "A": "Incorrect. 'Signals' is not the correct terminology for this feature.", "B": "Incorrect. 'Motions' is not the correct terminology for this feature.", "C": "Correct. **Gestures** are finger movements on a trackpad or mouse that enable a user to scroll, zoom (**Smart Zoom**), and navigate the desktop, documents, and application content in macOS.", "D": "Incorrect. 'Movements' is not the correct terminology for this feature."}},
        {"id": "D47", "question": "You are working on a customer's computer when your cellphone begins to ring. What should you do?", "options": {"A": "Answer the phone while continuing to work on the customer's computer", "B": "Ignore the phone and let it continue ringing until it goes to voicemail", "C": "Apologize to the customer and answer the phone", "D": "Apologize to the customer and send the call to voicemail"}, "answer": "D", "explanation": {"correct": "D. Apologize to the customer and send the call to voicemail", "A": "Incorrect. Taking a personal call while working on a customer's computer is unprofessional and a distraction.", "B": "Incorrect. Ignoring the phone while it continues to ring is distracting and unprofessional.", "C": "Incorrect. You should not take personal calls while working on a customer's computer.", "D": "Correct. When working on a customer's computer, you should avoid distractions. If your phone rings, you should **send it to voicemail and then apologize** to the customer for the interruption to maintain a professional focus."}},
        {"id": "D48", "question": "A workstation at Dion Training's office is taking a long time to boot up. Once it finishes booting to the Windows 10 desktop, which of the following tools can a technician use to diagnose and fix the boot issues?", "options": {"A": "resmon.exe", "B": "msconfig.exe", "C": "msinfo32.exe", "D": "perfmon.msc"}, "answer": "B", "explanation": {"correct": "B. msconfig.exe", "A": "Incorrect. Resource monitor (resmon.exe) displays information about the use of hardware and software resources in real-time, but it cannot manage or terminate those processes.", "B": "Correct. **System configuration (msconfig.exe)** is a system utility to troubleshoot the Microsoft Windows **startup processes**. It is used to disable or re-enable software, device drivers, and Windows services that run at startup to identify the source of a slow boot time.", "C": "Incorrect. System information (msinfo32.exe) is a utility that gathers information about your computer, including hardware and software configuration.", "D": "Incorrect. Performance monitor (perfmon.msc) is a utility in Windows that is used to monitor CPU and memory activity, but it cannot manage or terminate those processes."}},
        {"id": "D49", "question": "A user contacts the service desk and states a hardware conflict error is showing in their Device Manager. Which of the following log files should you review to determine the source of the conflict?", "options": {"A": "Application log", "B": "System log", "C": "Security log", "D": "Setup"}, "answer": "B", "explanation": {"correct": "B. System log", "A": "Incorrect. The Application log contains information regarding application errors.", "B": "Correct. The **System log**, viewed in the Event Viewer, contains information about service load failures, **hardware conflicts**, driver load failures, and more. This is the log to check for hardware errors.", "C": "Incorrect. The Security log contains information regarding audit data and security on a system.", "D": "Incorrect. The Setup log contains a record of the events generated during the Windows installation or upgrade process."}},
        {"id": "D50", "question": "A user receives the following error message: 'Windows Update cannot currently check for updates because the service is not running.' The user calls the help desk to report the error they received. A support technician uses a remote connection tool to log in to the computer remotely, quickly identifies the issue, and fixes the issue. Which of the following should the technician do NEXT?", "options": {"A": "Register the Windows Update service's DLL files", "B": "Rollback the device drivers", "C": "Reboot the computer", "D": "Restart the network services"}, "answer": "C", "explanation": {"correct": "C. Reboot the computer", "A": "Incorrect. Registering the DLL files may have been the 'fix' that was applied, but is not the next step after the fix is implemented.", "B": "Incorrect. The issue is a service not running, not a driver failure.", "C": "Correct. After any service-related fix, **restarting the computer** is a critical step to ensure that all changes take full effect and the system is stable and the error is resolved.", "D": "Incorrect. Restarting network services is too broad and may have been part of the fix, but is not the next step after the fix is implemented."}},
        {"id": "D51", "question": "Which of the following devices should you NEVER disassemble during troubleshooting due to the risk of electrocution?", "options": {"A": "Tablet", "B": "External hard drive enclosure", "C": "Printer", "D": "CRT display"}, "answer": "D", "explanation": {"correct": "D. CRT display", "A": "Incorrect. Tablets have field replaceable parts that a technician can install, remove, or replace.", "B": "Incorrect. External hard drive enclosures have field replaceable parts that a technician can install, remove, or replace.", "C": "Incorrect. Printers have field replaceable parts that a technician can install, remove, or replace.", "D": "Correct. A **CRT display** is an older-style computer monitor that contains large capacitors that could retain high levels of electricity even after being disconnected. A technician should **never open a CRT monitor** or stick anything into its interior for fear of **electrocution**."}},
        {"id": "D52", "question": "Dion Training is replacing the toner cartridges in their laser printers. Tim accidentally spilled some toner on the ground during the replacement of one of the cartridges. He carefully vacuumed up the toner and sealed it in a strong plastic trash bag. Which of the following should Tim do with the plastic bag of loose toner?", "options": {"A": "Place the plastic bag into a cardboard box and place it in the trash", "B": "Place the plastic bag of toner in the recycle bin behind their building", "C": "Research the manufacturer's recommendation for disposing of loose toner", "D": "Review the material safety data sheet for disposal instructions"}, "answer": "C", "explanation": {"correct": "C. Research the manufacturer's recommendation for disposing of loose toner", "A": "Incorrect. Loose toner should not be sent directly to a landfill or recycling center, as it can cause breathing problems and is an irritant.", "B": "Incorrect. Loose toner should not be sent directly to a landfill or recycling center, as it can cause breathing problems and is an irritant.", "C": "Correct. Loose toner should not be sent directly to a landfill or recycling center. Technicians should **research the manufacturer's recommendation** on the safe disposal of **loose toner**, as this is a required safety procedure.", "D": "Incorrect. Reviewing the MSDS is a step in the process, but the best general advice for disposal is to research the manufacturer's specific recommendation."}},
        {"id": "D53", "question": "Janice called the help desk to report that her computer will not boot up. The technician begins troubleshooting the issue, but after 20 minutes, the computer is still not booting up. Janice is getting frustrated with the technician, and she tells the technician that she feels that they are wasting her time since the issue isn't resolved yet. How should the technician respond to Janice's frustration?", "options": {"A": "The technician should \"accidentally\" hang up the call so that Janice gets a different technician when she calls the help desk again", "B": "The technician should recommend that Janice call back to the help desk for more assistance when she has more time available", "C": "The technician should tell Janice that they are required to follow a specific troubleshooting procedure to identify the issue and solve the problem", "D": "The technician should ask open-ended questions to properly identify the issue by narrowing down the possible symptoms or causes"}, "answer": "D", "explanation": {"correct": "D. The technician should ask open-ended questions to properly identify the issue by narrowing down the possible symptoms or causes", "A": "Incorrect. This is unprofessional and a violation of the 'Do not argue with customers and/or become defensive' principle.", "B": "Incorrect. This is dismissive of the customer's problem.", "C": "Incorrect. This can come across as defensive and dismissive of the customer's frustration.", "D": "Correct. When dealing with frustrated customers, you should **ask open-ended questions** to clarify the customer's statements and narrow the scope of the problem, demonstrating active listening and a commitment to solving the problem."}},
        {"id": "D54", "question": "Karen, a salesperson in your company, is currently on travel this week. She calls your company's help desk and is yelling because she cannot connect to her email using her hotel room's WiFi. Her laptop shows that it is connected to the 'HotelWiFi' network, but Windows states it has 'Limited or no connectivity.' What action should Karen perform to fix this issue?", "options": {"A": "Disable and enable her wireless adapter", "B": "Purchase an ethernet cable and use her room's wired connection", "C": "Open a web browser and agree to the hotel's capture page AUP", "D": "Reboot into Safe Mode and perform an antivirus scan"}, "answer": "C", "explanation": {"correct": "C. Open a web browser and agree to the hotel's capture page AUP", "A": "Incorrect. This is a basic troubleshooting step but will not resolve the captive portal issue.", "B": "Incorrect. This may bypass the issue but is not a fix for the wireless connectivity problem.", "C": "Correct. The 'Limited or no connectivity' message is a common occurrence on public wireless networks (like hotels) that use a **captive portal**. The user must **open a web browser and agree to the AUP** on the hotel's capture page before full internet access is granted.", "D": "Incorrect. This is a drastic step and is not related to a public Wi-Fi network's captive portal."}},
        {"id": "D55", "question": "You receive a ticket where a user reports receiving frequent 'Low Memory' warnings on their Windows 10 laptop while working with multiple applications simultaneously. They mention that the computer has 4 GB of RAM and often runs a web browser with several tabs open alongside spreadsheet and email applications. The user needs a solution that will allow for smoother multitasking without constant warnings. What would be the best solution to prevent future low memory warnings in this situation?", "options": {"A": "Close unused applications and browser tabs", "B": "Upgrade the physical RAM in the laptop", "C": "Reinstall the operating system for better memory management", "D": "Increase the laptop's virtual memory (paging file)"}, "answer": "B", "explanation": {"correct": "B. Upgrade the physical RAM in the laptop", "A": "Incorrect. Closing applications is a temporary fix that doesn’t address the user’s need to multitask.", "B": "Correct. Upgrading the physical **RAM** provides a long-term solution that significantly enhances the ability to run multiple memory-intensive applications simultaneously and **prevents low memory warnings**.", "C": "Incorrect. Reinstalling the operating system won’t resolve hardware-based memory limitations.", "D": "Incorrect. Increasing virtual memory can help with minor shortages but is not as efficient as adding physical RAM."}},
        {"id": "D56", "question": "Which command-line tool is used on a Windows system to display a list of the files and directories within the current directory or path?", "options": {"A": "dir", "B": "sfc", "C": "ls", "D": "chkdsk"}, "answer": "A", "explanation": {"correct": "A. dir", "A": "Correct. The **'dir'** command is used on a Windows system to display a **list of the files and directories** within the current directory or path.", "B": "Incorrect. The 'sfc' (System File Checker) command is a utility in Windows that allows users to scan for and restore corrupted Windows system files.", "C": "Incorrect. The 'ls' command is used on a Linux system for the same function.", "D": "Incorrect. The 'chkdsk' command is used to check the file system and file system metadata of a volume for logical and physical errors."}},
        {"id": "D57", "question": "Susan, an executive at Dion Training, will be traveling to Italy for a conference next week. She is worried about remaining connected to the internet while overseas and plans to use the WiFi in her hotel room and the local coffee shop with her laptop. Which of the following should she purchase and configure before leaving for Italy to ensure her communications remain secure regardless of where she is connecting from?", "options": {"A": "Local SIM card for her smartphone", "B": "International data roaming plan on her cellphone", "C": "Local mobile hotspot", "D": "VPN"}, "answer": "D", "explanation": {"correct": "D. VPN", "A": "Incorrect. A local SIM card is for the phone's cellular connection and doesn't secure the laptop's Wi-Fi connection.", "B": "Incorrect. An international data roaming plan is for the phone's cellular connection and doesn't secure the laptop's Wi-Fi connection.", "C": "Incorrect. A local mobile hotspot provides connectivity but is not a security measure in itself.", "D": "Correct. A **Virtual Private Network (VPN)** connects the components and resources of two networks over another (public) network, utilizing an **encryption tunnel** to protect data being transferred to and from her laptop to ensure communications **remain secure** over unsecure public Wi-Fi connections."}},
        {"id": "D58", "question": "An employee notices their browser is running slowly and often freezes after installing a plug-in from an unknown source. What step should IT advise to promptly resolve this performance issue?", "options": {"A": "Update the browser to the latest software version available.", "B": "Enable the browser’s built-in pop-up blocking capabilities.", "C": "Clear the browser cache to restore faster browsing speeds.", "D": "Disable or remove the recently installed browser plug-in."}, "answer": "D", "explanation": {"correct": "D. Disable or remove the recently installed browser plug-in.", "A": "Incorrect. Updating the browser is beneficial for security but may not resolve performance problems introduced by a specific plug-in.", "B": "Incorrect. Pop-up blockers prevent advertisements but have no effect on plug-in performance issues.", "C": "Incorrect. Clearing the cache improves loading speed but does not specifically resolve issues caused by plug-ins.", "D": "Correct. **Disabling or removing the recently installed plug-in** directly addresses performance issues caused by potentially harmful or poorly coded plug-ins from an unknown source."}},
        {"id": "D59", "question": "Which of the following tools is used to duplicate all of the files in one directory to another in the Windows command line?", "options": {"A": "xcopy", "B": "netstat", "C": "format", "D": "dir"}, "answer": "A", "explanation": {"correct": "A. xcopy", "A": "Correct. The **'xcopy'** tool copies all of the files from one directory to another and is used in the Windows command line.", "B": "Incorrect. The 'netstat' command is used to display active TCP connections and network statistics.", "C": "Incorrect. The 'format' command creates a new root directory and file system for the disk.", "D": "Incorrect. The 'dir' command is used to list a directory's files and subdirectories."}},
        {"id": "D60", "question": "A developer uses a MacBook Pro when working from home, but they need access to both a Windows and macOS system to test their programs. Which of the following tools should be used to allow both operating systems to exist on their MacBook Pro?", "options": {"A": "Boot Camp", "B": "Mission Control", "C": "Device Manager", "D": "Terminal"}, "answer": "A", "explanation": {"correct": "A. Boot Camp", "A": "Correct. **Boot Camp** is a multi-boot utility included with Apple's macOS that assists users in installing Microsoft Windows operating systems on Intel-based Macintosh computers. It allows the user to **dual boot** into either macOS or Windows.", "B": "Incorrect. Mission Control is an application for facilitating multiple desktops in the macOS environment.", "C": "Incorrect. Device Manager is a utility used in Windows to view and control hardware.", "D": "Incorrect. Terminal in macOS is the equivalent of the Windows Command Prompt window."}},
        {"id": "D61", "question": "You're educating new staff about mobile security practices, focusing on encryption methods. Which statement accurately describes the primary purpose of device encryption?", "options": {"A": "It restricts network access through secure passwords.", "B": "It prevents the installation of unauthorized software applications.", "C": "It verifies user identity using biometric methods.", "D": "It protects stored data by making it unreadable without an encryption key."}, "answer": "D", "explanation": {"correct": "D. It protects stored data by making it unreadable without an encryption key.", "A": "Incorrect. This is accomplished by network access control mechanisms, not device encryption.", "B": "Incorrect. This is accomplished by Mobile Device Management (MDM) or OS settings, not device encryption.", "C": "Incorrect. This is accomplished by biometric authentication, not device encryption.", "D": "Correct. **Device encryption** protects **stored data** by making it **unreadable** without the appropriate **encryption key** (Data-at-rest encryption)."}
        },

        {"id": "D62", "question": "A user on their desktop computer receives a 'USB Controller Resource Exceeded' warning when connecting multiple USB devices (a mouse, keyboard, and external hard drive). Some devices stop functioning until others are disconnected. The user needs all devices connected for their workflow and seeks a solution to resolve the resource limitation. What would be the best solution to address the USB controller resource issue?", "options": {"A": "Disable USB devices in BIOS to free up resources", "B": "Use a powered USB hub for the external devices", "C": "Replace the motherboard with one that has more USB ports", "D": "Update the computer's operating system to reallocate resources"}, "answer": "B", "explanation": {"correct": "B. Use a powered USB hub for the external devices", "A": "Incorrect. Disabling USB devices reduces functionality rather than solving the problem.", "B": "Correct. A **powered USB hub** supplies **additional power** to connected devices, alleviating resource constraints on the USB controller and allowing the use of all devices.", "C": "Incorrect. Replacing the motherboard is an extreme and unnecessary measure for this issue.", "D": "Incorrect. Updating the operating system won’t resolve hardware resource limitations on a saturated controller."}},
        {"id": "D63", "question": "Which of the following commands is used on a Linux system to safely turn off a server?", "options": {"A": "kill", "B": "rm", "C": "shutdown", "D": "ps"}, "answer": "C", "explanation": {"correct": "C. shutdown", "A": "Incorrect. The 'kill' command sends a signal to specified processes or process groups, typically to terminate them.", "B": "Incorrect. The 'rm' command is a command-line utility for removing (deleting) files or directories.", "C": "Correct. The **'shutdown'** command brings the system down in a **secure way**, notifying all logged-in users and processes that the system is going down.", "D": "Incorrect. The 'ps' command is used to list the currently running processes."}},
        {"id": "D64", "question": "(This is a simulated Performance-Based Question. If this was the real certification exam, you would be asked to drag-and-drop the correct encryption onto the APs.) Your company has purchased a new office building down the street for its executive suites. You have been asked to choose the BEST encryption for AP1, AP2, and AP3 to establish a wireless connection inside the main building for visitors to use. Your boss has stated that the main building's internal wireless network is only going to be used by visitors and should not require the visitors to set up any special configuration on their devices to connect.Which of the following is the BEST encryption to use from the options below to meet your manager's requirements for the new visitors' Wireless Network?", "options": {"A": "Open", "B": "WEP", "C": "WPA", "D": "WPA-CCMP", "E": "WPA2-TKIP"}, "answer": "A", "explanation": {"correct": "A. Open", "A": "Correct. Since your manager has required that the visitors **not be required to configure anything** on their devices to connect, the only option you can choose is **Open**. This option requires no password or setup on the user's devices.", "B": "Incorrect. WEP requires a password and setup.", "C": "Incorrect. WPA requires a password and setup.", "D": "Incorrect. WPA-CCMP requires a password and setup.", "E": "Incorrect. WPA2-TKIP requires a password and setup."}},
        {"id": "D65", "question": "A workstation was patched last night with the latest operating system security update. This morning, the workstation only displays a blank screen. You restart the computer, but the operating system fails to load. What is the NEXT step you should attempt to boot this workstation?", "options": {"A": "Reboot the workstation into safe mode, open RegEdit, and repair the Windows Registry", "B": "Reboot the workstation into safe mode and disable Windows services/applications", "C": "Reboot the workstation into the BIOS and reconfigure boot options", "D": "Reboot the workstation into safe mode and roll back the recent security update"}, "answer": "D", "explanation": {"correct": "D. Reboot the workstation into safe mode and roll back the recent security update", "A": "Incorrect. Repairing the registry is a complex and highly risky step that should only be attempted as a last resort.", "B": "Incorrect. While disabling services can help with slow boots, the system is failing to load the OS completely.", "C": "Incorrect. The issue began after a security update, making a BIOS change unlikely to be the first step.", "D": "Correct. Since the system failed to load after a security update, the most likely cause is a bad patch. The next step should be to **boot into Safe Mode** and **roll back the most recent security update** to return the system to its last working state."}},
        {"id": "D66", "question": "Susan is installing several updates on a Windows computer. Nine of the updates were installed without any issues, but one update produced an error and failed to install. Susan restarts the computer as part of the troubleshooting process, and the computer automatically attempts to install the failed update again. Again, the update fails to install. What should Susan do NEXT?", "options": {"A": "Research the error number for the failed update and determine if there is a known issue with this update", "B": "Manually download and install the failed update", "C": "Download the update from a third-party website like Source Forge and install it", "D": "Review the Event Viewer to determine the cause of the failure and address the findings"}, "answer": "A", "explanation": {"correct": "A. Research the error number for the failed update and determine if there is a known issue with this update", "A": "Correct. If an automated system update fails to install, the most appropriate next step is to **research the error number** to determine if the issue is a known error or if it provides a specific remediation step (like inadequate hard disk space) that needs to be addressed.", "B": "Incorrect. Manually downloading and installing the failed update is generally the third step (after researching the error) in the process, as the error may still occur if the root cause is not fixed.", "C": "Incorrect. Downloading a system update from a third-party website is a significant security risk.", "D": "Incorrect. Reviewing the Event Viewer is an action that precedes the remediation but is not the most efficient step here, as the specific error code is already available."}},
        {"id": "D67", "question": "Employees frequently access confidential company information through web-based applications. To increase security, IT recommends disabling certain browser features. Which browser feature would be most appropriate to disable for enhanced security?", "options": {"A": "Automatic clearing of browsing history after each session.", "B": "Automatic updates for the browser to avoid unexpected changes.", "C": "Browser pop-up blocker to allow all necessary notifications.", "D": "JavaScript execution to limit potential script-based attacks."}, "answer": "D", "explanation": {"correct": "D. JavaScript execution to limit potential script-based attacks.", "A": "Incorrect. Clearing history enhances privacy but does not prevent script-based security threats.", "B": "Incorrect. Disabling automatic updates negatively impacts security because browsers require updates to patch vulnerabilities.", "C": "Incorrect. Disabling pop-up blockers reduces security by allowing disruptive ads and potentially harmful content.", "D": "Correct. **Disabling JavaScript execution** reduces the risk of **script-based attacks** (like XSS), effectively protecting confidential data from malicious code that might run in the browser."}},
        {"id": "D68", "question": "A user reports frequent security warnings from outdated antivirus software. What should be done to resolve this?", "options": {"A": "Uninstall and reinstall the antivirus software to reset warnings.", "B": "Disable security alerts to prevent further notifications.", "C": "Enable automatic updates to keep virus definitions current.", "D": "Run a manual scan and ignore update notifications."}, "answer": "C", "explanation": {"correct": "C. Enable automatic updates to keep virus definitions current.", "A": "Incorrect. Reinstalling software may reset settings but does not address the need for updated definitions.", "B": "Incorrect. Disabling security alerts removes notifications but does not fix the underlying issue of outdated definitions.", "C": "Correct. **Enable automatic updates** to ensure the antivirus program receives the **latest threat definitions**, maintaining protection against new malware and resolving the 'outdated' status that triggers the warnings.", "D": "Incorrect. Running a manual scan without updating leaves the system vulnerable to new threats."}},
        {"id": "D69", "question": "Which of the following features is UNIQUE to the NTFS file system when compared to FAT32?", "options": {"A": "Case-sensitive file naming", "B": "Lack of file permission settings", "C": "Support for files larger than 4GB", "D": "Compatibility with all major operating systems"}, "answer": "C", "explanation": {"correct": "C. Support for files larger than 4GB", "A": "Incorrect. While NTFS supports case-sensitive file naming, other file systems (such as ext4) also support it, so it is not unique to NTFS.", "B": "Incorrect. NTFS *has* file permission settings, whereas FAT32 *lacks* them.", "C": "Correct. **NTFS** supports **files larger than 4GB**, which is a key limitation of FAT32 (a maximum file size of 4GB).", "D": "Incorrect. NTFS is not fully compatible with macOS and Linux without additional software or drivers."}},
        {"id": "D70", "question": "A customer brought in a computer that has been infected with a virus. Since the infection, the computer began redirecting all three of the system's web browsers to a series of malicious websites whenever a valid website is requested. You quarantined the system, disabled the system restore, and then perform the remediation to remove the malware. You have scanned the machine with several anti-virus and anti-malware programs and determined it is now cleaned of all malware. You attempt to test the web browsers again, but a small number of valid websites are still being redirected to a malicious website. Luckily, the updated anti-virus you installed blocked any new malware from infecting the system. Which of the following actions should you perform NEXT to fix the redirection issue with the browsers?", "options": {"A": "Install a secondary anti-malware solution on the system", "B": "Reformat the system and reinstall the OS", "C": "Perform a System Restore to an earlier date before the infection", "D": "Verify the hosts.ini file has not been maliciously modified"}, "answer": "D", "explanation": {"correct": "D. Verify the hosts.ini file has not been maliciously modified", "A": "Incorrect. A secondary anti-malware solution is a good idea but will not resolve the specific redirection issue.", "B": "Incorrect. Reformatting the system is a last resort and is unnecessary if a more targeted fix is available.", "C": "Incorrect. System Restore was disabled, and performing a restore would likely reinfect the system with malware from the restore point.", "D": "Correct. If redirection occurs for a small number of sites or occurs in all web browsers on a system, it is most likely a maliciously **modified hosts.ini file**, which acts as a local DNS server and can redirect a system's internet connection."}},
        {"id": "D71", "question": "You are working as a technician where your organization has received approval to migrate its email services to a new cloud provider. The IT team has created a detailed plan, including a rollback strategy, communication with end users, and scheduled downtime. They are now ready to execute the migration according to the approved change management process. Which of the following would BEST describe this phase of change management?", "options": {"A": "Risk assessment", "B": "Post-change review", "C": "Implementation", "D": "Change freeze"}, "answer": "C", "explanation": {"correct": "C. Implementation", "A": "Incorrect. Risk assessment is part of the initial planning phase.", "B": "Incorrect. Post-change review occurs after the change is complete to evaluate its success.", "C": "Correct. **Implementation** is the phase in the change management process where an approved change is **executed** according to the defined plan, which is what 'ready to execute the migration' describes.", "D": "Incorrect. A change freeze is a restriction on changes during critical periods."}},
        {"id": "D72", "question": "You have decided to have DNA genetic testing and analysis performed to determine your exact ancestry composition and possibly find some lost relatives through their database. Which of the following types of data should this be classified?", "options": {"A": "CUI", "B": "PII", "C": "IP", "D": "PHI"}, "answer": "D", "explanation": {"correct": "D. PHI", "A": "Incorrect. Controlled Unclassified Information (CUI) is federal non-classified government information.", "B": "Incorrect. Personally identifiable information (PII) is data that can be used to identify, contact, or locate an individual (name, SSN, etc.).", "C": "Incorrect. Intellectual property (IP) is information created and owned by the company.", "D": "Correct. **Protected health information (PHI)** refers to medical and insurance records. Data collected by **genetic mapping and heredity** companies includes the subject's DNA, making it PHI."}},
        {"id": "D73", "question": "You are working on a Windows 10 workstation with a 1 TB HDD and 16 GB of memory that is operating slowly when reading large files from its storage device. Which of the following commands should you use to speed up this workstation?", "options": {"A": "ipconfig", "B": "format", "C": "chkdsk", "D": "diskpart"}, "answer": "C", "explanation": {"correct": "C. chkdsk", "A": "Incorrect. The 'ipconfig' tool displays all current TCP/IP network configuration values.", "B": "Incorrect. The 'format' command creates a new root directory and file system for the disk, deleting all data.", "C": "Correct. The **'chkdsk'** command is used to check the file system and file system metadata of a volume for **logical and physical errors** and can help resolve **performance issues** related to file system integrity on a hard disk drive (HDD).", "D": "Incorrect. The 'diskpart' command is a command-line disk-partitioning utility."}},
        {"id": "D74", "question": "Which of the following authentication protocols was developed by Cisco to provide authentication, authorization, and accounting services?", "options": {"A": "CHAP", "B": "RADIUS", "C": "TACACS+", "D": "Kerberos"}, "answer": "C", "explanation": {"correct": "C. TACACS+", "A": "Incorrect. Challenge-Handshake Authentication Protocol (CHAP) is an authentication protocol but does not provide authorization or accounting services.", "B": "Incorrect. Remote Authentication Dial-In User Service (RADIUS) provides AAA management but was not developed by Cisco.", "C": "Correct. **TACACS+** is an extension to TACACS and was developed as a proprietary protocol by **Cisco** to provide centralized **Authentication, Authorization, and Accounting (AAA)** services.", "D": "Incorrect. Kerberos is a network authentication protocol developed by MIT."}},
        {"id": "D75", "question": "Your IT administrator has proposed a new method for deploying security patches to company servers. Before the change is approved, another senior administrator is assigned to review the plan to ensure it follows best practices, minimizes risks, and aligns with company policies. Which of the following would BEST describe this step in the change management process?", "options": {"A": "Standard change", "B": "Change freeze", "C": "Implementation", "D": "Peer review"}, "answer": "D", "explanation": {"correct": "D. Peer review", "A": "Incorrect. Standard changes are low-risk, routine modifications that follow an established process.", "B": "Incorrect. A change freeze is a temporary halt on modifications.", "C": "Incorrect. Implementation refers to executing an approved change.", "D": "Correct. **Peer review** is the step in the change management process where another knowledgeable team member **reviews a proposed change** before approval to ensure it meets best practices, minimizes risks, and aligns with company policies."}},
        {"id": "D76", "question": "Which of the following features is supported by Kerberos but not by RADIUS?", "options": {"A": "Services for authentication", "B": "Single sign-on capability", "C": "XML for cross-platform interoperability", "D": "Tickets used to identify authenticated users"}, "answer": "D", "explanation": {"correct": "D. Tickets used to identify authenticated users", "A": "Incorrect. Both Kerberos and RADIUS provide services for authentication.", "B": "Incorrect. Both Kerberos and RADIUS can be part of a Single Sign-On (SSO) solution.", "C": "Incorrect. While RADIUS can use XML, this is not a core differentiating feature for Kerberos.", "D": "Correct. **Kerberos** uses a system of **'tickets'** to allow nodes to communicate over a non-secure network and securely prove their identity. RADIUS does not use tickets in this manner."}},
        {"id": "D77", "question": "Which type of malware is used to actively attempt to steal confidential information by capturing a user's data when typed into a web browser or other application?", "options": {"A": "Spyware", "B": "Rootkit", "C": "Trojan", "D": "Keylogger"}, "answer": "D", "explanation": {"correct": "D. Keylogger", "A": "Incorrect. Spyware is a program that monitors user activity and sends the information to someone else.", "B": "Incorrect. A rootkit is designed to provide continued privileged access while actively hiding its presence.", "C": "Incorrect. A trojan is malware disguised as legitimate software that can take control of your computer.", "D": "Correct. A **keylogger** actively attempts to steal confidential information by **capturing keystrokes** (a user's data when typed) entered into a web browser or other application. This is a specific function of some malware."}},
        {"id": "D78", "question": "Jason's company issued him an old 2018 laptop with an internal hardware security key that he uses to connect to his office network over a VPN while traveling. Without this laptop, Jason cannot access his company's internal servers, email, or share drive files. The Windows 10 laptop is extremely slow, and the screen recently cracked and needs to be replaced. When Jason returns to the company's headquarters, the company will provide him with a new laptop due to the broken screen. Until then, he is working out of his hotel room during a 45-day business trip and needs to continue using this laptop. Jason brings the laptop to the computer store you work at and asks for your assistance. Which of the following do you recommend?", "options": {"A": "Replace the display and contact the manufacturer for reimbursement", "B": "Replace the display and charge him for the parts/installation", "C": "Sell him an external 15\" tablet/monitor to connect to the laptop as a workaround", "D": "Purchase a new laptop as the cost to repair might be more than a new laptop"}, "answer": "C", "explanation": {"correct": "C. Sell him an external 15\" tablet/monitor to connect to the laptop as a workaround", "A": "Incorrect. The laptop is outside of the warranty period, making the recommendation of being reimbursed by the manufacturer incorrect.", "B": "Incorrect. This would likely be more expensive than a simple workaround.", "C": "Correct. Since the laptop has an **internal hardware security key** required for VPN access, it cannot be easily replaced. The quickest, cheapest, and best **workaround** is to purchase an **external monitor** to bypass the cracked screen issue until he gets a new corporate laptop.", "D": "Incorrect. A new laptop would not have the internal hardware security key required for VPN access."}},
        {"id": "D79", "question": "Which command-line entry would be used on a Windows system to test if your system can reach diontraining.com?", "options": {"A": "ping diontraining.com", "B": "ipconfig diontraining.com", "C": "net use diontraining.com", "D": "sfc diontraining.com"}, "answer": "A", "explanation": {"correct": "A. ping diontraining.com", "A": "Correct. The **'ping'** command is used to test a host's **reachability** on an Internet Protocol network by sending a series of ICMP packets to the specified host (like diontraining.com).", "B": "Incorrect. The 'ipconfig' tool displays all current TCP/IP network configuration values on a given system.", "C": "Incorrect. The 'net use' command is used to connect to, remove, and configure connections to shared resources such as mapped drives and network printers.", "D": "Incorrect. The 'sfc' (System File Checker) command is a utility in Windows that allows users to scan for and restore corrupted Windows system files."}},
        {"id": "D80", "question": "Your company wants to ensure that users cannot access USB mass storage devices. You have conducted some research online and found that if you modify the HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\UsbStor key, it will prevent USB storage devices from being used. Which of the following tools should you use to modify this key?", "options": {"A": "RegEdit", "B": "RDS", "C": "MSConfig", "D": "MMC"}, "answer": "A", "explanation": {"correct": "A. RegEdit", "A": "Correct. The **registry editor (RegEdit)** allows you to view and make changes to system files and programs in the **Windows Registry**, including modifying the 'UsbStor' key to disable USB storage devices.", "B": "Incorrect. Remote Desktop Services (RDS) is used to connect to a remote desktop session host server.", "C": "Incorrect. MSConfig is a system utility to troubleshoot the Microsoft Windows startup processes.", "D": "Incorrect. The Microsoft management console (MMC) is a utility that uses snap-ins for various Windows tools (like disk management, computer management) but is not used to directly edit the registry."}},
        {"id": "D81", "question": "Your company's IT department routinely deploys software updates to employee workstations every month. These updates follow a predefined approval process, pose minimal risk to system stability, and require no special authorization beyond the usual change request workflow. The IT manager wants to ensure these updates are properly categorized in the change management process to streamline approval and implementation. Which of the following would BEST describe this type of change?", "options": {"A": "Major change", "B": "Emergency change", "C": "Standard change", "D": "Normal change"}, "answer": "C", "explanation": {"correct": "C. Standard change", "A": "Incorrect. Major changes involve significant modifications that require extensive planning and approval.", "B": "Incorrect. Emergency changes are urgent and typically involve immediate fixes for critical issues.", "C": "Correct. A **standard change** is the best classification because it refers to **routine, low-risk** modifications (like monthly software updates) that follow an **established process** and do not require special approvals.", "D": "Incorrect. A normal change involves a non-routine but planned modification that requires a full change management process."}},
        {"id": "D82", "question": "Dion Training just released a new corporate policy that dictates all access to network resources will be controlled based on the user's job functions and tasks within the organization. For example, only people working in Human Resources can access employee records, and only the people working in finance can access customer payment histories. Which of the following security concepts is BEST described by this new policy?", "options": {"A": "Acceptable use policy", "B": "Zero trust", "C": "Least privilege", "D": "Defense in depth"}, "answer": "C", "explanation": {"correct": "C. Least privilege", "A": "Incorrect. An acceptable use policy (AUP) is a set of rules that restrict how the network, website, or system may be used.", "B": "Incorrect. Zero trust is a security framework that requires all users to be authenticated, authorized, and continuously validated before being granted access.", "C": "Correct. **Least privilege** is the concept and practice of restricting access rights for users to only those resources absolutely required to perform routine, legitimate activities (i.e., **access is controlled based on the user's job functions**).", "D": "Incorrect. Defense in Depth is an approach to cybersecurity in which a series of defensive mechanisms are layered to protect valuable data and information."}},
        {"id": "D83", "question": "Eduardo is installing Windows 11 (64-bit) in a virtual machine on his macOS desktop. The installation is continually failing and producing an error. Eduardo has configured the virtual machine with a 2.2 GHz processor, 4 GB of memory, a 64 GB hard drive, and a 1280 x 720 screen resolution. Which item in the virtual machine should be increased to fix the installation issue experienced?", "options": {"A": "The screen resolution", "B": "Amount of hard drive space", "C": "Amount of memory", "D": "Number of CPU cores"}, "answer": "D", "explanation": {"correct": "D. Number of CPU cores", "A": "Incorrect. The screen resolution is sufficient (minimum is 720p).", "B": "Incorrect. The amount of hard drive space (64 GB) is the minimum requirement for Windows 11.", "C": "Incorrect. The amount of memory (4 GB) is the minimum requirement for Windows 11.", "D": "Correct. The minimum requirement for the Windows 11 (64-bit) operating system is a **dual-core (2) processor**. The virtual machine needs to be configured with at least **two CPU cores**."}},
        {"id": "D84", "question": "A company is integrating an AI-powered virtual assistant into its internal communication system. Employees will use it to process emails, analyze reports, and summarize meetings. The legal team expresses concern that sensitive business information may be accessible by external entities, depending on how the AI processes and stores its data. Which of the following would be the MOST important concern in this scenario?", "options": {"A": "User interface design", "B": "System update frequency", "C": "Data privacy", "D": "Software licensing terms"}, "answer": "C", "explanation": {"correct": "C. Data privacy", "A": "Incorrect. User interface design affects usability but not data confidentiality.", "B": "Incorrect. System update frequency ensures security patches are applied but does not address potential privacy risks in data handling by the AI model.", "C": "Correct. **Data privacy** is the most important concern because the AI assistant will be processing **sensitive business information** (emails, reports, meeting summaries), and the legal team is worried that this information may be accessible by external entities.", "D": "Incorrect. Software licensing terms determine legal usage rights but do not protect sensitive information."}},
        {"id": "D85", "question": "Which low power mode is used with Windows 10 laptops to save power, but it takes longer to turn back on and resume where the user left off?", "options": {"A": "Power saver", "B": "Hibernate", "C": "Sleep", "D": "Balanced"}, "answer": "B", "explanation": {"correct": "B. Hibernate", "A": "Incorrect. Power saver is a power plan that favors energy savings over performance.", "B": "Correct. **Hibernate mode** is used to save the current session to the **hard drive** before powering off the computer to save battery life. Since it is loaded from the hard drive, the computer takes **longer to start up** again.", "C": "Incorrect. Sleep mode is used to save the current session to memory (RAM) and puts the computer into a minimal power state, allowing for a quicker resume time.", "D": "Incorrect. Balanced is a power plan that adjusts the performance to conserve energy on capable hardware."}},
        {"id": "D86", "question": "A client contacts the service desk and complains that their smartphone is warm to the touch and their battery only lasts 4 hours a day, not the 10 hours advertised by your company. You ask them for the status of several settings: Email (never), Maps (always), Calendar (while using), Messages (while using), Photos (never), App Store (while using), Bank (while using), and Weather (while using). Based on the information provided, what should be changed to resolve this client's problem?", "options": {"A": "Change the Weather setting to always", "B": "Change the Email setting to while using", "C": "Change the App Store to never", "D": "Change the Maps setting to while using"}, "answer": "D", "explanation": {"correct": "D. Change the Maps setting to while using", "A": "Incorrect. Changing the Weather setting to 'always' would increase battery drain.", "B": "Incorrect. Changing Email to 'while using' would increase battery drain when the app is open.", "C": "Incorrect. The App Store setting is already set to 'while using' and is reasonable.", "D": "Correct. The **Maps** setting is set to **'always'**. This means the app is continually checking the background's **GPS location**, which heavily uses the GPS receiver and cellular modem, leading to significant **battery drain** and the device being warm to the touch."}},
        {"id": "D87", "question": "Which of the following commands is used on a Linux system to change a file's permissions or directory on a system?", "options": {"A": "passwd", "B": "chown", "C": "chmod", "D": "pwd"}, "answer": "C", "explanation": {"correct": "C. chmod", "A": "Incorrect. The 'passwd' command changes passwords for user accounts.", "B": "Incorrect. The 'chown' command is used to change the owner of the file, directory, or link.", "C": "Correct. The **'chmod'** command sets the **permissions (modes)** of files or directories on a Linux system, restricting the way a file can be accessed.", "D": "Incorrect. The 'pwd' command displays the present working directory (current directory) path to the terminal or display."}},
        {"id": "D88", "question": "A team is working on a shared spreadsheet to track inventory. Some employees report seeing different data than their coworkers. What is the most likely reason?", "options": {"A": "Cached data is being displayed instead of live updates.", "B": "Too many users editing has caused hidden updates.", "C": "A system reboot is needed for changes to sync.", "D": "The spreadsheet automatically created multiple versions."}, "answer": "A", "explanation": {"correct": "A. Cached data is being displayed instead of live updates.", "A": "Correct. If employees see different data in a shared, collaborative application, they may be viewing **cached (older) information** instead of the real-time updates from the server. A simple browser refresh usually resolves this issue.", "B": "Incorrect. Most collaboration tools handle simultaneous edits well; exceeding limits would block edits, not hide updates.", "C": "Incorrect. Rebooting is unnecessary, as synchronization is handled by the application itself.", "D": "Incorrect. Cloud-based spreadsheets do not duplicate automatically; multiple versions would need to be created manually."}},
        {"id": "D89", "question": "Nicole's smartphone works fine when she is at work or the mall, but she has limited bandwidth on the device when she is in her apartment building. Nicole has asked you to help her. What is the FIRST step you should take in troubleshooting this issue?", "options": {"A": "Reset the data usage statistics on the smartphone", "B": "Update the smartphone's applications or OS", "C": "Reset the smartphone's wireless network settings", "D": "Verify the smartphone has adequate signal strength"}, "answer": "D", "explanation": {"correct": "D. Verify the smartphone has adequate signal strength", "A": "Incorrect. Resetting data usage statistics will not solve a bandwidth issue.", "B": "Incorrect. While updates are important, they are not the first step in troubleshooting a localized bandwidth issue.", "C": "Incorrect. Resetting wireless network settings would affect Wi-Fi, not the cellular network which is typically the cause of a localized bandwidth issue.", "D": "Correct. The **FIRST step** in troubleshooting limited bandwidth on a mobile device that works fine elsewhere is to **verify the smartphone has adequate signal strength (cellular signal)**. Low signal strength in a specific location directly leads to significantly reduced bandwidth."}},
        {"id": "D90", "question": "Which of the following policies or plans would describe the access requirements for connecting a user's laptop to the corporate network?", "options": {"A": "Bring your own device policy", "B": "Password policy", "C": "Onboarding policy", "D": "Remote access policy"}, "answer": "D", "explanation": {"correct": "D. Remote access policy", "A": "Incorrect. A bring your own device (BYOD) policy allows employees to access enterprise networks using personal mobile devices, but it does not specifically outline the *access requirements* for connecting a user's laptop to the corporate network over a VPN.", "B": "Incorrect. A password policy is a set of rules for creating and using dependable, secure passwords.", "C": "Incorrect. An onboarding policy is a documented policy that describes all the requirements for integrating a new employee into the company and its cultures.", "D": "Correct. A **remote access policy** is a document that outlines and defines **acceptable methods of remotely connecting** to the internal network, including the specific **access requirements** (e.g., VPN usage, security posture checks) for a user's laptop."}}
    ];

    // Placeholder data for other quiz files not provided in the prompt.
    // NOTE: In a real environment, you would include the full JSON data for these tests.
    const profMesserB = [
        {"id": "B6", "question": "A technician is delivering a new laptop to a user and moving the older laptop to a different user. The technician must ensure that none of the previous user’s data is available to the new user. Which of the following would be the best way to accomplish this?", "options": {"A": "Perform a regular format", "B": "Run a defragmentation", "C": "Connect the laptop to the Windows Domain", "D": "Delete the \\Users folder"}, "answer": "A", "explanation": {"correct": "A. Perform a regular format", "A": "Correct. A regular (or full) format overwrites every sector on the disk with zeros, securely removing all data and making it unrecoverable by normal means.", "B": "Incorrect. Defragmentation reorganizes data on a hard drive for performance; it does not delete it.", "C": "Incorrect. Connecting the laptop to the domain does not remove local user data.", "D": "Incorrect. Deleting the user's folder from the file system does not securely erase the data, which can still be recovered using specialized software."}},
            {"id": "B7", "question": "A company has just performed annual laser printer maintenance, which has resulted in a large number of used toner cartridges and fuser assemblies. Which of the following would be the proper disposal method for these items?", "options": {"A": "Take to a hazardous waste facility", "B": "Send in bulk to the local landfill", "C": "Separate the parts and dispose of normally", "D": "Contract with an incineration company"}, "answer": "A", "explanation": {"correct": "A. Take to a hazardous waste facility", "A": "Correct. Toner cartridges contain fine particulate dust that can be harmful if inhaled, and other printer components can contain hazardous materials. These items should be disposed of according to local environmental regulations, which usually means taking them to a hazardous waste facility or using a certified electronics recycling service.", "B": "Incorrect. Landfills have strict rules about electronic waste.", "C": "Incorrect. Normal disposal is not appropriate for these components.", "D": "Incorrect. Incineration is a specific disposal method that may not be appropriate or available."}},
            {"id": "B8", "question": "A user needs to modify a spreadsheet that is located on a network share. The spreadsheet application requires users to access the shared drive as a drive letter. Which command line options would provide this functionality?", "options": {"A": "tasklist", "B": "net use", "C": "diskpart", "D": "netstat"}, "answer": "B", "explanation": {"correct": "B. net use", "A": "Incorrect. The 'tasklist' command displays a list of currently running processes.", "B": "Correct. The 'net use' command is used in the Windows command line to connect to, or 'map', a network share to a local drive letter. The syntax would be 'net use <drive_letter>: \\\\<server_name>\\<share_name>'.", "C": "Incorrect. The 'diskpart' command is used for managing local disk partitions.", "D": "Incorrect. The 'netstat' command displays active network connections."}},
            {"id": "B9", "question": "A macOS server administrator needs a backup system to allow the recovery of data from any point in the last thirty days. Which should be used for this requirement?", "options": {"A": "Backup and Restore", "B": "Spotlight", "C": "Spaces", "D": "Time Machine"}, "answer": "D", "explanation": {"correct": "D. Time Machine", "A": "Incorrect. 'Backup and Restore' is a Windows utility.", "B": "Incorrect. Spotlight is the search feature in macOS.", "C": "Incorrect. Spaces is the virtual desktop feature in macOS.", "D": "Correct. Time Machine is the built-in backup software for macOS that automatically creates incremental backups, allowing users to restore their system to any specific point in time."}},
            {"id": "B10", "question": "Why would a technician use an ESD strap?", "options": {"A": "Protect electronic parts from extreme heat", "B": "Keep electronic parts dry and free from moisture", "C": "Prevent damage from static electricity", "D": "Protect computer parts from dust"}, "answer": "C", "explanation": {"correct": "C. Prevent damage from static electricity", "A": "Incorrect. ESD straps offer no protection from heat.", "B": "Incorrect. ESD straps do not protect from moisture.", "C": "Correct. An ESD (Electrostatic Discharge) strap safely grounds the technician, equalizing the electrical potential between them and the computer chassis. This prevents a sudden discharge of static electricity that can permanently damage sensitive electronic components.", "D": "Incorrect. ESD straps have no function related to dust protection."}},
            {"id": "B11", "question": "A technician needs to uninstall a video editing utility from a macOS laptop. Which folder would be the most likely location of this utility?", "options": {"A": "/Program Files", "B": "/Applications", "C": "/Library", "D": "/Users"}, "answer": "B", "explanation": {"correct": "B. /Applications", "A": "Incorrect. '/Program Files' is the standard application folder in Microsoft Windows.", "B": "Correct. In macOS, user-installed applications are stored in the /Applications folder.", "C": "Incorrect. The /Library folder contains system-wide application support files and settings.", "D": "Incorrect. The /Users folder contains the home directories for each user on the system."}},
            {"id": "B12", "question": "A technician is scheduled to replace a faulty motherboard today, but the delivery has been delayed. The end user needs this computer for an important meeting tomorrow. Which would be the best way to handle these events?", "options": {"A": "Move the installation to the next business day", "B": "Schedule another repair into today's newly opened time slot", "C": "Ask the delivery company for a refund on the shipping charges", "D": "Contact the end user and inform them of the shipping issue"}, "answer": "D", "explanation": {"correct": "D. Contact the end user...", "A": "Incorrect. While this may be the outcome, the first step is communication.", "B": "Incorrect. The priority should be managing the existing commitment.", "C": "Incorrect. This does not help the end user or solve the immediate problem.", "D": "Correct. The most professional response is to proactively communicate with the end user. Informing them of the delay as soon as possible allows them to make alternative plans and shows respect for their time and deadlines."}},
            {"id": "B13", "question": "A system administrator has been tasked with locating all of the log files contained within an application folder. The log files use the .log extension. Which of these Windows commands would be the best way to find these files?", "options": {"A": "sfc", "B": "diskpart", "C": "robocopy", "D": "dir"}, "answer": "D", "explanation": {"correct": "D. dir", "A": "Incorrect. 'sfc' is the System File Checker for repairing Windows files.", "B": "Incorrect. 'diskpart' is used to manage disk partitions.", "C": "Incorrect. 'robocopy' is a powerful file copying utility.", "D": "Correct. The 'dir' command lists directory contents. It can be used with wildcards to find specific files. For example, 'dir *.log /s' would search the current directory and all subdirectories for files ending with the .log extension."}},
            {"id": "B14", "question": "A user runs a corporate app on their smartphone which downloads a database each morning. Today, the download is taking minutes to complete instead of the usual seconds. Which should a technician follow as the best next troubleshooting step?", "options": {"A": "Disable Bluetooth", "B": "Run a network speed check", "C": "Charge the smartphone battery", "D": "Check the cloud storage resource usage"}, "answer": "B", "explanation": {"correct": "B. Run a network speed check", "A": "Incorrect. Bluetooth operates on a different frequency and is unlikely to affect Wi-Fi or cellular download speeds this drastically.", "B": "Correct. Since the problem is a slow download, the first logical step is to test the speed of the network connection (Wi-Fi or cellular) to determine if it is the source of the bottleneck.", "C": "Incorrect. Battery level does not impact network speed.", "D": "Incorrect. This would be a server-side issue, but the first step is to check the client's connection."}},
            {"id": "B15", "question": "A system administrator is analyzing a problem with a USB flash drive. Every time the drive is connected to a Windows computer, the CPU utilization increases to 100%. Which of the following utilities would be the best to begin troubleshooting this issue?", "options": {"A": "Services", "B": "Performance Monitor", "C": "Event Viewer", "D": "Device Manager"}, "answer": "D", "explanation": {"correct": "D. Device Manager", "A": "Incorrect. 'Services' manages background processes, but is not the primary tool for hardware issues.", "B": "Incorrect. Performance Monitor can track the high CPU usage, but not identify the hardware cause.", "C": "Incorrect. Event Viewer may contain logs, but Device Manager is more direct for hardware.", "D": "Correct. A high CPU spike when a hardware device is connected often points to a driver issue. The Device Manager is the utility used to check the status of hardware devices, troubleshoot driver problems, and update or reinstall drivers."}},
            {"id": "B16", "question": "A user is reporting some apps launched on their mobile phone will show an error message and then disappear without starting. Which of the following tasks would be the first step for troubleshooting this issue?", "options": {"A": "Install the previous version of the apps", "B": "Connect the phone to a power source", "C": "Power cycle the phone", "D": "Disable the GPS radio"}, "answer": "C", "explanation": {"correct": "C. Power cycle the phone", "A": "Incorrect. Rolling back app versions is a complex step and not the first choice.", "B": "Incorrect. Power level is unlikely to cause multiple apps to crash.", "C": "Correct. For general instability issues on a mobile device, the simplest and often most effective first troubleshooting step is to perform a power cycle (reboot). This can clear temporary glitches in memory or services that may be causing the apps to crash.", "D": "Incorrect. The GPS radio is unrelated to application stability."}},
            {"id": "B17", "question": "A technician has been asked to power down and store a server which has been exploited by an external attacker. This server will be used later in a legal proceeding. Which of the following would be most important to ensure the integrity of the server data?", "options": {"A": "Report the server location to the proper channels", "B": "Compile all support tickets associated with the server", "C": "Maintain a chain of custody", "D": "Take photos of the server in the storage room"}, "answer": "C", "explanation": {"correct": "C. Maintain a chain of custody", "A": "Incorrect. This is part of the process, but not the overarching principle.", "B": "Incorrect. This is supplementary documentation.", "C": "Correct. When evidence is collected for a potential legal case, it is critical to maintain a chain of custody. This is a formal, documented log of every person who handled the evidence, when they handled it, and what they did with it, ensuring that the evidence has not been tampered with.", "D": "Incorrect. Photos are good for documentation but are part of the chain of custody, not the principle itself."}},
            {"id": "B18", "question": "A user has opened a help desk ticket to remove malware from his laptop. A previous removal occurred two weeks earlier, but the same malware has returned. Which of the following was missed during the first malware removal?", "options": {"A": "Restart the computer", "B": "Educate the end-user", "C": "Enable System Protection", "D": "Quarantine infected systems"}, "answer": "B", "explanation": {"correct": "B. Educate the end-user", "A": "Incorrect. Restarting is a standard part of the removal process.", "B": "Correct. According to the CompTIA malware removal process, the final step is to educate the end-user. If the user continues the same unsafe behavior (e.g., clicking on malicious links, downloading untrusted software) that led to the first infection, reinfection is likely. This step is crucial for preventing recurrence.", "C": "Incorrect. System Protection should be disabled before removal and re-enabled after.", "D": "Incorrect. Quarantining the system is the first step."}},
            {"id": "B19", "question": "Which of the following features would be found in Windows 11 Pro but not in Windows 11 Home?", "options": {"A": "32-bit and 64-bit versions", "B": "Domain access", "C": "RDP client", "D": "Windows Workgroup"}, "answer": "B", "explanation": {"correct": "B. Domain access", "A": "Incorrect. Windows 11 is only available in 64-bit versions.", "B": "Correct. The ability to join a Windows Server Active Directory domain is a key feature that differentiates the Professional edition of Windows from the Home edition.", "C": "Incorrect. The Remote Desktop Protocol (RDP) client is available in all editions of Windows.", "D": "Incorrect. All editions of Windows can join a workgroup."}},
            {"id": "B20", "question": "A medical research company is using laptop computers when visiting testing centers. The company is concerned about the security of the protected health information (PHI) if a laptop is lost or stolen. Which of the following would be the best way to manage this issue?", "options": {"A": "BIOS password", "B": "Authenticator application", "C": "Full disk encryption", "D": "Biometric authentication", "E": "Cable lock"}, "answer": "C", "explanation": {"correct": "C. Full disk encryption", "A": "Incorrect. A BIOS password can be easily bypassed by removing the hard drive.", "B": "Incorrect. An authenticator app protects the login process, not the data on the disk.", "C": "Correct. Full disk encryption (like BitLocker) encrypts all data at rest on the storage drive. If the laptop is stolen, the data remains unreadable and secure even if the drive is removed.", "D": "Incorrect. Biometrics protect the login process but do not encrypt the data at rest.", "E": "Incorrect. A cable lock prevents physical theft of the laptop but does nothing to protect the data if the theft is successful."}},
            {"id": "B21", "question": "A security administrator is installing a new VPN connection for remote users. The administrator would like to use a centralized authentication service. Which of the following technologies would provide this functionality?", "options": {"A": "RADIUS", "B": "WPA3", "C": "TKIP", "D": "AES"}, "answer": "A", "explanation": {"correct": "A. RADIUS", "A": "Correct. RADIUS (Remote Authentication Dial-In User Service) is a client/server protocol that provides centralized Authentication, Authorization, and Accounting (AAA) for users connecting to network services like a VPN.", "B": "Incorrect. WPA3 is a security protocol for wireless networks.", "C": "Incorrect. TKIP is an outdated Wi-Fi encryption protocol.", "D": "Incorrect. AES is a modern encryption standard used by many technologies, but it is not an authentication service itself."}},
            {"id": "B22", "question": "A mobile user is using apps on their smartphone for most business tasks. The user would like to ensure their business data is backed up each day. Which of the following would be the best way to provide these backups?", "options": {"A": "Connect an external USB drive", "B": "Use incremental backups each night", "C": "Connect the smartphone to a laptop", "D": "Use a cloud backup service"}, "answer": "D", "explanation": {"correct": "D. Use a cloud backup service", "A": "Incorrect. Connecting an external drive to a smartphone for backups is impractical.", "B": "Incorrect. This describes a backup method, not a solution.", "C": "Incorrect. This requires manual intervention and is not a reliable daily solution.", "D": "Correct. Modern smartphones are designed to integrate seamlessly with cloud backup services (like iCloud or Google One). These services can automatically back up data whenever the device is connected to Wi-Fi, making it the most reliable and user-friendly solution."}},
            {"id": "B23", "question": "A desktop administrator is moving an SSD from one laptop to another. Which of the following should be used to protect the SSD during the move?", "options": {"A": "Padded envelope", "B": "Anti-static bag", "C": "Box with foam filler", "D": "Cloth wrap"}, "answer": "B", "explanation": {"correct": "B. Anti-static bag", "A": "Incorrect. A padded envelope protects against physical shock but not static.", "B": "Correct. An anti-static bag is specifically designed to create a Faraday cage effect, protecting sensitive electronic components like an SSD from damage caused by electrostatic discharge (ESD).", "C": "Incorrect. Foam can generate static electricity and is not safe unless it is specifically anti-static foam.", "D": "Incorrect. A cloth wrap offers no protection from ESD."}},
            {"id": "B24", "question": "A user is performing a series of Google searches, but the results pages are displaying links and advertisements from a different website. When the user clicks a link, the browser is redirected to a malicious site. Which of the following would resolve this issue?", "options": {"A": "Run the search from Safe Mode", "B": "Install the latest operating system patches", "C": "Run a malware removal utility", "D": "Login as a different user"}, "answer": "C", "explanation": {"correct": "C. Run a malware removal utility", "A": "Incorrect. Safe Mode might prevent the malware from loading, but it won't remove it.", "B": "Incorrect. Patching is a preventative measure, not a fix for an active infection.", "C": "Correct. These symptoms are classic signs of a browser hijacker or other adware/malware infection that is intercepting and redirecting web traffic. Running a reputable malware removal utility is the proper step to find and remove the infection.", "D": "Incorrect. The malware is likely installed system-wide and will affect all users."}},
            {"id": "B25", "question": "A user in the accounting department is having an issue with his smartphone reaching websites and retrieving mail when working from home. The phone works normally when in the office. Which of the following would be the best next step?", "options": {"A": "Verify the network configuration at home", "B": "Install the latest operating system updates", "C": "Connect the phone to power when working at home", "D": "Restart the smartphone after arriving at home"}, "answer": "A", "explanation": {"correct": "A. Verify the network configuration at home", "A": "Correct. The problem only occurs in one location (home). This strongly indicates the issue is with the local environment. The first step is to troubleshoot the home Wi-Fi network: check if the router is working, verify the internet connection is active, and ensure the phone is connected with the correct password.", "B": "Incorrect. OS updates are unlikely to fix a location-specific network issue.", "C": "Incorrect. Power is unrelated to network connectivity.", "D": "Incorrect. Restarting is a good general step, but checking the network is more specific to this problem."}},
            {"id": "B26", "question": "A security administrator has been asked to reinstall Windows on a web server diagnosed with a rootkit infection. Which of the following installation methods would be the best choice for this server?", "options": {"A": "In-place upgrade", "B": "Remote network installation", "C": "Clean install", "D": "Repair installation"}, "answer": "C", "explanation": {"correct": "C. Clean install", "A": "Incorrect. An in-place upgrade preserves files and settings, and could leave traces of the rootkit behind.", "B": "Incorrect. This describes a deployment method, not an installation type.", "C": "Correct. Rootkits embed themselves deeply into the operating system and can be impossible to remove completely. The only way to be 100% certain that the malware is gone is to perform a clean install, which involves formatting the drive and installing a fresh, trusted copy of the OS.", "D": "Incorrect. A repair installation attempts to fix the current OS, which cannot be trusted after a rootkit infection."}},
            {"id": "B27", "question": "A local coffee shop has a public wireless network for customers and a private wireless network for company devices. Both networks are managed from the same access point. Which of the following should be configured on this network?", "options": {"A": "Install a new access point for company devices", "B": "Configure WPA3 on the company network", "C": "Require static IP addresses on the customer network", "D": "Assign MAC filters to the company network"}, "answer": "B", "explanation": {"correct": "B. Configure WPA3 on the company network", "A": "Incorrect. While separate hardware is an option, it's not a required configuration.", "B": "Correct. The private company network should be protected with the strongest available encryption to protect business data. WPA3 is the current standard and provides the highest level of security.", "C": "Incorrect. This would be difficult to manage and offers no security benefit.", "D": "Incorrect. While MAC filtering can add a layer of security, strong encryption is far more important."}},
            {"id": "B28", "question": "A user in the shipping department has logged into the Windows domain, but their profile has loaded with a temporary account. The desktop does not show the user’s normal wallpaper, and their documents are missing. Which of these would be the best way to restore the user’s normal work environment?", "options": {"A": "Rename the user’s folder and delete their profile in the registry", "B": "Boot into Safe Mode and disable all startup applications", "C": "Add the user to the Administrator group", "D": "Update to the latest operating system version"}, "answer": "A", "explanation": {"correct": "A. Rename the user’s folder...", "A": "Correct. This is the classic symptom of a corrupted user profile. The standard procedure to fix this is to log in as an administrator, navigate to C:\\Users and rename the user's profile folder (e.g., to 'username.old'), then use the registry editor (regedit) to delete the user's profile key from the S-1-5 list under ProfileList. When the user logs in again, Windows will create a fresh profile.", "B": "Incorrect. This is unrelated to a corrupted profile.", "C": "Incorrect. This would not fix the profile and is a major security risk.", "D": "Incorrect. An OS update will not repair a user profile."}},
            {"id": "B29", "question": "A company’s shipping department maintains ten different computers for printing shipping labels. All systems are displaying an error when they access a third-party shipping management website that uses HTTPS. Which would be the most likely reason?", "options": {"A": "The computers have not been updated with the latest OS patches", "B": "The website certificate has expired", "C": "The local computer storage drives are not encrypted", "D": "The systems are infected with malware"}, "answer": "B", "explanation": {"correct": "B. The website certificate has expired", "A": "Incorrect. While possible, it's less likely to affect all ten computers at once.", "B": "Correct. If all devices suddenly start having security errors when accessing a single HTTPS website, the most probable cause is a server-side issue. An expired SSL/TLS certificate on the web server would cause all modern browsers to display a security warning and block the connection.", "C": "Incorrect. Local drive encryption is unrelated to accessing a website.", "D": "Incorrect. It is highly unlikely that all ten systems would become infected with the exact same malware at the same time."}},
            {"id": "B30", "question": "A manufacturing company performs a third-party audit of their systems each year. The auditors are provided with their own user accounts, and when the audit is over, the auditors should be prevented from logging on until the following audit process begins. Which would be the best way to accomplish this?", "options": {"A": "Uninstall the audit software", "B": "Assign an expiration date to the auditor accounts", "C": "Remove the auditor accounts from all Windows groups", "D": "Require two-factor authentication for the auditor accounts"}, "answer": "B", "explanation": {"correct": "B. Assign an expiration date...", "A": "Incorrect. This does not disable the user accounts.", "B": "Correct. The best practice for temporary accounts is to configure an account expiration date in Active Directory. On that date, the account will be automatically disabled without any further intervention, and it can be easily re-enabled for the next audit.", "C": "Incorrect. This would not prevent the account from logging in, it would only remove its permissions.", "D": "Incorrect. This adds security but does not disable the accounts."}},
            {"id": "B31", "question": "A manufacturing company is donating some older computers to a local charity. Which of the following should be done to ensure the existing hard drives could still be used but none of the existing data would be recoverable?", "options": {"A": "Degaussing", "B": "Regular format", "C": "Shredder", "D": "Quick format"}, "answer": "B", "explanation": {"correct": "B. Regular format", "A": "Incorrect. Degaussing uses a powerful magnet and can render a hard disk drive permanently unusable.", "B": "Correct. A regular (full) format overwrites the data on the drive, making it unrecoverable by normal means, but it leaves the drive completely functional and ready for a new OS installation by the charity.", "C": "Incorrect. A shredder physically destroys the drive, making it unusable.", "D": "Incorrect. A quick format does not securely erase the data."}},
            {"id": "B32", "question": "A user's video editing workstation often performs an overnight rendering process. Occasionally, a brief power outage will cause the computer to shut down and lose the unsaved work. Which of the following should be used to avoid these issues?", "options": {"A": "Use a surge suppressor", "B": "Save the rendered file to an external storage drive", "C": "Create a separate partition for user documents", "D": "Install a UPS"}, "answer": "D", "explanation": {"correct": "D. Install a UPS", "A": "Incorrect. A surge suppressor protects against power spikes, but provides no power during an outage.", "B": "Incorrect. This doesn't prevent the computer from shutting down.", "C": "Incorrect. This is a file organization method, not a power solution.", "D": "Correct. A UPS (Uninterruptible Power Supply) contains a battery that provides temporary power to the workstation during a power outage. This gives the system enough time to survive a brief outage or perform a graceful shutdown, preventing data loss."}},
            {"id": "B33", "question": "A desktop administrator is troubleshooting an older computer which has been slowing down over time. The computer is using a magnetic hard disk drive. Which of the following commands would be the best choice for increasing the performance of this computer?", "options": {"A": "defrag", "B": "format", "C": "sfc", "D": "xcopy"}, "answer": "A", "explanation": {"correct": "A. defrag", "A": "Correct. Over time, files on a magnetic hard disk drive (HDD) can become fragmented (stored in non-contiguous blocks). This slows down read times. The 'defrag' utility reorganizes these files into contiguous blocks, which can improve performance on older HDDs.", "B": "Incorrect. The 'format' command will erase all data on the drive.", "C": "Incorrect. 'sfc' is the System File Checker.", "D": "Incorrect. 'xcopy' is a file copying utility."}},
            {"id": "B34", "question": "A user is receiving alerts on their desktop computer stating, 'Access to this PC has been blocked for security reasons.' The alert asks the user to call a phone number to get the system unlocked. Which of the following would be the best next step?", "options": {"A": "Update the desktop computer operating system", "B": "Check the certificate of the corporate web server", "C": "Restart the desktop computer", "D": "Run an anti-malware utility"}, "answer": "D", "explanation": {"correct": "D. Run an anti-malware utility", "A": "Incorrect. An OS update will not remove malware.", "B": "Incorrect. This issue is on the local PC, not a web server.", "C": "Incorrect. A restart is unlikely to remove persistent malware.", "D": "Correct. This is a classic example of scareware or ransomware. The message is fake and designed to trick the user into calling a fraudulent number. The system is infected with malware, and the correct response is to run a reputable anti-malware utility to scan for and remove the threat."}},
            {"id": "B35", "question": "A system administrator has inadvertently installed a Trojan horse which has deleted a number of files. The administrator was logged in with an account that was a member of the Domain Admins group. Which of the following would limit the scope of future exploits?", "options": {"A": "Require multi-factor authentication", "B": "Disable all guest accounts", "C": "Modify the default permissions", "D": "Configure full disk encryption"}, "answer": "C", "explanation": {"correct": "C. Modify the default permissions", "A": "Incorrect. MFA protects against unauthorized logins, but not against actions taken by an already logged-in administrator.", "B": "Incorrect. Guest accounts are not relevant here.", "C": "Correct. The issue was that the administrator was using a highly privileged account for daily tasks. The principle of least privilege dictates that users should only have the minimum permissions necessary. By modifying permissions and using a standard user account for daily work (and only elevating to administrator when needed), the scope of damage from malware is significantly reduced.", "D": "Incorrect. Encryption protects data at rest but does not stop malware from deleting files."}},
            {"id": "B36", "question": "A technician has created a Windows image which can be used across all of the computers in a test lab. Which of the following would be the best way to deploy these images?", "options": {"A": "Clean install", "B": "Remote network installation", "C": "Repair installation", "D": "Bootable USB"}, "answer": "B", "explanation": {"correct": "B. Remote network installation", "A": "Incorrect. This is an installation type, not a deployment method.", "B": "Correct. To deploy a single image to multiple computers efficiently, a remote network installation is the best method. Using technologies like PXE booting and a deployment server (e.g., Windows Deployment Services), the technician can install the image on many machines simultaneously over the network.", "C": "Incorrect. A repair installation fixes an existing OS.", "D": "Incorrect. Using a USB for each machine would be slow and inefficient compared to a network deployment."}},
            {"id": "B37", "question": "Which of the following Windows Share permissions has the priority when assigning access on a mapped drive?", "options": {"A": "Allow", "B": "Full control", "C": "List folder contents", "D": "Deny"}, "answer": "D", "explanation": {"correct": "D. Deny", "A": "Incorrect. 'Allow' is the default, but 'Deny' overrides it.", "B": "Incorrect. Full control is an 'Allow' permission.", "C": "Incorrect. This is an 'Allow' permission.", "D": "Correct. In the Windows permission model, an explicit 'DenY' permission always takes precedence. If a user is a member of one group that is allowed access and another group that is denied access, the 'Deny' permission will win and access will be blocked."}},
            {"id": "B38", "question": "A data center manager would like to ensure any potential power fault on a server would not be harmful to employees. Which of the following would be the best choice for this requirement?", "options": {"A": "Electrical ground", "B": "Battery backup", "C": "Air filter mask", "D": "ESD mat"}, "answer": "A", "explanation": {"correct": "A. Electrical ground", "A": "Correct. A proper electrical ground is a fundamental safety feature. It provides a safe path for stray electrical current to travel to the earth in the event of a short circuit or fault. This prevents the metal chassis of the server from becoming energized and posing a severe electrical shock hazard to personnel.", "B": "Incorrect. A battery backup (UPS) provides power continuity, not protection from electrical faults.", "C": "Incorrect. An air filter mask is for respiratory protection.", "D": "Incorrect. An ESD mat protects equipment from static, not people from power faults."}},
            {"id": "B39", "question": "A user in the shipping department has received a call from someone claiming to be from the IT Help Desk. The caller states they need the user’s password to perform an urgent security update. Which of the following would describe this situation?", "options": {"A": "Denial of service", "B": "Social engineering", "C": "Brute force", "D": "Shoulder surfing"}, "answer": "B", "explanation": {"correct": "B. Social engineering", "A": "Incorrect. A denial of service attack aims to make a service unavailable.", "B": "Correct. Social engineering is the art of manipulating people into divulging confidential information or performing actions they shouldn't. This scenario, where an attacker creates a pretext (urgent update) to trick a user into giving up their password, is a classic example of social engineering.", "C": "Incorrect. A brute force attack is an automated attempt to guess a password.", "D": "Incorrect. Shoulder surfing is directly observing someone as they type in their password."}},
            {"id": "B40", "question": "A desktop administrator has just removed malware from a user’s desktop computer. The administrator has already scheduled future anti-virus scans. Which of the following should be the next step in the removal process?", "options": {"A": "Enable System Restore", "B": "Educate the end-user", "C": "Quarantine the computer", "D": "Boot to Safe Mode"}, "answer": "A", "explanation": {"correct": "A. Enable System Restore", "A": "Correct. According to the CompTIA 7-step malware removal process, after remediating the system and scheduling future scans/updates, the next step is to re-enable System Restore and create a new, clean restore point. This is done after the old, potentially infected restore points were deleted by disabling the feature earlier in the process.", "B": "Incorrect. Educating the end-user is the final step in the process.", "C": "Incorrect. Quarantining is the first step.", "D": "Incorrect. Booting to Safe Mode is a troubleshooting technique, not a post-remediation step."}},
            {"id": "B41", "question": "A user would like to encrypt a small group of files in a shared folder without modifying other files on the drive. Which of the following would be the best way to accomplish this?", "options": {"A": "EFS", "B": "Save the files with Administrator rights", "C": "BitLocker", "D": "Save the files with a dollar sign at the end of the filename"}, "answer": "A", "explanation": {"correct": "A. EFS", "A": "Correct. EFS (Encrypting File System) is a feature of the NTFS file system in Windows that allows for the encryption of individual files and folders. This allows the user to selectively encrypt certain files while leaving others in the same location unencrypted.", "B": "Incorrect. Administrator rights are for permissions, not encryption.", "C": "Incorrect. BitLocker is a full-volume encryption technology; it encrypts the entire drive, not individual files.", "D": "Incorrect. A dollar sign in a share name hides the share; it has no effect on files."}},
            {"id": "B42", "question": "Which of the following partition types limit a Windows installation to a maximum partition size of 2 TB?", "options": {"A": "FAT32", "B": "GPT", "C": "APFS", "D": "MBR"}, "answer": "D", "explanation": {"correct": "D. MBR", "A": "Incorrect. FAT32 has a file size limit of 4 GB and a volume size limit that varies, but the key limitation is from MBR.", "B": "Incorrect. GPT (GUID Partition Table) supports much larger partition sizes, into the zettabytes.", "C": "Incorrect. APFS is the Apple File System.", "D": "Correct. The MBR (Master Boot Record) partitioning scheme uses a 32-bit value for the sector address, which limits the maximum addressable size of a partition to 2 terabytes (TB)."}},
            {"id": "B43", "question": "A user in the engineering department needs to use some applications written for Windows, but also needs to use applications designed for Linux. Which of the following would be the best way to provide access to these applications?", "options": {"A": "Assign the user multiple computers", "B": "Boot the operating systems from two removable USBs", "C": "Configure the user's PC for multiboot", "D": "Compile the Linux applications in Windows"}, "answer": "C", "explanation": {"correct": "C. Configure the user's PC for multiboot", "A": "Incorrect. This is inefficient and costly.", "B": "Incorrect. While possible with 'live' USBs, this is not a practical permanent solution.", "C": "Correct. A multiboot (or dual-boot) configuration allows for two or more operating systems to be installed on the same computer in separate partitions. At startup, the user can choose which OS to load, giving them native access to all the applications for that environment.", "D": "Incorrect. Compiling Linux applications for Windows is a highly complex process and often not possible."}},
            {"id": "B44", "question": "A help desk technician has been tasked with rebuilding an email server which recently crashed. Which of the following would be the best source for the information required to reconstruct this system?", "options": {"A": "Compliance report", "B": "Acceptable use policies", "C": "Network topology map", "D": "Knowledge base"}, "answer": "D", "explanation": {"correct": "D. Knowledge base", "A": "Incorrect. A compliance report would detail adherence to regulations, not server build specs.", "B": "Incorrect. An AUP is a policy for end-users.", "C": "Incorrect. A network topology map shows how the server connects to the network, but not how it is configured internally.", "D": "Correct. A well-maintained IT knowledge base or internal wiki should contain detailed documentation, including server build sheets, configuration details, and installation procedures, which are essential for accurately reconstructing a failed system."}},
            {"id": "B45", "question": "The employees of a company have direct access to applications and databases from their desktop computers, but the company’s security policy states no user or device is trusted by default. Which of the following would best describe this policy?", "options": {"A": "Multifactor authentication", "B": "Group Policy", "C": "Least privilege", "D": "Zero trust"}, "answer": "D", "explanation": {"correct": "D. Zero trust", "A": "Incorrect. MFA is one component of a zero trust model, but not the model itself.", "B": "Incorrect. Group Policy is a tool for implementing policies, not the policy itself.", "C": "Incorrect. Least privilege is a component of zero trust, but 'never trust, always verify' is the core of zero trust.", "D": "Correct. A zero trust security model is based on the principle of 'never trust, always verify.' It assumes that no user or device is trusted by default, even if it is inside the corporate network, and requires strict identity verification for every access request."}},
            {"id": "B46", "question": "A user has called the help desk to get assistance with random blue screens on their Windows laptop. The user states the crashes have become more frequent over the last week. Which of the following would be the most likely reason for these issues?", "options": {"A": "Storage drive is failing", "B": "Network proxy settings are incorrect", "C": "Operating system needs to be updated", "D": "Laptop has a malware infection", "E": "Video subsystem is faulty"}, "answer": "D", "explanation": {"correct": "D. Laptop has a malware infection", "A": "Incorrect. A failing storage drive is more likely to cause file corruption errors or failure to boot.", "B": "Incorrect. Proxy settings would cause network issues, not system crashes.", "C": "Incorrect. Missing updates could be a cause, but a sudden increase in frequency points to something more active.", "D": "Correct. Malware, especially rootkits that operate at a low level of the operating system, can cause system instability that leads to frequent Blue Screen of Death (BSOD) errors.", "E": "Incorrect. A faulty video subsystem would more likely cause display artifacts, driver crashes, or a black screen."}},
            {"id": "B47", "question": "A technician is troubleshooting an issue with an iOS tablet randomly restarting during normal use. The issue began immediately after an operating system update. Which of the following would be the most likely reason for these random reboots?", "options": {"A": "Faulty OS upgrade", "B": "Invalid device certificate", "C": "Malware infection", "D": "Faulty battery", "E": "Incorrect network settings"}, "answer": "A", "explanation": {"correct": "A. Faulty OS upgrade", "A": "Correct. When a major issue like random reboots begins immediately after an OS update, the most likely cause is that the upgrade process was corrupted or contained a bug. The OS files may be damaged, leading to system instability.", "B": "Incorrect. An invalid certificate would cause connection errors, not reboots.", "C": "Incorrect. While possible, malware is less common on iOS, and the timing points to the update.", "D": "Incorrect. A faulty battery would more likely cause sudden shutdowns, not restarts.", "E": "Incorrect. Network settings are unrelated to system stability."}},
            {"id": "B48", "question": "A system administrator needs to modify a file in the \\Windows\\Installer directory, but the folder doesn’t appear in the list of available files. Which of these options would help?", "options": {"A": "Safe Mode", "B": "File Explorer Options", "C": "User Accounts", "D": "Internet Options"}, "answer": "B", "explanation": {"correct": "B. File Explorer Options", "A": "Incorrect. Safe Mode is a diagnostic boot mode and does not change file visibility.", "B": "Correct. By default, Windows hides protected operating system files to prevent accidental deletion or modification. To see these files, the administrator must go to File Explorer Options, select the 'View' tab, and uncheck the option for 'Hide protected operating system files (Recommended)'.", "C": "Incorrect. User Accounts are for managing user profiles.", "D": "Incorrect. Internet Options are for configuring the web browser."}},
            {"id": "B49", "question": "A Linux administrator is modifying a log file and needs to rename the file. Which of the following should be used to make this change?", "options": {"A": "rm", "B": "mv", "C": "mkdir", "D": "pwd"}, "answer": "B", "explanation": {"correct": "B. mv", "A": "Incorrect. The 'rm' command is used to remove (delete) files.", "B": "Correct. The 'mv' (move) command in Linux is used for both moving a file to a different directory and for renaming a file. The syntax to rename is 'mv <old_filename> <new_filename>'.", "C": "Incorrect. The 'mkdir' command is used to make a new directory.", "D": "Incorrect. The 'pwd' command is used to print the working directory."}},
            {"id": "B50", "question": "A desktop administrator is troubleshooting poor performance on a user’s laptop computer. The administrator has identified the symptoms as high network utilization and unauthorized outbound connections. Which of the following steps should the technician do next?", "options": {"A": "Educate the end-user", "B": "Schedule periodic anti-virus scans", "C": "Enable System Protection", "D": "Disconnect the laptop from the network"}, "answer": "D", "explanation": {"correct": "D. Disconnect the laptop from the network", "A": "Incorrect. User education is the final step.", "B": "Incorrect. Scheduling scans is a later, preventative step.", "C": "Incorrect. System Protection should be handled during remediation.", "D": "Correct. The symptoms strongly indicate a malware infection (likely a botnet or spyware). According to the malware removal process, the first step is to identify and quarantine the infected system. Disconnecting the laptop from the network immediately quarantines it, preventing it from spreading the malware or communicating with the attacker."}},

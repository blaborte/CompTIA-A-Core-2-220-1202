        // Global variables and the rest of the JavaScript functions...
        const quizContainerEl = document.getElementById('quiz-container');
        let quizData = []; 
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answerSubmitted = false;
        let timerInterval;

        function showSetupScreen() {
            quizContainerEl.innerHTML = `
                <div id="setup-screen">
                    <h2>Mixed Review Quiz Settings</h2>
                    <div class="setup-option">
                        <label for="num-questions">Number of Questions:</label>
                        <select id="num-questions">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="30">30</option>
                            <option value="all">All (${allQuizData.length})</option>
                        </select>
                    </div>
                    <div class="setup-option">
                        <label for="time-limit">Time Limit:</label>
                        <select id="time-limit">
                            <option value="untimed">Untimed</option>
                            <option value="15">15 Minutes</option>
                            <option value="30">30 Minutes</option>
                            <option value="60">60 Minutes</option>
                            <option value="90" selected>90 Minutes</option>
                        </select>
                    </div>
                    <button id="start-quiz-btn">Start Quiz</button>
                </div>
            `;
            document.getElementById('start-quiz-btn').addEventListener('click', initializeQuiz);
        }

        function initializeQuiz() {
            const numQuestions = document.getElementById('num-questions').value;
            const timeSelection = document.getElementById('time-limit').value;
            
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            
            const shuffled = [...allQuizData].sort(() => 0.5 - Math.random());
            quizData = numQuestions === 'all' ? shuffled : shuffled.slice(0, Number(numQuestions));

            renderQuizUI();
            
            if (timeSelection !== 'untimed') {
                startTimer(Number(timeSelection));
            }
        }
        
        function renderQuizUI() {
            quizContainerEl.innerHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="timer">--:--</div>
                <div id="quiz-header">
                    <h1>CompTIA A+ Core 2 (220-1202) Mixed Review Quiz</h1>
                    <p id="creator-tag">Created by: BLaborte</p>
                </div>
                <div id="quiz-body">
                    <p id="question-text"></p>
                    <ul id="options-list"></ul>
                    <div id="explanation-container" style="display: none;"></div>
                </div>
                <div id="quiz-footer">
                    <div id="score-text">Score: 0</div>
                    <div id="footer-buttons">
                        <button id="submit-btn">Submit Answer</button>
                    </div>
                </div>
            `;
            document.getElementById('submit-btn').addEventListener('click', checkAnswer);
            loadQuiz();
        }

        function startTimer(minutes) {
            let timeInSeconds = minutes * 60;
            const timerEl = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                const mins = Math.floor(timeInSeconds / 60);
                let secs = timeInSeconds % 60;
                secs = secs < 10 ? '0' + secs : secs;
                timerEl.textContent = `${mins}:${secs}`;
                if (timeInSeconds < 0) {
                    clearInterval(timerInterval);
                    showResults();
                }
                timeInSeconds--;
            }, 1000);
        }

        function loadQuiz() {
            answerSubmitted = false;
            const currentQuestion = quizData[currentQuestionIndex];
            
            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
            const optionsListEl = document.getElementById('options-list');
            optionsListEl.innerHTML = ''; 

            // NOTE: This does not currently support multiple-choice (checkbox) questions.
            // It will render them as single-choice (radio) questions.
            for (const key in currentQuestion.options) {
                const option = document.createElement('li');
                option.classList.add('option');
                option.innerHTML = `<input type="radio" name="option" id="${key}" value="${key}"><label for="${key}">${key}. ${currentQuestion.options[key]}</label>`;
                optionsListEl.appendChild(option);
            }
            
            const explanationContainer = document.getElementById('explanation-container');
            if (explanationContainer) explanationContainer.style.display = 'none';

            document.getElementById('footer-buttons').innerHTML = '<button id="submit-btn">Submit Answer</button>';
            document.getElementById('submit-btn').addEventListener('click', checkAnswer);
        }

        function checkAnswer() {
            if (answerSubmitted) return;
            const selectedOptionInput = document.querySelector('input[name="option"]:checked');
            if (!selectedOptionInput) {
                alert('Please select an answer!');
                return;
            }
            answerSubmitted = true;
            const selectedAnswer = selectedOptionInput.value;
            const correctAnswer = quizData[currentQuestionIndex].answer;

            // NOTE: This logic only works for single-string answers, not for arrays of answers.
            const isCorrect = Array.isArray(correctAnswer) 
                ? correctAnswer.includes(selectedAnswer) // A simple check, but can't handle multiple selections yet
                : selectedAnswer === correctAnswer;

            userAnswers.push({ question: quizData[currentQuestionIndex], userAnswer: selectedAnswer, isCorrect: isCorrect });

            if (isCorrect) {
                score++;
            }
            document.getElementById('score-text').innerText = `Score: ${score}`;
            
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.classList.add('no-click');
                const input = option.querySelector('input');
                const isCorrectAnswer = Array.isArray(correctAnswer) ? correctAnswer.includes(input.value) : input.value === correctAnswer;
                if (isCorrectAnswer) {
                    option.classList.add('correct');
                } else if (input.value === selectedAnswer) {
                    option.classList.add('incorrect');
                }
            });

            showExplanation();
            
            const footerButtons = document.getElementById('footer-buttons');
            let nextButtonHTML = '';
            if (currentQuestionIndex < quizData.length - 1) {
                nextButtonHTML = `<button id="next-btn">Next Question</button>`;
            } else {
                nextButtonHTML = `<button id="next-btn">Finish Quiz</button>`;
            }
            
            footerButtons.innerHTML = `<button id="toggle-explanation-btn">Show Explanation</button>${nextButtonHTML}`;
            
            document.getElementById('toggle-explanation-btn').addEventListener('click', toggleExplanation);
            document.getElementById('next-btn').addEventListener('click', () => {
                if (currentQuestionIndex < quizData.length - 1) {
                    currentQuestionIndex++;
                    loadQuiz();
                } else {
                    showResults();
                }
            });
        }

        function showExplanation() {
            const explanationData = quizData[currentQuestionIndex].explanation;
            let explanationContainer = document.getElementById('explanation-container');
            if (!explanationContainer) return;
            
            let explanationHTML = `<div class="explanation-title">Correct Answer: ${explanationData.correct}</div>`;
            explanationHTML += '<div class="explanation-text">';
            for(const key in explanationData) {
                if(key !== 'correct'){
                    explanationHTML += `<p><strong>${key.toUpperCase()}:</strong> ${explanationData[key]}</p>`;
                }
            }
            explanationHTML += '</div>';

            explanationContainer.innerHTML = explanationHTML;
        }

        function toggleExplanation() {
            const explanationContainer = document.getElementById('explanation-container');
            const toggleBtn = document.getElementById('toggle-explanation-btn');
            const isHidden = explanationContainer.style.display === 'none';
            
            explanationContainer.style.display = isHidden ? 'block' : 'none';
            toggleBtn.textContent = isHidden ? 'Hide Explanation' : 'Show Explanation';
        }
        
        function showResults() {
            if (timerInterval) clearInterval(timerInterval);
            
            let resultsHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="quiz-header"><h1>Quiz Results</h1></div>
                <div id="quiz-body">
                    <div class="results-summary">
                        <h2>Your final score is ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)</h2>
                    </div>
                    <div class="results-list">
            `;

            userAnswers.forEach((answer, index) => {
                const question = answer.question;
                resultsHTML += `
                    <div class="result-item">
                        <p class="result-question">${index + 1}. ${question.question}</p>
                        <ul class="result-options">
                `;
                for(const key in question.options) {
                    let className = 'result-option';
                    const isCorrectAnswer = Array.isArray(question.answer) ? question.answer.includes(key) : key === question.answer;

                    if (isCorrectAnswer) {
                        className += ' correct-answer';
                    } else if (key === answer.userAnswer && !answer.isCorrect) {
                        className += ' incorrect-answer';
                    }
                    resultsHTML += `<li class="${className}">${key}. ${question.options[key]}</li>`;
                }
                resultsHTML += `
                        </ul>
                        <div class="result-explanation">
                            <p><strong>Explanation:</strong> ${question.explanation.correct}</p>
                        </div>
                    </div>
                `;
            });

            resultsHTML += `</div></div>`;
            quizContainerEl.innerHTML = resultsHTML;
        }
        
        showSetupScreen();
    </script>
</body>
</html>

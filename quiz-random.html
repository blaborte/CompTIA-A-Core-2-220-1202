            {"id": "B51", "question": "An executive has a laptop which runs very slowly after login. The executive has many applications configured to start automatically, and the memory utilization is very close to 100%. Which of the following would provide a short-term fix for this issue?", "options": {"A": "Disable startup items", "B": "Update to the latest OS patches", "C": "Defragment the hard drive", "D": "Reboot the computer"}, "answer": "A", "explanation": {"correct": "A. Disable startup items", "A": "Correct. High memory utilization caused by too many auto-starting applications is a common cause of slow performance after login. Using the Startup tab in Task Manager to disable unnecessary applications is a quick and effective way to free up memory and improve performance.", "B": "Incorrect. OS patches are important but won't fix high memory usage from applications.", "C": "Incorrect. Defragmentation helps with disk performance, not memory utilization.", "D": "Incorrect. A reboot will temporarily clear the memory, but the problem will return on the next startup if the startup items are not disabled."}},
            {"id": "B52", "question": "A help desk technician needs to view and control the desktop of a Windows computer at a remote location. Which of the following would be the best choice for this task?", "options": {"A": "VPN", "B": "VNC", "C": "SSH", "D": "RDP"}, "answer": "D", "explanation": {"correct": "D. RDP", "A": "Incorrect. A VPN provides a secure network connection but does not include remote control functionality by itself.", "B": "Incorrect. VNC is a cross-platform remote control protocol, but RDP is the native and generally better-performing option for Windows-to-Windows connections.", "C": "Incorrect. SSH provides secure command-line access, not a graphical desktop.", "D": "Correct. RDP (Remote Desktop Protocol) is Microsoft's proprietary protocol designed specifically to provide a user with a graphical interface to connect to and control another Windows computer over a network."}},
            {"id": "B53", "question": "A technician would like to modify a configuration in a user's UEFI BIOS, but the system will not provide a BIOS configuration hotkey during startup. The computer is running Windows 11. Which of the following would be the best way to address this issue?", "options": {"A": "Change the File Explorer Options", "B": "Modify the Indexing Options", "C": "Turn off Fast Startup", "D": "Start the computer in Safe Mode"}, "answer": "C", "explanation": {"correct": "C. Turn off Fast Startup", "A": "Incorrect. File Explorer options are unrelated to the boot process.", "B": "Incorrect. Indexing options are for the search feature.", "C": "Correct. The Windows Fast Startup feature uses a form of hibernation to speed up the boot process. This often causes the system to bypass the brief window where you can press a key (like Del or F2) to enter the UEFI/BIOS setup. Disabling Fast Startup in the Power Options will force a full shutdown, making it possible to access the BIOS on the next boot.", "D": "Incorrect. Safe Mode is an OS-level diagnostic tool; you cannot access the BIOS from it."}},
            {"id": "B54", "question": "A user has noticed their mouse arrow has been moving around the screen when they are not touching the mouse. The user has also reported that files have been moved to different folders without their intervention. Which of the following would be the best way for an administrator to resolve this issue?", "options": {"A": "Turn the firewall off and back on again", "B": "Run an anti-virus scan", "C": "Remove all recently installed applications", "D": "Upgrade to the latest OS patches"}, "answer": "B", "explanation": {"correct": "B. Run an anti-virus scan", "A": "Incorrect. Restarting the firewall will not remove malware.", "B": "Correct. Unexplained mouse movement and file manipulation are tell-tale signs that a computer has been compromised with a Remote Access Trojan (RAT). This type of malware allows an attacker to take full control of the victim's computer remotely. An immediate anti-virus and anti-malware scan is required to detect and remove the threat.", "C": "Incorrect. While a recent application could be the source, a scan is needed to confirm and remove the active threat.", "D": "Incorrect. Patching is preventative, not a fix for an active infection."}},
            {"id": "B55", "question": "A server administrator has been planning an operating system upgrade for a server in the data center. The upgrade was planned for Saturday, but the risk analysis wasn't completed until Friday afternoon. Which of the following is preventing the upgrade from occurring?", "options": {"A": "Upgrade file availability", "B": "Change board approval", "C": "Not enough time to complete the upgrade", "D": "Need more people for the upgrade process"}, "answer": "B", "explanation": {"correct": "B. Change board approval", "A": "Incorrect. The availability of the files is not mentioned as an issue.", "B": "Correct. In a corporate environment with a formal change management process, all significant changes (like an OS upgrade) must be submitted to and approved by a Change Advisory Board (CAB). Since the risk analysis was just completed, there would not have been time to get the required approval from the board before the planned change window.", "C": "Incorrect. The time to complete the upgrade is part of the plan, not the reason for the delay.", "D": "Incorrect. Staffing is not mentioned as the issue."}},
            {"id": "B56", "question": "A user receives a browser security alert on his laptop when visiting any website which uses HTTPS. If he uses his smartphone on the same network, he does not receive any error messages. Which of the following would best describe this situation?", "options": {"A": "The date and time on the laptop is incorrect", "B": "The smartphone is not updated with the latest OS version", "C": "The laptop has an incorrect subnet mask", "D": "The laptop does not have the latest anti-virus signatures"}, "answer": "A", "explanation": {"correct": "A. The date and time on the laptop is incorrect", "A": "Correct. SSL/TLS certificates, which secure HTTPS websites, are valid only for a specific date range. If a client computer's clock is set to a date and time that is outside of this valid range, the browser will consider the certificate invalid and display a security alert. Since the phone on the same network works, this points to a client-side configuration issue, and an incorrect clock is the most common cause.", "B": "Incorrect. The problem is on the laptop, not the smartphone.", "C": "Incorrect. An incorrect subnet mask would likely cause a total loss of connectivity.", "D": "Incorrect. Anti-virus signatures are unrelated to certificate validation."}},
            {"id": "B57", "question": "A user on the sales team has opened a help desk ticket because of short battery times on a new company-provided tablet. The user keeps the screen at maximum brightness and has many apps running in the background. Which of the following would be the best choices for improving the battery life? (Select TWO)", "options": {"A": "Install the latest operating system patches", "B": "Increase the brightness levels", "C": "Disable Bluetooth and cellular connections", "D": "Close apps which work in the background"}, "answer": ["C", "D"], "explanation": {"correct": "C & D. ", "A": "Incorrect. Patches can sometimes improve efficiency, but it's not a direct solution.", "B": "Incorrect. Increasing brightness would decrease battery life even further.", "C": "Correct. Wireless radios (Wi-Fi, Bluetooth, Cellular) consume significant power. Disabling any that are not actively in use is an effective way to conserve battery.", "D": "Correct. Applications running in the background continue to consume CPU cycles and memory, which drains the battery. Closing unnecessary background apps can significantly improve battery life."}},
            {"id": "B58", "question": "A system administrator would like to create a Windows distribution which can automatically configure itself to connect to the corporate domain and install a standard set of applications with no manual intervention. Which of the following would be the best choice for this requirement?", "options": {"A": "Zero-touch deployment", "B": "Recovery partition installation", "C": "Image deployment", "D": "In-place upgrade"}, "answer": "A", "explanation": {"correct": "A. Zero-touch deployment", "A": "Correct. Zero-touch deployment (or Zero Touch Installation) is a method of deploying an operating system that is fully automated and requires no interaction from a technician. It uses management tools like Microsoft Endpoint Configuration Manager to handle the OS installation, driver injection, application installation, and domain join process.", "B": "Incorrect. A recovery partition restores the factory state.", "C": "Incorrect. Image deployment is part of the process, but zero-touch describes the full automation.", "D": "Incorrect. An in-place upgrade modifies an existing OS."}},
            {"id": "B59", "question": "A user in the accounting department has installed a new application for the upcoming tax year. When compared to the previous version, the newer application runs significantly slower. Which of the following should be the first troubleshooting step?", "options": {"A": "Roll back to the previous application", "B": "Run a repair installation", "C": "Verify the requirements for the new application", "D": "Perform a system file check"}, "answer": "C", "explanation": {"correct": "C. Verify the requirements...", "A": "Incorrect. This may be the eventual solution, but it's not the first troubleshooting step.", "B": "Incorrect. There's no indication the installation is corrupt.", "C": "Correct. The first logical step when a new application performs poorly is to check the manufacturer's documentation to verify that the computer meets the minimum hardware and software requirements (CPU, RAM, disk space, OS version) for the new version.", "D": "Incorrect. A system file check is unlikely to resolve a performance issue with a single application."}},
            {"id": "B60", "question": "A macOS user needs to protect all of the data on their laptop if the laptop is stolen or lost. Which of the following would be the best choice for this requirement?", "options": {"A": "Spaces", "B": "Mission Control", "C": "FileVault", "D": "Keychain"}, "answer": "C", "explanation": {"correct": "C. FileVault", "A": "Incorrect. Spaces is the virtual desktop feature.", "B": "Incorrect. Mission Control is for managing open windows.", "C": "Correct. FileVault is the native full-disk encryption feature in macOS. It encrypts the entire startup volume, ensuring that all data at rest is unreadable without the user's password, providing the best protection if the device is lost or stolen.", "D": "Incorrect. Keychain securely stores passwords and credentials, but it does not encrypt the entire disk."}},
            {"id": "B61", "question": "A data center manager is installing a new access door which will require multi-factor authentication. Which of the following should be used to meet this requirement? (Select TWO)", "options": {"A": "Cabinet locks", "B": "Key fobs", "C": "Privacy filter", "D": "Palmprint scanner"}, "answer": ["B", "D"], "explanation": {"correct": "B & D.", "A": "Incorrect. Cabinet locks are a single-factor physical control.", "B": "Correct. A key fob is 'something you have,' which serves as one factor of authentication.", "C": "Incorrect. A privacy filter is for screens and does not relate to door access.", "D": "Correct. A palmprint scanner is a biometric reader, which is 'something you are.' Combining this with a key fob ('something you have') would constitute multi-factor authentication."}},
            {"id": "B62", "question": "A company is deploying a new set of laptops for field service technicians. They would like to enable two-factor authentication for all logins. The IT department has been asked to create a secure authentication factor for a minimal cost. Which of the following would be the best choice?", "options": {"A": "Retina scanner", "B": "TOTP app", "C": "Keyfob", "D": "Magnetometer"}, "answer": "B", "explanation": {"correct": "B. TOTP app", "A": "Incorrect. Retina scanners are specialized, expensive hardware.", "B": "Correct. A TOTP (Time-based One-Time Password) application, like Google Authenticator or Microsoft Authenticator, can be installed for free on an employee's existing smartphone. This provides a secure second factor of authentication with virtually no additional hardware cost.", "C": "Incorrect. Hardware keyfobs must be purchased and distributed to every user, which involves cost.", "D": "Incorrect. A magnetometer is a sensor and not an authentication factor."}},
            {"id": "B63", "question": "An administrator has identified and removed malware on a corporate desktop computer. Which of the following malware removal steps should be performed next?", "options": {"A": "Disconnect the computer from the corporate network", "B": "Educate the end-user", "C": "Schedule periodic anti-virus scans", "D": "Disable System Restore"}, "answer": "C", "explanation": {"correct": "C. Schedule periodic anti-virus scans", "A": "Incorrect. Disconnecting the computer is one of the first steps (quarantine).", "B": "Incorrect. User education is the last step.", "C": "Correct. In the CompTIA 7-step malware removal process, after you remediate the infected systems (remove the malware), the next step is to schedule scans and run updates to help prevent the infection from returning.", "D": "Incorrect. Disabling System Restore is done before remediation."}},
            {"id": "B64", "question": "The clock on an executive's Windows laptop has consistently been losing time. Manual adjustments are only temporary. Which of these would be the best way to address this issue?", "options": {"A": "Create a login script to update the date and time", "B": "Configure an NTP server", "C": "Set the clock for a different time zone", "D": "Replace the laptop batteries"}, "answer": "B", "explanation": {"correct": "B. Configure an NTP server", "A": "Incorrect. This is an overly complicated and inefficient solution.", "B": "Correct. Windows can be configured to automatically synchronize its clock with a Network Time Protocol (NTP) server over the internet. This ensures the time is always accurate and corrects any drift. This is the standard and best way to manage system time.", "C": "Incorrect. An incorrect time zone would set the clock to the wrong hour, but it wouldn't cause it to consistently lose time.", "D": "Incorrect. The main laptop battery is unrelated to the system clock. A failing CMOS battery could cause this, but configuring NTP is a more robust software solution."}},
            {"id": "B65", "question": "A network administrator is installing a set of upgraded Internet routers in the data center. Which of the following would be the best choices to secure the access to the internal data center door? (Select TWO)", "options": {"A": "Biometric lock", "B": "ACL", "C": "Access control vestibule", "D": "Additional lighting"}, "answer": ["A", "C"], "explanation": {"correct": "A & C.", "A": "Correct. A biometric lock (e.g., fingerprint or retina scanner) provides a strong, unique authentication factor ('something you are') for accessing a secure area.", "B": "Incorrect. An ACL (Access Control List) is a logical control used on firewalls and routers, not for physical doors.", "C": "Correct. An access control vestibule, or mantrap, is a physical security control with two doors where only one can be open at a time. This prevents tailgating, where an unauthorized person follows an authorized person through the door.", "D": "Incorrect. While good lighting is important for security, it is not an access control mechanism."}},
            {"id": "B66", "question": "An administrator is troubleshooting an error message which appears each time an application is started. The administrator needs more information on the cause of the error. Which of the following would be the best next troubleshooting step?", "options": {"A": "Use Performance Monitor to view operational data", "B": "Check the Event Viewer logs", "C": "View the hardware settings in Device Manager", "D": "Disable unneeded background processes in Services"}, "answer": "B", "explanation": {"correct": "B. Check the Event Viewer logs", "A": "Incorrect. Performance Monitor is for tracking resource usage, not for diagnosing application errors.", "B": "Correct. The Windows Event Viewer is the primary tool for investigating application crashes and errors. The Application log will almost always contain one or more events corresponding to the error, often including an error code and detailed description that can be used to diagnose the problem.", "C": "Incorrect. Device Manager is for hardware issues.", "D": "Incorrect. Disabling services is unlikely to provide information about the error."}},
            {"id": "B67", "question": "Four users in the accounting department have received similar emails asking for payment of an outstanding invoice from a major supplier. The email contains a link to a fraudulent payment website. Which of the following would best describe this attack type?", "options": {"A": "Spear phishing", "B": "Denial of service", "C": "Shoulder surfing", "D": "Evil twin"}, "answer": "A", "explanation": {"correct": "A. Spear phishing", "A": "Correct. A generic phishing attack is sent to a broad audience. This attack is specifically targeted at the accounting department and uses a plausible pretext (an invoice from a major supplier). This type of targeted, well-researched phishing attack is known as spear phishing.", "B": "Incorrect. This is not a denial of service attack.", "C": "Incorrect. Shoulder surfing is a physical observation attack.", "D": "Incorrect. An evil twin is a rogue wireless access point."}},
            {"id": "B68", "question": "A user has dropped off their laptop at the repair desk. A message taped to the laptop states: 'Doesn't work.' Which of the following would be the best next step?", "options": {"A": "Start the laptop and look for any issues", "B": "Call the customer and ask for more information", "C": "Replace the power adapter and try booting the laptop", "D": "Use a diagnostics boot CD to run hardware tests"}, "answer": "B", "explanation": {"correct": "B. Call the customer...", "A": "Incorrect. This is 'troubleshooting by guesswork' and is inefficient.", "B": "Correct. The problem description is too vague to begin effective troubleshooting. The first step in the CompTIA troubleshooting methodology is to identify the problem by gathering information. The best way to do this is to contact the customer and ask open-ended questions to get a more specific description of the symptoms.", "C": "Incorrect. This is making an assumption without evidence.", "D": "Incorrect. Hardware tests may be necessary later, but first you need to understand the problem."}},
            {"id": "B69", "question": "Which of these describes a free, open-source operating system?", "options": {"A": "macOS", "B": "Linux", "C": "Windows", "D": "iOS"}, "answer": "B", "explanation": {"correct": "B. Linux", "A": "Incorrect. macOS is a proprietary operating system developed by Apple.", "B": "Correct. Linux is the most prominent example of a free and open-source operating system. Its source code is freely available for anyone to view, modify, and distribute.", "C": "Incorrect. Windows is a proprietary operating system developed by Microsoft.", "D": "Incorrect. iOS is a proprietary mobile operating system developed by Apple."}},
            {"id": "B70", "question": "An IT manager would like to provide users with the option to recover daily versions of documents and spreadsheets. The backups must allow for the recovery of a single file. Which of the following would be the best way to implement this feature?", "options": {"A": "Create a file-level backup each day", "B": "Maintain a monthly image level backup", "C": "Store full backup tapes at an off-site facility", "D": "Assign each user a USB flash drive"}, "answer": "A", "explanation": {"correct": "A. Create a file-level backup each day", "A": "Correct. A file-level backup specifically copies individual files and folders. Running this type of backup daily would meet the requirement of providing daily versions of documents and allows for the easy recovery of a single file without needing to restore an entire system.", "B": "Incorrect. An image-level backup creates a copy of the entire disk volume and is inefficient for restoring single files.", "C": "Incorrect. Off-site storage is a best practice, but this doesn't specify the backup type.", "D": "Incorrect. This relies on users to perform manual backups and is not a reliable solution."}},
            {"id": "B71", "question": "A network administrator has a report showing a single user with numerous visits to a website known to contain copyrighted materials. This is a violation of the company's acceptable use policy. Which of the following should the administrator do next?", "options": {"A": "Create a firewall filter to block the website", "B": "Scan all computers with the latest anti-malware signatures", "C": "Contact the company’s security officer", "D": "Change the user’s password"}, "answer": "C", "explanation": {"correct": "C. Contact the company’s security officer", "A": "Incorrect. The administrator should not take unilateral action without direction.", "B": "Incorrect. This is not a malware issue, but a policy violation.", "C": "Correct. The network administrator's job is to identify and report the issue. The enforcement of company policy and any subsequent investigation or disciplinary action should be handled by the proper authorities, such as the company's security officer and/or Human Resources department.", "D": "Incorrect. Changing the user's password is not relevant to the policy violation."}},
            {"id": "B72", "question": "Which of the following script extensions would commonly be used inside of a Microsoft Office application?", "options": {"A": ".vbs", "B": ".py", "C": ".bat", "D": ".js"}, "answer": "A", "explanation": {"correct": "A. .vbs", "A": "Correct. Microsoft Office applications use Visual Basic for Applications (VBA) for creating macros and automating tasks. VBScript (.vbs) is a closely related scripting language that uses similar syntax and is also integrated into the Windows environment.", "B": "Incorrect. .py is the extension for Python scripts.", "C": "Incorrect. .bat is the extension for Windows batch files.", "D": "Incorrect. .js is the extension for JavaScript files."}},
            {"id": "B73", "question": "A system administrator is installing a SOHO network of five Windows computers. The computers need to share files and printers without a centralized server. Which of the following would be the best way to provide this functionality?", "options": {"A": "Domain", "B": "Proxy server", "C": "Workgroup", "D": "Remote Desktop"}, "answer": "C", "explanation": {"correct": "C. Workgroup", "A": "Incorrect. A domain requires a central server (a domain controller) for authentication.", "B": "Incorrect. A proxy server is an intermediary for web traffic.", "C": "Correct. A Workgroup is the peer-to-peer networking model used in Windows for small networks without a central server. Each computer maintains its own local user accounts, but they can share files and printers with each other across the network.", "D": "Incorrect. Remote Desktop is for remote control, not file sharing."}},
            {"id": "B74", "question": "An employee used their tablet to take pictures of the company's newest product. Those pictures were posted on an industry rumor website, even though the employee states they never shared them. Which of the following should be evaluated as the MOST likely security concern?", "options": {"A": "Cloud storage", "B": "USB flash drive use", "C": "Application updates", "D": "Deleted email messages"}, "answer": "A", "explanation": {"correct": "A. Cloud storage", "A": "Correct. Most modern mobile devices are configured by default to automatically sync photos and videos to a personal cloud storage account (like iCloud Photos or Google Photos). It is very likely the employee's tablet automatically uploaded the sensitive product photos to their personal cloud account, which may have been compromised or inadvertently shared.", "B": "Incorrect. This would require a manual action to transfer the photos.", "C": "Incorrect. App updates are not related to photo sharing.", "D": "Incorrect. This is not related to photos taken on a tablet."}},
            {"id": "B75", "question": "A manufacturing company in the United States sells monthly subscriptions from their website. Which of the following regulated data types would be the MOST important to manage?", "options": {"A": "Personal government-issued information", "B": "Credit card transactions", "C": "Healthcare data", "D": "Software license terms"}, "answer": "B", "explanation": {"correct": "B. Credit card transactions", "A": "Incorrect. The company is not likely collecting government ID info like social security numbers.", "B": "Correct. Any organization that accepts, processes, stores, or transmits credit card information must comply with the Payment Card Industry Data Security Standard (PCI DSS). This is a strict set of security standards for handling this type of regulated data.", "C": "Incorrect. This is not a healthcare company, so HIPAA regulations for PHI do not apply.", "D": "Incorrect. License terms are a legal matter, but not a regulated data type."}},
            {"id": "B76", "question": "A user is traveling to a conference, and they would like to be sure any messages sent from their phone during the event remain private. The conference provides an open, public Wi-Fi network. Which of the following should be configured on this user’s phone?", "options": {"A": "VPN", "B": "Strong password", "C": "Network-based firewall", "D": "Multi-factor authentication"}, "answer": "A", "explanation": {"correct": "A. VPN", "A": "Correct. An open, public Wi-Fi network is inherently insecure and subject to eavesdropping. A VPN (Virtual Private Network) creates a secure, encrypted tunnel between the user's phone and a trusted VPN server. All internet traffic is routed through this tunnel, protecting it from being intercepted on the local public network.", "B": "Incorrect. A strong password protects the device itself, not the data in transit.", "C": "Incorrect. A network-based firewall is part of the network infrastructure, not something the user configes on their phone.", "D": "Incorrect. MFA protects logins, not network traffic."}},
            {"id": "B77", "question": "Last week, a computer on the manufacturing floor was upgraded from 8 GB of RAM to 16 GB. Since the upgrade, the system has rebooted itself randomly. Which of the following would be the best next troubleshooting step?", "options": {"A": "Run Windows Update", "B": "Perform a hardware diagnostic", "C": "Upgrade the BIOS to the latest version", "D": "Replace the storage drive"}, "answer": "B", "explanation": {"correct": "B. Perform a hardware diagnostic", "A": "Incorrect. This is a software solution for a problem that is very likely hardware-related.", "B": "Correct. When system instability (like random reboots) begins immediately after a hardware change, the new hardware is the most likely culprit. A hardware diagnostic, specifically a memory test (like Windows Memory Diagnostic), should be run to check if the new RAM modules are faulty or incompatible.", "C": "Incorrect. A BIOS update is a possible fix but testing the hardware itself should come first.", "D": "Incorrect. The storage drive is not related to the recent RAM upgrade."}},
            {"id": "B78", "question": "A server administrator has configured an automated process to backup VM snapshots each evening to a tape library. How can the administrator confirm these backups will be useful when a server recovery is needed?", "options": {"A": "Send the backups to an off-site facility", "B": "Connect the tape drives to a battery backup", "C": "Create separate file-level backups", "D": "Perform occasional recovery tests"}, "answer": "D", "explanation": {"correct": "D. Perform occasional recovery tests", "A": "Incorrect. Off-site storage is a best practice for disaster recovery, but it doesn't validate the data's integrity.", "B": "Incorrect. A UPS is important for power continuity but doesn't test the backups.", "C": "Incorrect. This creates a different type of backup but doesn't validate the primary one.", "D": "Correct. A backup process is not complete until the restore process has been validated. The only way to be certain that a backup is viable and can be successfully restored is to periodically perform test restores in a non-production environment."}},
            {"id": "B79", "question": "A system administrator needs to configure a laptop to support inbound Remote Desktop services. The administrator needs to enable the service and configure the firewall. Which of these Control Panel features provides access to these settings?", "options": {"A": "Internet Options", "B": "Devices and Printers", "C": "Network and Sharing Center", "D": "System"}, "answer": "D", "explanation": {"correct": "D. System", "A": "Incorrect. Internet Options is for configuring browser settings.", "B": "Incorrect. Devices and Printers is for managing peripherals.", "C": "Incorrect. Network and Sharing Center is for configuring network adapters and connection settings.", "D": "Correct. The settings to enable or disable Remote Desktop are found within the System Properties window, which can be accessed through the System applet in the Control Panel. Enabling the feature also automatically configes the necessary Windows Firewall exceptions."}},
            {"id": "B80", "question": "An Android phone user is traveling internationally and would like to avoid overage charges from their cellular provider. Which of the following would be the best way to control data access?", "options": {"A": "Install a VPN client", "B": "Remove all apps with high data requirements", "C": "Enable data usage notifications", "D": "Connect exclusively through a cellular hotspot"}, "answer": "C", "explanation": {"correct": "C. Enable data usage notifications", "A": "Incorrect. A VPN encrypts data but does not reduce the amount of data used.", "B": "Incorrect. This is impractical and doesn't provide fine-grained control.", "C": "Correct. Android has built-in data usage controls that allow a user to monitor their consumption, set a warning threshold, and even set a hard limit that will automatically disable cellular data when reached. This is the most effective way to actively manage data use and prevent overage charges.", "D": "Incorrect. A cellular hotspot uses the same cellular data and would not prevent overages."}},
            {"id": "B81", "question": "A technician is upgrading the motherboard in a server. Which of the following should be the first task when beginning this upgrade?", "options": {"A": "Wear safety goggles", "B": "Connect an ESD strap", "C": "Remove any motherboard batteries", "D": "Disconnect from all power sources"}, "answer": "D", "explanation": {"correct": "D. Disconnect from all power sources", "A": "Incorrect. Safety goggles are generally not required for this task.", "B": "Incorrect. Connecting an ESD strap is a critical step, but it must be done after the power is off.", "C": "Incorrect. The CMOS battery should be removed after the motherboard is out, if needed.", "D": "Correct. The absolute first step before working inside any computer or server is to ensure personal safety and protect the components by completely powering down the device and unplugging all power cables from the power supplies."}},
            {"id": "B82", "question": "A system administrator is installing a new video editing application on a user’s workstation from a USB flash drive. During the installation, the installation process fails due to lack of available drive space. Which of the following would be the best way to complete the installation process?", "options": {"A": "Use a share drive for the installation source", "B": "Compress the installation files", "C": "Install the application to a network share", "D": "Manually copy the installation files to the application directory"}, "answer": "C", "explanation": {"correct": "C. Install the application to a network share", "A": "Incorrect. The source of the files doesn't change the lack of space on the destination drive.", "B": "Incorrect. Installation files are already compressed; this wouldn't help.", "C": "Correct. If the local drive is full, many application installers provide a 'Custom' installation option that allows the user to change the installation path. For large applications, installing them to a secondary local drive or a fast network share can be a valid solution.", "D": "Incorrect. Manually copying files will not properly install the application, which needs to create registry entries and other system modifications."}},
            {"id": "B83", "question": "A user would like to install an image and photo editing program on their home computer, but they would prefer an application without a monthly subscription. Which of the following would be the best licensing option for this requirement?", "options": {"A": "Open-source", "B": "Corporate", "C": "Personal", "D": "DRM"}, "answer": "A", "explanation": {"correct": "A. Open-source", "A": "Correct. Open-source software is typically free of charge and does not use a subscription model. Many powerful image editing programs (like GIMP or Krita) are open-source, making this the ideal choice for a user who wants a powerful application without ongoing costs.", "B": "Incorrect. A corporate license is for business use.", "C": "Incorrect. A personal license can still be a subscription model.", "D": "Incorrect. DRM (Digital Rights Management) is a technology used to control access to software, not a license type itself."}},
            {"id": "B84", "question": "A system administrator is troubleshooting an application issue. The application will work normally, but then consume all available memory, requiring the computer to be rebooted every few days. Which of the following utilities would show how much RAM is used by this application?", "options": {"A": "Event Viewer", "B": "Device Manager", "C": "Task Manager", "D": "Programs and Features"}, "answer": "C", "explanation": {"correct": "C. Task Manager", "A": "Incorrect. Event Viewer shows error logs, not real-time resource usage.", "B": "Incorrect. Device Manager is for hardware.", "C": "Correct. This scenario describes a 'memory leak.' The Task Manager's 'Processes' or 'Details' tab provides a real-time view of all running processes and allows the administrator to sort by memory usage, easily identifying which application is consuming all of the available RAM.", "D": "Incorrect. Programs and Features is for uninstalling applications."}},
            {"id": "B85", "question": "An administrator is troubleshooting a desktop computer experiencing a reboot issue. After the initial POST, the Windows startup screen appears, but then the system reboots in a continuous loop. Which of the following would be the best way to address this issue?", "options": {"A": "Start Safe Mode and perform a defragmentation", "B": "Reinstall the operating system from the original media", "C": "Update the boot order from the system BIOS", "D": "Run Startup Repair from the Advanced Boot Options"}, "answer": "D", "explanation": {"correct": "D. Run Startup Repair...", "A": "Incorrect. Defragmentation is unrelated to boot issues.", "B": "Incorrect. Reinstalling the OS is a last resort.", "C": "Incorrect. The system is beginning to load Windows, so the boot order is correct.", "D": "Correct. A continuous reboot loop after the POST but during the Windows loading screen often indicates corrupted system files or a bad driver. The Startup Repair utility, found in the Windows Recovery Environment (accessed via Advanced Boot Options), is specifically designed to automatically diagnose and fix these types of problems."}},
            {"id": "B86", "question": "A user has downloaded a browser add-on from an untrusted website. When the user tries to install the add-on, the Windows UAC is requesting permissions to continue with the install. Which of these is most likely?", "options": {"A": "The operating system requires an update", "B": "The software is a Trojan horse", "C": "The workstation is already part of a botnet", "D": "A worm will be downloaded and installed"}, "answer": "B", "explanation": {"correct": "B. The software is a Trojan horse", "A": "Incorrect. An OS update would present a different message.", "B": "Correct. A legitimate browser add-on should not require administrator-level permissions from the User Account Control (UAC). A UAC prompt indicates the program is attempting to make system-level changes. This is a huge red flag that the software is a Trojan horse, disguising itself as a simple add-on while trying to install malicious code.", "C": "Incorrect. This action is what could lead to becoming part of a botnet.", "D": "Incorrect. This describes a possible outcome, but the software type is a Trojan."}},
            {"id": "B87", "question": "A technician is working on many different terminal sessions on their screen. The technician would like a command that can confirm the user account associated with each session. Which of the following would be the best way to display the login name associated with each terminal session?", "options": {"A": "winver", "B": "nslookup", "C": "whoami", "D": "net use"}, "answer": "C", "explanation": {"correct": "C. whoami", "A": "Incorrect. 'winver' displays the Windows version.", "B": "Incorrect. 'nslookup' is for DNS queries.", "C": "Correct. The 'whoami' command is available in both Windows and Linux and its sole function is to display the username of the current user, making it perfect for identifying the account context of a terminal session.", "D": "Incorrect. 'net use' manages network drive mappings."}},
            {"id": "B88", "question": "A system administrator needs a way to deploy new smartphone configurations across four different user groups. The smartphones are all owned by the company. Which of the following would be the best way to setup these smartphones?", "options": {"A": "Assign configuration profiles for each group", "B": "Restore all smartphones from cloud backups", "C": "Provide customized instructions for each user", "D": "Assign separate support teams for each group"}, "answer": "A", "explanation": {"correct": "A. Assign configuration profiles...", "A": "Correct. Using a Mobile Device Management (MDM) solution, an administrator can create different configuration profiles for different groups of users (e.g., Sales, Engineering). These profiles can push specific settings like Wi-Fi configurations, email accounts, application whitelists, and security restrictions to the devices in each group, ensuring consistency and proper configuration.", "B": "Incorrect. This would make all phones identical, which is not the requirement.", "C": "Incorrect. This is inefficient and prone to user error.", "D": "Incorrect. This is a personnel solution, not a technical one."}},
            {"id": "B89", "question": "A desktop administrator is troubleshooting an error which randomly causes a workstation to spike to 100% utilization. Which of these utilities would help the administrator track and report on system utilization over a 24-hour period?", "options": {"A": "Performance Monitor", "B": "Device Manager", "C": "Services", "D": "Task Scheduler"}, "answer": "A", "explanation": {"correct": "A. Performance Monitor", "A": "Correct. While Task Manager is good for real-time viewing, Performance Monitor is the Windows tool designed for logging performance data over extended periods. The administrator can configure a Data Collector Set to record CPU utilization (and other metrics) to a log file for 24 hours, then analyze the log to identify what time the spikes occurred.", "B": "Incorrect. Device Manager is for hardware.", "C": "Incorrect. 'Services' is for managing background processes.", "D": "Incorrect. Task Scheduler is for automating tasks."}},
            {"id": "B90", "question": "Which of these would be the best way to prevent an attacker from modifying default routes on a SOHO wireless network?", "options": {"A": "Configure MAC address filtering", "B": "Enable WPS connectivity", "C": "Change the router's default password", "D": "Disable unneeded interfaces"}, "answer": "C", "explanation": {"correct": "C. Change the router's default password", "A": "Incorrect. MAC filtering restricts which devices can connect to the Wi-Fi, but doesn't protect the router's configuration.", "B": "Incorrect. WPS is a known vulnerability and should be disabled.", "C": "Correct. Most SOHO routers ship with a well-known default administrator password (e.g., 'admin', 'password'). An attacker can easily guess this password to gain access to the router's configuration page and make malicious changes. Changing the default administrative password is the single most important step in securing a SOHO router.", "D": "Incorrect. While a good hardening step, it doesn't prevent an attacker from logging in."}}
        ];

    const profMesserC = [
        {"id": "C6", "question": "A technician has been called to resolve an issue with a desktop computer that is sending a large amount of malicious traffic to external websites. Which of the following should be the technician’s FIRST step?", "options": {"A": "View running processes in Task Manager", "B": "Disable System Restore", "C": "Remove the computer from the network", "D": "Educate the end user"}, "answer": "C", "explanation": {"correct": "C. Remove the computer from the network", "A": "Incorrect. Viewing processes is part of remediation, which comes after quarantining the system.", "B": "Incorrect. Disabling System Restore is an important step, but it also comes after the system is quarantined.", "C": "Correct. According to the CompTIA malware removal steps, the first step is to identify and quarantine the infected system. The most effective way to quarantine a machine that is sending malicious network traffic is to physically disconnect it from the network.", "D": "Incorrect. User education is the final step in the malware removal process."}},
            {"id": "C7", "question": "A system administrator would like to remove the TFTP Client in Windows. Which of the following Control Panel utilities would provide this functionality?", "options": {"A": "Programs and Features", "B": "Services", "C": "Network and Sharing Center", "D": "File Explorer options"}, "answer": "A", "explanation": {"correct": "A. Programs and Features", "A": "Correct. Optional Windows components, such as the TFTP Client or Telnet Client, are managed through the 'Turn Windows features on or off' link within the Programs and Features applet.", "B": "Incorrect. The Services utility is used to manage background processes, not to add or remove OS components.", "C": "Incorrect. The Network and Sharing Center is for configuring network adapters and connections.", "D": "Incorrect. File Explorer options are for changing the appearance and behavior of the file manager."}},
            {"id": "C8", "question": "A user has noticed a Bluetooth device currently connected to their tablet that they do not recognize. Which of the following would be the most immediate and effective way to address this security concern?", "options": {"A": "Perform an anti-malware scan", "B": "Research installed apps with an app scanner", "C": "Disable the Wi-Fi network", "D": "Remove the Bluetooth device"}, "answer": "D", "explanation": {"correct": "D. Remove the Bluetooth device", "A": "Incorrect. An anti-malware scan is a good idea, but it is not the most direct way to handle an unauthorized connection.", "B": "Incorrect. This is a good secondary step but not the immediate solution.", "C": "Incorrect. Disabling Wi-Fi is unrelated to a Bluetooth connection.", "D": "Correct. If an unknown or unauthorized device is paired via Bluetooth, the most direct and immediate action is to go into the Bluetooth settings and unpair or remove that specific device to sever the connection."}},
            {"id": "C9", "question": "A user has recently been assigned a new tablet, but each time she tries to read her email the tablet reboots. This issue only occurs with the email application. Which of the following would be the BEST next troubleshooting step?", "options": {"A": "Replace the battery", "B": "Perform a factory reset", "C": "Run a hardware diagnostic", "D": "Disable Wi-Fi"}, "answer": "C", "explanation": {"correct": "C. Run a hardware diagnostic", "A": "Incorrect. A faulty battery would more likely cause a shutdown, not a reboot tied to a specific app.", "B": "Incorrect. A factory reset is a drastic step and should be performed only after other steps fail.", "C": "Correct. While the issue seems software-related because it's tied to one app, random reboots can be a symptom of faulty hardware (like RAM or storage) that is only stressed under specific conditions. Running a hardware diagnostic can quickly rule out a hardware problem before spending time on more complex software troubleshooting.", "D": "Incorrect. Wi-Fi is unrelated to system reboots."}},
            {"id": "C10", "question": "A computer technician has been asked to verify a set of new Active Directory settings on computers at a remote site. Which of the following command-line tools would provide a list of all policies applied to a workstation?", "options": {"A": "net use", "B": "sfc", "C": "gpresult", "D": "netstat"}, "answer": "C", "explanation": {"correct": "C. gpresult", "A": "Incorrect. `net use` is for managing network drive mappings.", "B": "Incorrect. `sfc` is the System File Checker.", "C": "Correct. The `gpresult` (Group Policy Result) command is specifically designed to display the set of Group Policy Objects (GPOs) that have been applied to a specific user and computer, making it the perfect tool for this task.", "D": "Incorrect. `netstat` displays active network connections."}},
            {"id": "C11", "question": "A system administrator needs to modify the Linux group associated with a file. Which of the following commands would provide this functionality?", "options": {"A": "ps", "B": "df", "C": "chown", "D": "grep"}, "answer": "C", "explanation": {"correct": "C. chown", "A": "Incorrect. The `ps` command lists running processes.", "B": "Incorrect. The `df` command shows disk free space.", "C": "Correct. The `chown` (change owner) command is used to change the ownership of files and directories. It can change the user owner, the group owner, or both (e.g., `chown :newgroup filename`).", "D": "Incorrect. The `grep` command is used to search for text within files."}},
            {"id": "C12", "question": "A user has brought their laptop to the help desk because of an issue during startup. The user is leaving for an important business trip tomorrow. Which of the following would be the best option?", "options": {"A": "Provide the user with the option to repair, replace, or rent a new system", "B": "Assign the user to the standard seven-day repair agreement", "C": "Replace the external power cable and close the repair ticket", "D": "Recommend the user cancel their travel plans"}, "answer": "A", "explanation": {"correct": "A. Provide the user with options...", "A": "Correct. Excellent customer service involves understanding the user's constraints (the business trip) and providing them with choices. Offering to attempt a repair, provide a loaner/replacement, or rent a temporary system empowers the user and helps them meet their deadline.", "B": "Incorrect. A standard repair time does not meet the user's urgent need.", "C": "Incorrect. This is guessing at a solution without proper diagnosis.", "D": "Incorrect. This is unhelpful and unprofessional."}},
            {"id": "C13", "question": "A home user provides numerous online presentations during the day, but brief power outages have caused their computer to shut down and lose work. Which of the following would help with this issue?", "options": {"A": "Cloud backups", "B": "External storage device", "C": "Battery backup", "D": "Surge suppressor"}, "answer": "C", "explanation": {"correct": "C. Battery backup", "A": "Incorrect. Cloud backups protect data but do not prevent the computer from shutting down.", "B": "Incorrect. External storage does not provide power.", "C": "Correct. A battery backup, or Uninterruptible Power Supply (UPS), contains a battery that instantly provides power to a computer during an outage. This prevents the system from shutting down, allowing the user to continue working through brief outages.", "D": "Incorrect. A surge suppressor protects from power spikes, but offers no power during an outage."}},
            {"id": "C14", "question": "A system administrator is planning to upgrade two physical servers in the corporate data center to external cloud-based platforms. Which of the following change management documents would provide information on connectivity and the plans for remote site access?", "options": {"A": "Change scope", "B": "End-user acceptance", "C": "Backout plan", "D": "Risk analysis"}, "answer": "A", "explanation": {"correct": "A. Change scope", "A": "Correct. The change scope document defines the boundaries and details of the project. It would outline exactly what is being changed, the impact on users, and technical details such as how remote sites will maintain connectivity to the newly migrated cloud platforms.", "B": "Incorrect. End-user acceptance is the final step after the change is complete.", "C": "Incorrect. A backout plan details how to revert the change if it fails.", "D": "Incorrect. A risk analysis identifies potential problems."}},
            {"id": "C15", "question": "A system administrator is concerned about the security of devices in the field and would like to encrypt all data on company laptops. Which of these Windows features would provide this functionality?", "options": {"A": "EFS", "B": "Domain Services", "C": "WPA3", "D": "BitLocker"}, "answer": "D", "explanation": {"correct": "D. BitLocker", "A": "Incorrect. EFS (Encrypting File System) encrypts individual files and folders, not the entire disk.", "B": "Incorrect. Active Directory Domain Services is for network management.", "C": "Incorrect. WPA3 is a security standard for Wi-Fi networks.", "D": "Correct. BitLocker is the full-volume encryption feature built into Windows that is used to encrypt the entire storage drive, protecting all data at rest."}},
            {"id": "C16", "question": "A user has just installed a driver update from a laptop manufacturer. After restarting, their system shows a Windows Stop Error before the login prompt is displayed. Which of the following should the system administrator follow to best resolve this issue?", "options": {"A": "Modify the BIOS boot order", "B": "Boot to Safe Mode and perform a Windows Reset", "C": "Perform a System Restore", "D": "Reinstall the patch files"}, "answer": "C", "explanation": {"correct": "C. Perform a System Restore", "A": "Incorrect. The boot order is correct if Windows is starting to load.", "B": "Incorrect. A Windows Reset is a drastic step that removes applications.", "C": "Correct. The issue was caused by a recent change (the driver update). System Restore is specifically designed to revert the system's state to a point before the change was made. By restoring to a point created before the driver update, the problematic driver will be removed, allowing the system to boot normally.", "D": "Incorrect. Reinstalling the problematic driver would not fix the issue."}},
            {"id": "C17", "question": "A user in the shipping department is authenticating to a third-party package tracking service. In addition to a username and password, the site sends an email to the user with a six-digit code to complete the login process. Which of the following would best describe this process?", "options": {"A": "SPF", "B": "ACL", "C": "SMS", "D": "OTP"}, "answer": "D", "explanation": {"correct": "D. OTP", "A": "Incorrect. SPF (Sender Policy Framework) is an email authentication method to prevent spam.", "B": "Incorrect. An ACL (Access Control List) is a set of permissions.", "C": "Incorrect. SMS (Short Message Service) is when the code is delivered via text message, not email.", "D": "Correct. The six-digit code is a One-Time Password (OTP) used as a second factor of authentication to verify the user's identity."}},
            {"id": "C18", "question": "A user has opened a help desk ticket with a problem related to email spell checks. When using a web-based email client, the automated checks are no longer working. Which of the following should the technician check first?", "options": {"A": "Proxy settings", "B": "Browser extensions", "C": "Memory utilization", "D": "Web server certificate"}, "answer": "B", "explanation": {"correct": "B. Browser extensions", "A": "Incorrect. Proxy settings affect connectivity, not a specific feature on a webpage.", "B": "Correct. Spell-check functionality in a web application is often provided by the browser or JavaScript running on the page. A poorly coded or conflicting browser extension (add-on) is a very common cause for specific features of a website to fail while the rest of the site works.", "C": "Incorrect. Memory utilization would cause general slowness, not disable a single feature.", "D": "Incorrect. A certificate error would prevent the site from loading securely."}},
            {"id": "C19", "question": "An attacker has gained access to a password hash file. Which of the following will the attacker use to obtain the passwords?", "options": {"A": "DoS", "B": "Decryption", "C": "Brute force", "D": "Phishing"}, "answer": "C", "explanation": {"correct": "C. Brute force", "A": "Incorrect. DoS (Denial of Service) is an availability attack.", "B": "Incorrect. Hashes are created by a one-way cryptographic function; they cannot be 'decrypted'.", "C": "Correct. To crack a hash, an attacker must perform a brute-force or dictionary attack. They guess a password, hash it using the same algorithm, and compare the result to the stolen hash. They repeat this process millions of times until they find a match.", "D": "Incorrect. Phishing is used to trick users into revealing their passwords, not to crack a hash file."}},
            {"id": "C20", "question": "A server administrator needs to create a folder on a Windows server to store weekly status report documents. Which of the following command-line tools would provide this functionality?", "options": {"A": "md", "B": "net use", "C": "cd", "D": "dir"}, "answer": "A", "explanation": {"correct": "A. md", "A": "Correct. The `md` (make directory) command, also known as `mkdir`, is used in the Windows command prompt to create a new directory (folder).", "B": "Incorrect. `net use` is for mapping network drives.", "C": "Incorrect. `cd` is for changing the current directory.", "D": "Incorrect. `dir` is for listing directory contents."}},
            {"id": "C21", "question": "A desktop administrator has received a notification of a deployed RSR update. Which of the following would be most affected by this update?", "options": {"A": "macOS laptops", "B": "Linux database servers", "C": "Android tablets", "D": "Windows desktops"}, "answer": "A", "explanation": {"correct": "A. macOS laptops", "A": "Correct. RSR stands for Rapid Security Response, a feature introduced by Apple to deliver urgent security fixes to its operating systems (iOS, iPadOS, and macOS) without requiring a full OS update.", "B": "Incorrect. RSR is specific to Apple operating systems.", "C": "Incorrect. RSR is specific to Apple operating systems.", "D": "Incorrect. RSR is specific to Apple operating systems."}},
            {"id": "C22", "question": "A desktop administrator is removing a virus from a laptop computer in a shared lab. When the administrator attempts to update to the latest anti-virus signatures, the anti-virus utility disables itself. Which of the following would be the best next step?", "options": {"A": "Boot to Safe Mode and use signatures downloaded from a separate computer", "B": "Roll back to a previous configuration", "C": "Schedule periodic updates and reconnect to the network", "D": "Discuss anti-virus strategies with the end user"}, "answer": "A", "explanation": {"correct": "A. Boot to Safe Mode...", "A": "Correct. Sophisticated malware will actively try to disable security software. Booting into Safe Mode loads a minimal version of Windows, which can prevent the malware from running. From there, the administrator can use a clean computer to download the latest signature files to a USB drive and manually update the anti-virus on the infected machine.", "B": "Incorrect. Rolling back could restore the malware if it infected a restore point.", "C": "Incorrect. Reconnecting to the network is unsafe.", "D": "Incorrect. User education comes after the threat is removed."}},
            {"id": "C23", "question": "A Windows computer has one application which crashes randomly throughout the day. All other applications are working as expected. Which of the following would be the best way to address these application crashes?", "options": {"A": "Perform a full backup", "B": "Reload the Active Directory profile", "C": "Defragment the hard drive", "D": "Uninstall and reinstall the application"}, "answer": "D", "explanation": {"correct": "D. Uninstall and reinstall...", "A": "Incorrect. A backup is a good practice but will not fix the crashing application.", "B": "Incorrect. A profile issue would likely affect more than one application.", "C": "Incorrect. Defragmentation is a performance tune-up, not a fix for application crashes.", "D": "Correct. If a single application is misbehaving, its program files or registry settings may be corrupt. The most direct and common fix is to completely uninstall the application, which removes its files and settings, and then perform a fresh reinstallation."}},
            {"id": "C24", "question": "An app on a user’s corporate smartphone has stopped updating. Which of the following would be the best way to resolve this issue?", "options": {"A": "Connect the smartphone to a power source", "B": "Restart the smartphone", "C": "Disable rotation lock", "D": "Disable Bluetooth"}, "answer": "B", "explanation": {"correct": "B. Restart the smartphone", "A": "Incorrect. While some OS updates require a power source, individual app updates generally do not.", "B": "Correct. A common first step for many mobile device issues is a simple restart (reboot). This can clear temporary glitches in the operating system or the app store's services that may be preventing an update from processing correctly.", "C": "Incorrect. Rotation lock is a display setting and is unrelated.", "D": "Incorrect. Bluetooth is unrelated to app updates."}},
            {"id": "C25", "question": "A technician has been asked to replace a faulty adapter card in a server. The technician does not have an anti-static strap available. Which of the following would be the best way to safely complete this repair?", "options": {"A": "Store the faulty card in an anti-static bag", "B": "Periodically touch the server's metal chassis", "C": "Wear safety goggles", "D": "Have a carbon dioxide extinguisher nearby"}, "answer": "B", "explanation": {"correct": "B. Periodically touch...", "A": "Incorrect. This is for storing the card, not for protecting the server during the repair.", "B": "Correct. If a proper ESD strap is not available, the next best practice is self-grounding. By periodically touching an unpainted metal part of the server's chassis, the technician can equalize their electrostatic potential with the server, reducing the risk of a damaging static discharge.", "C": "Incorrect. Goggles are not required for this task.", "D": "Incorrect. An extinguisher is for fire safety, not ESD protection."}},
            {"id": "C26", "question": "Which of the following would be the best choice for a system administrator to manage an Active Directory database?", "options": {"A": "Batch file", "B": "PowerShell", "C": "JavaScript", "D": "Visual Basic Scripting"}, "answer": "B", "explanation": {"correct": "B. PowerShell", "A": "Incorrect. Batch files are a legacy scripting technology with limited capabilities.", "B": "Correct. PowerShell is Microsoft's modern, object-oriented command-line shell and scripting language. It includes extensive modules specifically for managing every aspect of Active Directory, making it the most powerful and appropriate tool for the job.", "C": "Incorrect. JavaScript is primarily used for web development.", "D": "Incorrect. VBScript is a legacy scripting language that has been largely superseded by PowerShell."}},
            {"id": "C27", "question": "A user has started their computer and received this message on the screen: “Your important files are encrypted. To decrypt your files, you must pay 1 Bitcoin to the following address…” Which of the following would best describe this scenario?", "options": {"A": "Spyware", "B": "Boot sector virus", "C": "Rootkit", "D": "Ransomware"}, "answer": "D", "explanation": {"correct": "D. Ransomware", "A": "Incorrect. Spyware secretly gathers information.", "B": "Incorrect. A boot sector virus infects the master boot record.", "C": "Incorrect. A rootkit hides its presence while gaining privileged access.", "D": "Correct. This is the classic behavior of ransomware. It encrypts the victim's data, making it inaccessible, and then demands a ransom payment in exchange for the decryption key."}},
            {"id": "C28", "question": "A desktop technician has received a complaint that a remotely-hosted application has stopped working. The technician can ping the application server's IP address successfully. Which of the following tools would be the best way to confirm the location of the outage?", "options": {"A": "ping", "B": "nslookup", "C": "netstat", "D": "tracert"}, "answer": "D", "explanation": {"correct": "D. tracert", "A": "Incorrect. `ping` only confirms end-to-end connectivity; it does not show the path.", "B": "Incorrect. `nslookup` is for DNS queries.", "C": "Incorrect. `netstat` shows local network connections.", "D": "Correct. The `tracert` (Trace Route) command shows the step-by-step path that network traffic takes from the source to the destination. If there is a problem at an intermediate router along the path, `tracert` will show exactly where the connection is failing."}},
            {"id": "C29", "question": "Users on the corporate network authenticate once at the beginning of the day, and are not prompted again for authentication until the following day. Which of the following would BEST describe this functionality?", "options": {"A": "NTFS", "B": "SSO", "C": "Inherited permissions", "D": "EFS"}, "answer": "B", "explanation": {"correct": "B. SSO", "A": "Incorrect. NTFS is a file system.", "B": "Correct. SSO (Single Sign-On) is an authentication scheme that allows a user to log in with a single set of credentials to gain access to multiple applications and resources without being prompted to log in again.", "C": "Incorrect. Inherited permissions relate to file and folder access control.", "D": "Incorrect. EFS is used for file encryption."}},
            {"id": "C30", "question": "A server technician is removing the memory from a web server and adding new memory modules. Which of the following would be the best way to protect the old memory modules?", "options": {"A": "Padded envelope", "B": "Cotton fabric", "C": "Molded foam packing material", "D": "Anti-static bag"}, "answer": "D", "explanation": {"correct": "D. Anti-static bag", "A": "Incorrect. A padded envelope protects from physical shock but not ESD.", "B": "Incorrect. Natural fibers like cotton can generate static electricity.", "C": "Incorrect. Standard foam can also generate static.", "D": "Correct. Sensitive electronic components like RAM modules must be stored in an anti-static bag to protect them from damage by electrostatic discharge (ESD)."}},
            {"id": "C31", "question": "A Linux administrator is using the grep command while monitoring a database application. Which of the following would best describe this activity?", "options": {"A": "Search through a file for specific text", "B": "View a list of running processes", "C": "Change the permissions of a file", "D": "View the name of the working directory"}, "answer": "A", "explanation": {"correct": "A. Search through a file...", "A": "Correct. The `grep` command is a powerful tool used to search for specific text patterns within files or command output. An administrator would use it to filter through large log files to find specific error messages or events.", "B": "Incorrect. The `ps` or `top` commands are used to view running processes.", "C": "Incorrect. The `chmod` command is used to change permissions.", "D": "Incorrect. The `pwd` command is used to view the working directory."}},
            {"id": "C32", "question": "The upgrade process for Windows requires the installation of TPM hardware. Which of the following would best describe the reason for this system requirement?", "options": {"A": "Wired networking", "B": "64-bit compatibility", "C": "USB support", "D": "Cryptographic features"}, "answer": "D", "explanation": {"correct": "D. Cryptographic features", "A": "Incorrect. TPM is unrelated to networking.", "B": "Incorrect. 64-bit compatibility is a separate CPU requirement.", "C": "Incorrect. TPM is unrelated to USB support.", "D": "Correct. A TPM (Trusted Platform Module) is a microchip that provides secure, hardware-based cryptographic functions. Windows 11 requires it for security features like BitLocker drive encryption, Windows Hello, and measured boot."}},
            {"id": "C33", "question": "A medical center's hospital staff uses shared computer systems. An audit has found that some users are not logging out of their sessions, allowing others to access patient data. Which of the following would help prevent this type of issue?", "options": {"A": "Multi-factor authentication", "B": "Password expiration policy", "C": "Login time restrictions", "D": "Screensaver passwords"}, "answer": "D", "explanation": {"correct": "D. Screensaver passwords", "A": "Incorrect. MFA secures the initial login but does not protect an already open session.", "B": "Incorrect. This forces password changes but does not secure an active session.", "C": "Incorrect. This restricts when users can log in, but not what happens when they walk away.", "D": "Correct. A screensaver password, configured through Group Policy to activate after a short period of inactivity, will automatically lock the workstation. This forces any user to re-enter a password to resume the session, effectively preventing unauthorized access to an unattended computer."}},
            {"id": "C34", "question": "A user has a smartphone to assist with maps and directions. When reviewing their security settings, the user finds his phone attempting to contact a third-party website to share location information. Which of the following would be the best way to address this issue?", "options": {"A": "Disable the GPS", "B": "Perform a soft reset", "C": "Run an anti-malware scan", "D": "Use the cellular network instead of Wi-Fi"}, "answer": "C", "explanation": {"correct": "C. Run an anti-malware scan", "A": "Incorrect. Disabling the GPS would break legitimate map applications.", "B": "Incorrect. A soft reset (reboot) is unlikely to remove persistent malware.", "C": "Correct. An application sending location data to an unknown third party without the user's consent is a strong indication of spyware. The user should run a reputable anti-malware scan to detect and remove the malicious application.", "D": "Incorrect. The network type is irrelevant to the application's behavior."}},
            {"id": "C35", "question": "A company requires all users to authenticate to a proxy before communicating to external websites. Which of the following should be used to integrate the proxy authentication with the existing Active Directory credentials?", "options": {"A": "AES", "B": "TKIP", "C": "RADIUS", "D": "WPA3"}, "answer": "C", "explanation": {"correct": "C. RADIUS", "A": "Incorrect. AES is an encryption standard.", "B": "Incorrect. TKIP is an outdated Wi-Fi encryption protocol.", "C": "Correct. RADIUS is a centralized authentication protocol. It can act as an intermediary, allowing the proxy server to forward user authentication requests to the Active Directory domain controller. This enables single sign-on, where users can authenticate with their existing AD credentials.", "D": "Incorrect. WPA3 is a Wi-Fi security standard."}},
            {"id": "C36", "question": "A desktop administrator has been tasked with removing malware from an executive’s laptop. The removal process corrupts the operating system, and the Windows startup process now shows a Stop Error and reboots into a repeating cycle. Which of the following would be the best next step?", "options": {"A": "Perform a Windows Repair installation", "B": "Boot with a pre-installation environment", "C": "Schedule periodic scans", "D": "Create a restore point"}, "answer": "B", "explanation": {"correct": "B. Boot with a pre-installation environment", "A": "Incorrect. A Repair installation might fail if the OS is too corrupt.", "B": "Correct. Since the onboard OS is not bootable, the technician must boot from an external, trusted source. A pre-installation environment (like the Windows installation media or a specialized rescue disk) provides a clean operating environment from which the technician can run advanced anti-malware scanners, access repair tools, or back up data before performing a clean install.", "C": "Incorrect. This is a preventative measure for a working system.", "D": "Incorrect. A restore point cannot be created on a non-booting system."}},
            {"id": "C37", "question": "A security administrator is deploying a new application to users in the field. The administrator is concerned that brute-force password attacks could be used to gain access to the application. Which of the following would be the best way to address this issue?", "options": {"A": "Enable Windows Firewall", "B": "Block all login attempts at the Internet firewall", "C": "Create a Group Policy", "D": "Require multi-factor authentication"}, "answer": "D", "explanation": {"correct": "D. Require multi-factor authentication", "A": "Incorrect. The firewall allows legitimate traffic and cannot distinguish a brute-force attack from normal logins.", "B": "Incorrect. This would block all users.", "C": "Incorrect. Group Policy can enforce password complexity but cannot stop a brute-force attack.", "D": "Correct. Multi-factor authentication (MFA) is the most effective defense against password-based attacks. Even if an attacker successfully guesses the password, they will not be able to log in without the second factor (e.g., a code from a user's phone)."}},
            {"id": "C38", "question": "A system administrator would like to upgrade a user's Windows video editing application, but the upgrade utility fails with the error 'Not enough free space.' Which of the following utilities would allow the system administrator to resolve this issue?", "options": {"A": "cleanmgr", "B": "perfmon", "C": "eventvwr", "D": "diskmgmt"}, "answer": "A", "explanation": {"correct": "A. cleanmgr", "A": "Correct. `cleanmgr.exe` is the executable for the Windows Disk Cleanup utility. This tool scans the hard drive and allows the user to remove temporary files, old system restore points, and other non-essential data to free up disk space.", "B": "Incorrect. `perfmon` is the Performance Monitor.", "C": "Incorrect. `eventvwr` is the Event Viewer.", "D": "Incorrect. `diskmgmt` is Disk Management, used for partitioning drives."}},
            {"id": "C39", "question": "A user in the shipping department is using a tracking app on a tablet. The app normally takes 10 seconds to load, but now takes over a minute. Other apps are working normally. Which of the following would be the best next troubleshooting step?", "options": {"A": "Reinstall the tracking app", "B": "Check the app battery usage", "C": "Roll back to the previous tablet OS version", "D": "Perform a reboot"}, "answer": "D", "explanation": {"correct": "D. Perform a reboot", "A": "Incorrect. Reinstallation is a more drastic step that should be tried after simpler solutions fail.", "B": "Incorrect. Battery usage is not related to app loading time.", "C": "Incorrect. Rolling back the entire OS is not warranted for a single app issue.", "D": "Correct. For a sudden performance issue with a single app on a mobile device, the easiest and most effective first step is a simple reboot. This can clear out memory and resolve temporary software glitches that may be causing the slowdown."}},
            {"id": "C40", "question": "Which of the following fire extinguishers would be most appropriate to use in a data center?", "options": {"A": "Foam", "B": "Carbon Dioxide", "C": "Saline", "D": "Water"}, "answer": "B", "explanation": {"correct": "B. Carbon Dioxide", "A": "Incorrect. Foam extinguishers are not suitable for electronics as they leave a damaging residue.", "B": "Correct. Electrical fires (Class C) are the primary concern in a data center. A Carbon Dioxide (CO2) or other clean agent extinguisher is the appropriate choice because it is non-conductive and leaves no residue, minimizing damage to sensitive electronic equipment.", "C": "Incorrect. Saline is conductive and not used in extinguishers.", "D": "Incorrect. Water should never be used on electrical fires due to the risk of electrocution and spreading the fire."}},
            {"id": "C41", "question": "The Human Resources department is installing a shared computer in the company lobby for job applicants. Which of the following account types would be the best choice for this system?", "options": {"A": "SSO user", "B": "Administrator", "C": "Guest", "D": "Power User"}, "answer": "C", "explanation": {"correct": "C. Guest", "A": "Incorrect. SSO (Single Sign-On) describes an authentication method, not a user account type.", "B": "Incorrect. An Administrator account has full control and would be a major security risk on a public computer.", "C": "Correct. The Guest account in Windows is designed for temporary users. It has very limited permissions and cannot make system changes or access other users' files, making it the most secure and appropriate choice for a publicly accessible computer.", "D": "Incorrect. The Power User group is a legacy group with no extra privileges in modern Windows, but a standard user account still has more rights than necessary for this purpose."}},
            {"id": "C42", "question": "A Windows administrator needs to define a minimum password length for all network users. Which of the following should be used to complete this task?", "options": {"A": "Device Manager", "B": "Certificate Manager", "C": "Group Policy Editor", "D": "Performance Monitor"}, "answer": "C", "explanation": {"correct": "C. Group Policy Editor", "A": "Incorrect. Device Manager is for hardware.", "B": "Incorrect. Certificate Manager is for digital certificates.", "C": "Correct. In a Windows Active Directory environment, security settings such as minimum password length, complexity, and history requirements are centrally configured and enforced using the Group Policy Editor to create or modify Group Policy Objects (GPOs).", "D": "Incorrect. Performance Monitor is for tracking system resource usage."}},
            {"id": "C43", "question": "A user in the shipping department is able to view order information, but they cannot modify or delete any order details. Which of the following would best describe this security principle?", "options": {"A": "Multi-factor authentication", "B": "Least privilege", "C": "Group Policy", "D": "Organizational Units"}, "answer": "B", "explanation": {"correct": "B. Least privilege", "A": "Incorrect. MFA is an authentication method.", "B": "Correct. The principle of least privilege dictates that a user should only be granted the minimum permissions required to perform their job functions. In this case, the user only needs to view orders, so they are not given permissions to modify or delete them.", "C": "Incorrect. Group Policy is the mechanism used to enforce principles like least privilege, but it is not the principle itself.", "D": "Incorrect. OUs are containers in Active Directory for organizing objects."}},
            {"id": "C44", "question": "A user is receiving this message on their Windows desktop: 'The controller does not have enough resources for this device.' Which of the following would be the most likely reason for this issue?", "options": {"A": "Remote printer has been disabled", "B": "Wireless network bandwidth exceeded", "C": "USB endpoints are exceeded", "D": "The system clock is incorrect"}, "answer": "C", "explanation": {"correct": "C. USB endpoints are exceeded", "A": "Incorrect. A disabled printer would not generate this specific error.", "B": "Incorrect. Exceeded bandwidth would cause network slowness, not a resource error message.", "C": "Correct. USB controllers have a limited number of 'endpoints' or communication channels. If too many devices requiring dedicated channels are connected to a single USB root hub, its resources can be exhausted, resulting in this error. The solution is to move one of the devices to a different physical USB port that is connected to a separate controller.", "D": "Incorrect. An incorrect system clock causes certificate errors, not resource errors."}},
            {"id": "C45", "question": "A small company is located in a large office building shared by fifty different companies. The company would like to secure their wireless network. Which of these configuration settings would prevent their wireless network from appearing in a list of available networks?", "options": {"A": "MAC filtering", "B": "Static IP addressing", "C": "WPA3 encryption", "D": "SSID suppression"}, "answer": "D", "explanation": {"correct": "D. SSID suppression", "A": "Incorrect. MAC filtering restricts which devices can connect, but it does not hide the network.", "B": "Incorrect. IP addressing does not affect the visibility of the network.", "C": "Incorrect. WPA3 is an encryption standard and does not hide the network.", "D": "Correct. SSID suppression, also known as disabling the SSID broadcast, is a feature on wireless access points that prevents the network name (SSID) from being publicly advertised. While not a strong security measure on its own, it does prevent the network from appearing in casual scans."}},

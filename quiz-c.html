            {"id": "C77", "question": "A company is updating all of their UPS systems with new batteries. Which of the following would be the best way to dispose of the old batteries?", "options": {"A": "Take to a local hazardous waste facility", "B": "Throw out with the paper trash", "C": "Ship them to a battery wholesaler", "D": "Bury them in a landfill"}, "answer": "A", "explanation": {"correct": "A. Take to a local hazardous waste facility", "A": "Correct. UPS batteries are typically lead-acid batteries, which contain toxic and corrosive materials. They are considered hazardous waste and must be disposed of according to local environmental regulations, which usually involves taking them to a designated hazardous waste or recycling facility.", "B": "Incorrect. This is illegal and environmentally harmful.", "C": "Incorrect. A wholesaler buys new batteries, they don't dispose of old ones.", "D": "Incorrect. This is illegal and environmentally harmful."}},
            {"id": "C78", "question": "Which of the following should a company use to reduce their legal liability if an employee is dismissed?", "options": {"A": "End user licensing agreement", "B": "Acceptable use policy", "C": "Standard operating procedures", "D": "Regulatory compliance documentation"}, "answer": "B", "explanation": {"correct": "B. Acceptable use policy", "A": "Incorrect. An EULA is for software.", "B": "Correct. An Acceptable Use Policy (AUP) is a document that all employees must sign, which clearly outlines the rules for using company resources. If an employee is dismissed for violating one of these rules (e.g., using company email for illegal activities), the signed AUP provides clear documentation that the employee was aware of the policy, which reduces the company's liability.", "C": "Incorrect. SOPs are instructional documents.", "D": "Incorrect. This relates to external regulations, not internal employee conduct."}},
            {"id": "C79", "question": "A healthcare administrator stores sensitive data on his laptop computer. The administrator works in an open office area with many other people. Which of the following would add additional security to the administrator's work area?", "options": {"A": "Door lock", "B": "Fingerprint scanner", "C": "Magnetometer", "D": "Bollards"}, "answer": "B", "explanation": {"correct": "B. Fingerprint scanner", "A": "Incorrect. A door lock secures the entire room, not the individual's work area.", "B": "Correct. A fingerprint scanner provides biometric authentication. This is a strong method for securing the laptop itself, preventing unauthorized individuals in the open office from logging in if the administrator steps away.", "C": "Incorrect. A magnetometer is a sensor for magnetic fields.", "D": "Incorrect. Bollards are physical barriers to stop vehicles."}},
            {"id": "C80", "question": "A technician has received a help desk ticket asking for help with a broken laptop keyboard. The ticket has a normal priority, but the user has added a note that the laptop is scheduled to be used for a press event the following day. Which of the following would be the best next step with the ticket?", "options": {"A": "Refer the ticket to the laptop group", "B": "Escalate the issue with management", "C": "Add the event information to the problem description", "D": "Assign the ticket to the 'laptop' category"}, "answer": "B", "explanation": {"correct": "B. Escalate the issue with management", "A": "Incorrect. Simply referring the ticket doesn't address the urgency.", "B": "Correct. The user's note indicates that the ticket's normal priority is incorrect due to a time-sensitive business need (the press event). The technician should immediately escalate the issue to their manager to get the priority increased and ensure the issue is addressed before the deadline.", "C": "Incorrect. This is good documentation, but it does not advance the resolution.", "D": "Incorrect. This is clerical and does not address the urgency."}},
            {"id": "C81", "question": "A network administrator has been asked to manage the router configurations at all company locations. Which of the following would be the best choice for this task?", "options": {"A": "SSH", "B": "VNC", "C": "NFC", "D": "RDP"}, "answer": "A", "explanation": {"correct": "A. SSH", "A": "Correct. SSH (Secure Shell) is the standard protocol for securely accessing the command-line interface of network devices like routers and switches. It provides a strong, encrypted connection for remote management.", "B": "Incorrect. VNC is for graphical remote control of desktops.", "C": "Incorrect. NFC is a short-range wireless communication technology.", "D": "Incorrect. RDP is for graphical remote control of Windows systems."}},
            {"id": "C82", "question": "A user is browsing to their corporate home page, but a different website appears instead. The technician confirms the user is typing the URL correctly. Which of the following would be the best next troubleshooting step?", "options": {"A": "Try connecting to the site in Safe Mode", "B": "Perform an anti-malware scan", "C": "View all browsing results in the Event Viewer", "D": "Roll back to a previous configuration"}, "answer": "B", "explanation": {"correct": "B. Perform an anti-malware scan", "A": "Incorrect. Safe Mode might bypass the issue, but it won't fix it.", "B": "Correct. This is a classic symptom of a browser hijacker or a compromised hosts file. Malware on the system is redirecting the browser from the intended URL to a malicious one. An immediate anti-malware scan is the best next step to find and remove the cause.", "C": "Incorrect. Event Viewer does not log browsing results.", "D": "Incorrect. There is no indication a recent configuration change caused this."}},
            {"id": "C83", "question": "A technician has just received fifty boxes of used laser printer toner cartridges that need to be disposed of. Which of the following would be the best NEXT step for managing these used cartridges?", "options": {"A": "Refer to the MSDS", "B": "Ship the cartridges to the original manufacturer", "C": "Incinerate the cartridges", "D": "Drill a hole in each cartridge"}, "answer": "A", "explanation": {"correct": "A. Refer to the MSDS", "A": "Correct. The MSDS (Material Safety Data Sheet), now more commonly called SDS (Safety Data Sheet), provides detailed information about a substance, including handling, storage, and disposal procedures. Before disposing of any potentially hazardous material like toner, the technician should always consult the MSDS to ensure they are following the correct and safe procedures.", "B": "Incorrect. This may be the ultimate procedure, but consulting the documentation comes first.", "C": "Incorrect. This is a specific disposal method that may not be appropriate.", "D": "Incorrect. This would create a hazardous dust cloud."}},
            {"id": "C84", "question": "A system administrator has been notified a serious security vulnerability has been identified in software used by the company. Which part of the documentation would explain the disadvantages of not quickly patching this software?", "options": {"A": "Backout plan", "B": "End-user acceptance", "C": "Detailed change plan", "D": "Risk analysis"}, "answer": "D", "explanation": {"correct": "D. Risk analysis", "A": "Incorrect. The backout plan explains how to undo the change.", "B": "Incorrect. End-user acceptance is the final step.", "C": "Incorrect. The change plan details how to perform the patch.", "D": "Correct. A risk analysis is a key part of the change management process that identifies potential problems. It would detail the risks of both applying the patch (e.g., potential downtime) and not applying the patch (e.g., the risk of being compromised by the known vulnerability)."}},
            {"id": "C85", "question": "A company is donating ten laptop computers to a local community center. Which of the following processes should be followed before making this donation?", "options": {"A": "Inventory management", "B": "Acceptable use policy", "C": "Password policy", "D": "Knowledge base article"}, "answer": "A", "explanation": {"correct": "A. Inventory management", "A": "Correct. When a company disposes of an asset, it must be properly documented in the inventory management system. This involves updating the asset tags' status to 'donated' or 'disposed' to maintain an accurate record of all company property.", "B": "Incorrect. An AUP applies to employees, not donated equipment.", "C": "Incorrect. A password policy applies to active systems.", "D": "Incorrect. A knowledge base article is for documentation, not asset tracking."}},
            {"id": "C86", "question": "A technician is troubleshooting a problem on a Linux server and needs to view the real-time CPU and memory utilization for each operating system process. Which of the following would provide this functionality?", "options": {"A": "dig", "B": "df", "C": "cat", "D": "top"}, "answer": "D", "explanation": {"correct": "D. top", "A": "Incorrect. `dig` is a DNS lookup utility.", "B": "Incorrect. `df` shows disk free space.", "C": "Incorrect. `cat` is used to display the contents of a file.", "D": "Correct. The `top` command provides a real-time, dynamic view of the running processes on a Linux system. It displays a list of processes sorted by CPU usage and provides a summary of CPU and memory utilization, similar to the Windows Task Manager."}},
            {"id": "C87", "question": "A technician has just installed a new device driver and restarted a Windows laptop, but now the system shows a Windows Stop Error before the login screen is displayed. Which of the following would be the best way to resolve this issue?", "options": {"A": "Start in Safe Mode", "B": "Replace the system memory", "C": "Reinstall Windows from the original media", "D": "Perform a full backup"}, "answer": "A", "explanation": {"correct": "A. Start in Safe Mode", "A": "Correct. A Stop Error (BSOD) immediately after a driver installation points to a faulty or incompatible driver. Safe Mode starts Windows with a minimal set of drivers and services. This allows the system to boot successfully so the technician can then use Device Manager to roll back or uninstall the problematic driver.", "B": "Incorrect. This is a software problem, not a hardware one.", "C": "Incorrect. Reinstalling Windows is a last resort.", "D": "Incorrect. A backup cannot be performed on a non-booting system."}},
            {"id": "C88", "question": "A company is moving three computer racks of equipment from an old data center to a new facility. Which of these safety features should be the most important requirement at the new location?", "options": {"A": "Air filter masks", "B": "Anti-static mat", "C": "Equipment grounding", "D": "Surge protectors"}, "answer": "C", "explanation": {"correct": "C. Equipment grounding", "A": "Incorrect. Masks are for dusty environments, not a standard data center requirement.", "B": "Incorrect. Anti-static mats are important but secondary to proper electrical grounding.", "C": "Correct. Proper electrical grounding is the most critical safety feature in any data center. It provides a safe path for stray electrical current, preventing equipment chassis from becoming energized and posing a lethal shock hazard to personnel.", "D": "Incorrect. Surge protectors are important, but proper grounding is a more fundamental safety requirement."}},
            {"id": "C89", "question": "A company has configured a server for daily backups, and a full backup is created each Sunday based on the previous incremental backups. Which of the following would best describe this backup strategy?", "options": {"A": "Differential", "B": "GFS", "C": "Synthetic", "D": "3-2-1"}, "answer": "C", "explanation": {"correct": "C. Synthetic", "A": "Incorrect. A differential backup saves all changes since the last full backup.", "B": "Incorrect. GFS (Grandfather-Father-Son) is a rotation scheme, not a backup type.", "C": "Correct. A synthetic backup creates a new full backup by combining a previous full backup with subsequent incremental backups. This avoids the high network and server load of performing a traditional full backup from the source client.", "D": "Incorrect. 3-2-1 is a rule for data protection strategy (3 copies, 2 media, 1 off-site), not a backup type."}},
            {"id": "C90", "question": "Which of the following would allow someone else in the room to maliciously obtain a username and password?", "options": {"A": "Spoofing", "B": "Tailgating", "C": "DoS", "D": "Shoulder surfing"}, "answer": "D", "explanation": {"correct": "D. Shoulder surfing", "A": "Incorrect. Spoofing is a network-based impersonation attack.", "B": "Incorrect. Tailgating is a physical access attack.", "C": "Incorrect. DoS (Denial of Service) is an availability attack.", "D": "Correct. Shoulder surfing is the direct observation technique of looking over someone's shoulder to obtain sensitive information, such as watching them type their username and password."}}
        ];
        
        const quizContainerEl = document.getElementById('quiz-container');
        let quizData = []; 
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answerSubmitted = false;
        let timerInterval;

        function showSetupScreen() {
            quizContainerEl.innerHTML = `
                <div id="setup-screen">
                    <h2>Practice Exam Settings</h2>
                    <div class="setup-option">
                        <label for="num-questions">Number of Questions:</label>
                        <select id="num-questions">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="30">30</option>
                            <option value="all">All (${allQuizData.length})</option>
                        </select>
                    </div>
                    <div class="setup-option">
                        <label for="time-limit">Time Limit:</label>
                        <select id="time-limit">
                            <option value="untimed">Untimed</option>
                            <option value="15">15 Minutes</option>
                            <option value="30">30 Minutes</option>
                            <option value="60">60 Minutes</option>
                            <option value="90" selected>90 Minutes</option>
                        </select>
                    </div>
                    <button id="start-quiz-btn">Start Quiz</button>
                </div>
            `;
            document.getElementById('start-quiz-btn').addEventListener('click', initializeQuiz);
        }

        function initializeQuiz() {
            const numQuestions = document.getElementById('num-questions').value;
            const timeSelection = document.getElementById('time-limit').value;
            
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            
            const shuffled = [...allQuizData].sort(() => 0.5 - Math.random());
            quizData = numQuestions === 'all' ? shuffled : shuffled.slice(0, Number(numQuestions));

            renderQuizUI();
            
            if (timeSelection !== 'untimed') {
                startTimer(Number(timeSelection));
            }
        }
        
        function renderQuizUI() {
            quizContainerEl.innerHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="timer">--:--</div>
                <div id="quiz-header">
                    <h1>Professor Messer's CompTIA A+ Core 2 (220-1202) Practice Test C</h1>
                    <p id="creator-tag">Created by: BLaborte</p>
                </div>
                <div id="quiz-body">
                    <p id="question-text"></p>
                    <ul id="options-list"></ul>
                    <div id="explanation-container" style="display: none;"></div>
                </div>
                <div id="quiz-footer">
                    <div id="score-text">Score: 0</div>
                    <div id="footer-buttons">
                        <button id="submit-btn">Submit Answer</button>
                    </div>
                </div>
            `;
            document.getElementById('submit-btn').addEventListener('click', () => checkAnswer(false));
            loadQuiz();
        }

        function startTimer(minutes) {
            let timeInSeconds = minutes * 60;
            const timerEl = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                const mins = Math.floor(timeInSeconds / 60);
                let secs = timeInSeconds % 60;
                secs = secs < 10 ? '0' + secs : secs;
                timerEl.textContent = `${mins}:${secs}`;
                if (timeInSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerEl.textContent = "0:00";
                    if (!answerSubmitted) {
                        checkAnswer(true); // Auto-submit on time-out
                        showResults();
                    }
                }
                timeInSeconds--;
            }, 1000);
        }

        function loadQuiz() {
            answerSubmitted = false;
            const currentQuestion = quizData[currentQuestionIndex];
            
            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
            const optionsListEl = document.getElementById('options-list');
            optionsListEl.innerHTML = ''; 

            const isMultipleChoice = Array.isArray(currentQuestion.answer);
            const inputType = isMultipleChoice ? 'checkbox' : 'radio';

            for (const key in currentQuestion.options) {
                const option = document.createElement('li');
                option.classList.add('option');
                option.innerHTML = `<label for="${key}"><input type="${inputType}" name="option" id="${key}" value="${key}">${key}. ${currentQuestion.options[key]}</label>`;
                optionsListEl.appendChild(option);
            }
            
            const explanationContainer = document.getElementById('explanation-container');
            if (explanationContainer) explanationContainer.style.display = 'none';

            document.getElementById('footer-buttons').innerHTML = '<button id="submit-btn">Submit Answer</button>';
            document.getElementById('submit-btn').addEventListener('click', () => checkAnswer(false));
        }

        function checkAnswer(isTimeOut = false) {
            if (answerSubmitted) return;

            const selectedOptionInputs = document.querySelectorAll('input[name="option"]:checked');
            if (selectedOptionInputs.length === 0 && !isTimeOut) {
                alert('Please select an answer!');
                return;
            }
            answerSubmitted = true;

            const selectedAnswers = Array.from(selectedOptionInputs).map(input => input.value);
            const correctAnswer = quizData[currentQuestionIndex].answer;
            let isCorrect = false;

            if (Array.isArray(correctAnswer)) {
                // Check if the selected answers match the correct answers exactly
                isCorrect = selectedAnswers.length === correctAnswer.length && 
                            selectedAnswers.every(answer => correctAnswer.includes(answer)) && 
                            correctAnswer.every(answer => selectedAnswers.includes(answer));
            } else {
                // Handle single-answer questions
                isCorrect = selectedAnswers.length === 1 && selectedAnswers[0] === correctAnswer;
            }

            userAnswers.push({ question: quizData[currentQuestionIndex], userAnswer: selectedAnswers, isCorrect: isCorrect });

            if (isCorrect) {
                score++;
            }
            document.getElementById('score-text').innerText = `Score: ${score}`;
            
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.classList.add('no-click');
                const input = option.querySelector('input');
                const isCorrectAnswer = Array.isArray(correctAnswer) ? correctAnswer.includes(input.value) : input.value === correctAnswer;
                const isSelected = selectedAnswers.includes(input.value);

                if (isCorrectAnswer) {
                    option.classList.add('correct');
                } else if (isSelected) {
                    option.classList.add('incorrect');
                }
            });

            showExplanation();
            
            if(!isTimeOut) {
                const footerButtons = document.getElementById('footer-buttons');
                let nextButtonHTML = '';
                if (currentQuestionIndex < quizData.length - 1) {
                    nextButtonHTML = `<button id="next-btn">Next Question</button>`;
                } else {
                    nextButtonHTML = `<button id="next-btn">Finish Quiz</button>`;
                }
                
                footerButtons.innerHTML = `<button id="toggle-explanation-btn">Show Explanation</button>${nextButtonHTML}`;
                
                document.getElementById('toggle-explanation-btn').addEventListener('click', toggleExplanation);
                document.getElementById('next-btn').addEventListener('click', () => {
                    if (currentQuestionIndex < quizData.length - 1) {
                        currentQuestionIndex++;
                        loadQuiz();
                    } else {
                        showResults();
                    }
                });
            }
        }
        
        function showExplanation() {
            const explanationData = quizData[currentQuestionIndex].explanation;
            let explanationContainer = document.getElementById('explanation-container');
            if (!explanationContainer) return;
            
            let explanationHTML = `<div class="explanation-title">Correct Answer: ${explanationData.correct}</div>`;
            explanationHTML += '<div class="explanation-text">';
            for(const key in explanationData) {
                if(key !== 'correct'){
                    explanationHTML += `<p><strong>${key.toUpperCase()}:</strong> ${explanationData[key]}</p>`;
                }
            }
            explanationHTML += '</div>';

            explanationContainer.innerHTML = explanationHTML;
        }

        function toggleExplanation() {
            const explanationContainer = document.getElementById('explanation-container');
            const toggleBtn = document.getElementById('toggle-explanation-btn');
            const isHidden = explanationContainer.style.display === 'none';
            
            explanationContainer.style.display = isHidden ? 'block' : 'none';
            toggleBtn.textContent = isHidden ? 'Hide Explanation' : 'Show Explanation';
        }
        
        function showResults() {
            if (timerInterval) clearInterval(timerInterval);
            
            let resultsHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="quiz-header"><h1>Quiz Results</h1></div>
                <div id="quiz-body">
                    <div class="results-summary">
                        <h2>Your final score is ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)</h2>
                    </div>
                    <div class="results-list">
            `;

            userAnswers.forEach((answer, index) => {
                const question = answer.question;
                resultsHTML += `
                    <div class="result-item">
                        <p class="result-question">${index + 1}. ${question.question}</p>
                        <ul class="result-options">
                `;
                for(const key in question.options) {
                    let className = 'result-option';
                    const correctAnswer = question.answer;
                    const isCorrectAnswer = Array.isArray(correctAnswer) ? correctAnswer.includes(key) : key === correctAnswer;
                    const isUserAnswer = Array.isArray(answer.userAnswer) ? answer.userAnswer.includes(key) : key === answer.userAnswer; // Fixed this line

                    if (isCorrectAnswer) {
                        className += ' correct-answer';
                    } else if (isUserAnswer) {
                        className += ' incorrect-answer';
                    }
                    resultsHTML += `<li class="${className}">${key}. ${question.options[key]}</li>`;
                }
                resultsHTML += `
                        </ul>
                        <div class="result-explanation">
                            <p><strong>Explanation:</strong> ${question.explanation.correct}</p>
                        </div>
                    </div>
                `;
            });

            resultsHTML += `</div></div>`;
            quizContainerEl.innerHTML = resultsHTML;
        }
        
        showSetupScreen();
    </script>
</body>
</html>

            {"id": "B80", "question": "An Android phone user is traveling internationally and would like to avoid overage charges from their cellular provider. Which of the following would be the best way to control data access?", "options": {"A": "Install a VPN client", "B": "Remove all apps with high data requirements", "C": "Enable data usage notifications", "D": "Connect exclusively through a cellular hotspot"}, "answer": "C", "explanation": {"correct": "C. Enable data usage notifications", "A": "Incorrect. A VPN encrypts data but does not reduce the amount of data used.", "B": "Incorrect. This is impractical and doesn't provide fine-grained control.", "C": "Correct. Android has built-in data usage controls that allow a user to monitor their consumption, set a warning threshold, and even set a hard limit that will automatically disable cellular data when reached. This is the most effective way to actively manage data use and prevent overage charges.", "D": "Incorrect. A cellular hotspot uses the same cellular data and would not prevent overages."}},
            {"id": "B81", "question": "A technician is upgrading the motherboard in a server. Which of the following should be the first task when beginning this upgrade?", "options": {"A": "Wear safety goggles", "B": "Connect an ESD strap", "C": "Remove any motherboard batteries", "D": "Disconnect from all power sources"}, "answer": "D", "explanation": {"correct": "D. Disconnect from all power sources", "A": "Incorrect. Safety goggles are generally not required for this task.", "B": "Incorrect. Connecting an ESD strap is a critical step, but it must be done after the power is off.", "C": "Incorrect. The CMOS battery should be removed after the motherboard is out, if needed.", "D": "Correct. The absolute first step before working inside any computer or server is to ensure personal safety and protect the components by completely powering down the device and unplugging all power cables from the power supplies."}},
            {"id": "B82", "question": "A system administrator is installing a new video editing application on a user’s workstation from a USB flash drive. During the installation, the installation process fails due to lack of available drive space. Which of the following would be the best way to complete the installation process?", "options": {"A": "Use a share drive for the installation source", "B": "Compress the installation files", "C": "Install the application to a network share", "D": "Manually copy the installation files to the application directory"}, "answer": "C", "explanation": {"correct": "C. Install the application to a network share", "A": "Incorrect. The source of the files doesn't change the lack of space on the destination drive.", "B": "Incorrect. Installation files are already compressed; this wouldn't help.", "C": "Correct. If the local drive is full, many application installers provide a 'Custom' installation option that allows the user to change the installation path. For large applications, installing them to a secondary local drive or a fast network share can be a valid solution.", "D": "Incorrect. Manually copying files will not properly install the application, which needs to create registry entries and other system modifications."}},
            {"id": "B83", "question": "A user would like to install an image and photo editing program on their home computer, but they would prefer an application without a monthly subscription. Which of the following would be the best licensing option for this requirement?", "options": {"A": "Open-source", "B": "Corporate", "C": "Personal", "D": "DRM"}, "answer": "A", "explanation": {"correct": "A. Open-source", "A": "Correct. Open-source software is typically free of charge and does not use a subscription model. Many powerful image editing programs (like GIMP or Krita) are open-source, making this the ideal choice for a user who wants a powerful application without ongoing costs.", "B": "Incorrect. A corporate license is for business use.", "C": "Incorrect. A personal license can still be a subscription model.", "D": "Incorrect. DRM (Digital Rights Management) is a technology used to control access to software, not a license type itself."}},
            {"id": "B84", "question": "A system administrator is troubleshooting an application issue. The application will work normally, but then consume all available memory, requiring the computer to be rebooted every few days. Which of the following utilities would show how much RAM is used by this application?", "options": {"A": "Event Viewer", "B": "Device Manager", "C": "Task Manager", "D": "Programs and Features"}, "answer": "C", "explanation": {"correct": "C. Task Manager", "A": "Incorrect. Event Viewer shows error logs, not real-time resource usage.", "B": "Incorrect. Device Manager is for hardware.", "C": "Correct. This scenario describes a 'memory leak.' The Task Manager's 'Processes' or 'Details' tab provides a real-time view of all running processes and allows the administrator to sort by memory usage, easily identifying which application is consuming all of the available RAM.", "D": "Incorrect. Programs and Features is for uninstalling applications."}},
            {"id": "B85", "question": "An administrator is troubleshooting a desktop computer experiencing a reboot issue. After the initial POST, the Windows startup screen appears, but then the system reboots in a continuous loop. Which of the following would be the best way to address this issue?", "options": {"A": "Start Safe Mode and perform a defragmentation", "B": "Reinstall the operating system from the original media", "C": "Update the boot order from the system BIOS", "D": "Run Startup Repair from the Advanced Boot Options"}, "answer": "D", "explanation": {"correct": "D. Run Startup Repair...", "A": "Incorrect. Defragmentation is unrelated to boot issues.", "B": "Incorrect. Reinstalling the OS is a last resort.", "C": "Incorrect. The system is beginning to load Windows, so the boot order is correct.", "D": "Correct. A continuous reboot loop after the POST but during the Windows loading screen often indicates corrupted system files or a bad driver. The Startup Repair utility, found in the Windows Recovery Environment (accessed via Advanced Boot Options), is specifically designed to automatically diagnose and fix these types of problems."}},
            {"id": "B86", "question": "A user has downloaded a browser add-on from an untrusted website. When the user tries to install the add-on, the Windows UAC is requesting permissions to continue with the install. Which of these is most likely?", "options": {"A": "The operating system requires an update", "B": "The software is a Trojan horse", "C": "The workstation is already part of a botnet", "D": "A worm will be downloaded and installed"}, "answer": "B", "explanation": {"correct": "B. The software is a Trojan horse", "A": "Incorrect. An OS update would present a different message.", "B": "Correct. A legitimate browser add-on should not require administrator-level permissions from the User Account Control (UAC). A UAC prompt indicates the program is attempting to make system-level changes. This is a huge red flag that the software is a Trojan horse, disguising itself as a simple add-on while trying to install malicious code.", "C": "Incorrect. This action is what could lead to becoming part of a botnet.", "D": "Incorrect. This describes a possible outcome, but the software type is a Trojan."}},
            {"id": "B87", "question": "A technician is working on many different terminal sessions on their screen. The technician would like a command that can confirm the user account associated with each session. Which of the following would be the best way to display the login name associated with each terminal session?", "options": {"A": "winver", "B": "nslookup", "C": "whoami", "D": "net use"}, "answer": "C", "explanation": {"correct": "C. whoami", "A": "Incorrect. 'winver' displays the Windows version.", "B": "Incorrect. 'nslookup' is for DNS queries.", "C": "Correct. The 'whoami' command is available in both Windows and Linux and its sole function is to display the username of the current user, making it perfect for identifying the account context of a terminal session.", "D": "Incorrect. 'net use' manages network drive mappings."}},
            {"id": "B88", "question": "A system administrator needs a way to deploy new smartphone configurations across four different user groups. The smartphones are all owned by the company. Which of the following would be the best way to setup these smartphones?", "options": {"A": "Assign configuration profiles for each group", "B": "Restore all smartphones from cloud backups", "C": "Provide customized instructions for each user", "D": "Assign separate support teams for each group"}, "answer": "A", "explanation": {"correct": "A. Assign configuration profiles...", "A": "Correct. Using a Mobile Device Management (MDM) solution, an administrator can create different configuration profiles for different groups of users (e.g., Sales, Engineering). These profiles can push specific settings like Wi-Fi configurations, email accounts, application whitelists, and security restrictions to the devices in each group, ensuring consistency and proper configuration.", "B": "Incorrect. This would make all phones identical, which is not the requirement.", "C": "Incorrect. This is inefficient and prone to user error.", "D": "Incorrect. This is a personnel solution, not a technical one."}},
            {"id": "B89", "question": "A desktop administrator is troubleshooting an error which randomly causes a workstation to spike to 100% utilization. Which of these utilities would help the administrator track and report on system utilization over a 24-hour period?", "options": {"A": "Performance Monitor", "B": "Device Manager", "C": "Services", "D": "Task Scheduler"}, "answer": "A", "explanation": {"correct": "A. Performance Monitor", "A": "Correct. While Task Manager is good for real-time viewing, Performance Monitor is the Windows tool designed for logging performance data over extended periods. The administrator can configure a Data Collector Set to record CPU utilization (and other metrics) to a log file for 24 hours, then analyze the log to identify what time the spikes occurred.", "B": "Incorrect. Device Manager is for hardware.", "C": "Incorrect. 'Services' is for managing background processes.", "D": "Incorrect. Task Scheduler is for automating tasks."}},
            {"id": "B90", "question": "Which of these would be the best way to prevent an attacker from modifying default routes on a SOHO wireless network?", "options": {"A": "Configure MAC address filtering", "B": "Enable WPS connectivity", "C": "Change the router's default password", "D": "Disable unneeded interfaces"}, "answer": "C", "explanation": {"correct": "C. Change the router's default password", "A": "Incorrect. MAC filtering restricts which devices can connect to the Wi-Fi, but doesn't protect the router's configuration.", "B": "Incorrect. WPS is a known vulnerability and should be disabled.", "C": "Correct. Most SOHO routers ship with a well-known default administrator password (e.g., 'admin', 'password'). An attacker can easily guess this password to gain access to the router's configuration page and make malicious changes. Changing the default administrative password is the single most important step in securing a SOHO router.", "D": "Incorrect. While a good hardening step, it doesn't prevent an attacker from logging in."}}
        ];

        // Global variables and the rest of the JavaScript functions...
        const quizContainerEl = document.getElementById('quiz-container');
        let quizData = []; 
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answerSubmitted = false;
        let timerInterval;

        function showSetupScreen() {
            quizContainerEl.innerHTML = `
                <div id="setup-screen">
                    <h2>Practice Exam Settings</h2>
                    <div class="setup-option">
                        <label for="num-questions">Number of Questions:</label>
                        <select id="num-questions">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="30">30</option>
                            <option value="all">All (${allQuizData.length})</option>
                        </select>
                    </div>
                    <div class="setup-option">
                        <label for="time-limit">Time Limit:</label>
                        <select id="time-limit">
                            <option value="untimed">Untimed</option>
                            <option value="15">15 Minutes</option>
                            <option value="30">30 Minutes</option>
                            <option value="60">60 Minutes</option>
                            <option value="90" selected>90 Minutes</option>
                        </select>
                    </div>
                    <button id="start-quiz-btn">Start Quiz</button>
                </div>
            `;
            document.getElementById('start-quiz-btn').addEventListener('click', initializeQuiz);
        }

        function initializeQuiz() {
            const numQuestions = document.getElementById('num-questions').value;
            const timeSelection = document.getElementById('time-limit').value;
            
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            
            const shuffled = [...allQuizData].sort(() => 0.5 - Math.random());
            quizData = numQuestions === 'all' ? shuffled : shuffled.slice(0, Number(numQuestions));

            renderQuizUI();
            
            if (timeSelection !== 'untimed') {
                startTimer(Number(timeSelection));
            }
        }
        
        function renderQuizUI() {
            quizContainerEl.innerHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="timer">--:--</div>
                <div id="quiz-header">
                    <h1>Professor Messer's CompTIA A+ Core 2 (220-1202) Practice Test B</h1>
                    <p id="creator-tag">Created by: BLaborte</p>
                </div>
                <div id="quiz-body">
                    <p id="question-text"></p>
                    <ul id="options-list"></ul>
                    <div id="explanation-container" style="display: none;"></div>
                </div>
                <div id="quiz-footer">
                    <div id="score-text">Score: 0</div>
                    <div id="footer-buttons">
                        <button id="submit-btn">Submit Answer</button>
                    </div>
                </div>
            `;
            document.getElementById('submit-btn').addEventListener('click', checkAnswer);
            loadQuiz();
        }

        function startTimer(minutes) {
            let timeInSeconds = minutes * 60;
            const timerEl = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                const mins = Math.floor(timeInSeconds / 60);
                let secs = timeInSeconds % 60;
                secs = secs < 10 ? '0' + secs : secs;
                timerEl.textContent = `${mins}:${secs}`;
                if (timeInSeconds < 0) {
                    clearInterval(timerInterval);
                    showResults();
                }
                timeInSeconds--;
            }, 1000);
        }

        function loadQuiz() {
            answerSubmitted = false;
            const currentQuestion = quizData[currentQuestionIndex];
            
            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
            const optionsListEl = document.getElementById('options-list');
            optionsListEl.innerHTML = ''; 

            for (const key in currentQuestion.options) {
                const option = document.createElement('li');
                option.classList.add('option');
                option.innerHTML = `<input type="radio" name="option" id="${key}" value="${key}"><label for="${key}">${key}. ${currentQuestion.options[key]}</label>`;
                optionsListEl.appendChild(option);
            }
            
            const explanationContainer = document.getElementById('explanation-container');
            if (explanationContainer) explanationContainer.style.display = 'none';

            document.getElementById('footer-buttons').innerHTML = '<button id="submit-btn">Submit Answer</button>';
            document.getElementById('submit-btn').addEventListener('click', checkAnswer);
        }

        function checkAnswer() {
            if (answerSubmitted) return;
            const selectedOptionInput = document.querySelector('input[name="option"]:checked');
            if (!selectedOptionInput) {
                alert('Please select an answer!');
                return;
            }
            answerSubmitted = true;
            const selectedAnswer = selectedOptionInput.value;
            const correctAnswer = quizData[currentQuestionIndex].answer;
            const isCorrect = Array.isArray(correctAnswer) ? correctAnswer.includes(selectedAnswer) : selectedAnswer === correctAnswer;

            userAnswers.push({ question: quizData[currentQuestionIndex], userAnswer: selectedAnswer, isCorrect: isCorrect });

            if (isCorrect) {
                score++;
            }
            document.getElementById('score-text').innerText = `Score: ${score}`;
            
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.classList.add('no-click');
                const input = option.querySelector('input');
                if ((Array.isArray(correctAnswer) && correctAnswer.includes(input.value)) || input.value === correctAnswer) {
                    option.classList.add('correct');
                } else if (input.value === selectedAnswer) {
                    option.classList.add('incorrect');
                }
            });

            showExplanation();
            
            const footerButtons = document.getElementById('footer-buttons');
            let nextButtonHTML = '';
            if (currentQuestionIndex < quizData.length - 1) {
                nextButtonHTML = `<button id="next-btn">Next Question</button>`;
            } else {
                nextButtonHTML = `<button id="next-btn">Finish Quiz</button>`;
            }
            
            footerButtons.innerHTML = `<button id="toggle-explanation-btn">Show Explanation</button>${nextButtonHTML}`;
            
            document.getElementById('toggle-explanation-btn').addEventListener('click', toggleExplanation);
            document.getElementById('next-btn').addEventListener('click', () => {
                if (currentQuestionIndex < quizData.length - 1) {
                    currentQuestionIndex++;
                    loadQuiz();
                } else {
                    showResults();
                }
            });
        }

        function showExplanation() {
            const explanationData = quizData[currentQuestionIndex].explanation;
            let explanationContainer = document.getElementById('explanation-container');
            if (!explanationContainer) return;
            
            let explanationHTML = `<div class="explanation-title">Correct Answer: ${explanationData.correct}</div>`;
            explanationHTML += '<div class="explanation-text">';
            for(const key in explanationData) {
                if(key !== 'correct'){
                    explanationHTML += `<p><strong>${key.toUpperCase()}:</strong> ${explanationData[key]}</p>`;
                }
            }
            explanationHTML += '</div>';

            explanationContainer.innerHTML = explanationHTML;
        }

        function toggleExplanation() {
            const explanationContainer = document.getElementById('explanation-container');
            const toggleBtn = document.getElementById('toggle-explanation-btn');
            const isHidden = explanationContainer.style.display === 'none';
            
            explanationContainer.style.display = isHidden ? 'block' : 'none';
            toggleBtn.textContent = isHidden ? 'Hide Explanation' : 'Show Explanation';
        }
        
        function showResults() {
            if (timerInterval) clearInterval(timerInterval);
            
            let resultsHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="quiz-header"><h1>Quiz Results</h1></div>
                <div id="quiz-body">
                    <div class="results-summary">
                        <h2>Your final score is ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)</h2>
                    </div>
                    <div class="results-list">
            `;

            userAnswers.forEach((answer, index) => {
                const question = answer.question;
                resultsHTML += `
                    <div class="result-item">
                        <p class="result-question">${index + 1}. ${question.question}</p>
                        <ul class="result-options">
                `;
                for(const key in question.options) {
                    let className = 'result-option';
                    const correctAnswer = question.answer;
                    const isCorrectAnswer = Array.isArray(correctAnswer) ? correctAnswer.includes(key) : key === correctAnswer;
                    
                    if (isCorrectAnswer) {
                        className += ' correct-answer';
                    } else if (key === answer.userAnswer && !answer.isCorrect) {
                        className += ' incorrect-answer';
                    }
                    resultsHTML += `<li class="${className}">${key}. ${question.options[key]}</li>`;
                }
                resultsHTML += `
                        </ul>
                        <div class="result-explanation">
                            <p><strong>Explanation:</strong> ${question.explanation[question.answer[0]]}</p>
                        </div>
                    </div>
                `;
            });

            resultsHTML += `</div></div>`;
            quizContainerEl.innerHTML = resultsHTML;
        }
        
        showSetupScreen();
    </script>
</body>
</html>

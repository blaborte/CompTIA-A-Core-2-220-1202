<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA A+ Core 2 Flashcard Drill</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a8dadc 0%, #457b9d 100%);
            overflow: hidden;
            padding: 40px 20px;
            color: #fff;
            /* DEBUG FIX: Added text-shadow for global readability */
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.7; }
        .shape-1 { width: 300px; height: 300px; top: 10%; left: 15%; background: linear-gradient(to right, #e63946, #f1faee); }
        .shape-2 { width: 400px; height: 400px; bottom: 5%; right: 10%; background: linear-gradient(to right, #457b9d, #a8dadc); }

        .main-wrapper {
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .header-section h1 {
            font-size: 2em;
            margin-bottom: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .header-section p { font-weight: 300; margin-bottom: 20px; }

        .flashcard-container {
            perspective: 1200px;
            width: 100%;
            height: 400px;
            margin: 30px 0;
        }
        .flashcard {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            cursor: pointer;
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }

        .flashcard-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 40px; border-radius: 16px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .flashcard-front { font-size: 2.2em; font-weight: 700; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .flashcard-back {
            background: #f1faee;
            color: #1d3557;
            transform: rotateY(180deg);
            font-size: 1.2em;
            text-shadow: none; /* Text is on a solid background, no shadow needed */
        }
        .flashcard-back h3 { font-size: 1.6em; margin-bottom: 15px; color: #1d3557; }

        .controls {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }
        .control-button {
            padding: 12px 25px; border: none; border-radius: 50px; background: #e63946;
            color: #fff; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            text-shadow: none; /* Solid background, no shadow needed */
        }
        .control-button:hover:not(:disabled) {
            background: #457b9d; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }
        .control-button:disabled { background-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); cursor: not-allowed; }
        .progress-text { font-weight: 500; font-size: 1.1em; }

        .home-link {
            display: inline-block;
            margin-top: 30px;
            color: #fff;
            text-decoration: none;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .home-link:hover { color: #457b9d; background: #f1faee; text-shadow: none; }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="main-wrapper">
        <div class="header-section">
            <h1>A+ Core 2 Terminology Drill</h1>
            <p>Click the card to reveal the definition. Use the navigation buttons to track your progress.</p>
        </div>

        <div class="flashcard-container">
            <div id="flashcard" class="flashcard">
                <div id="card-front" class="flashcard-face flashcard-front">Loading Term...</div>
                <div id="card-back" class="flashcard-face flashcard-back"><h3>Definition</h3><p>Loading definition...</p></div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" class="control-button" disabled>← Previous</button>
            <span id="progress-indicator" class="progress-text">Card 1 of N</span>
            <button id="next-btn" class="control-button">Next →</button>
        </div>
        
        <a href="index.html" class="home-link">🏠 EXIT SIMULATION</a>
    </div>

    <script>
        const flashcardsData = [
            // Domain 1: Operating Systems (20 cards)
            { term: "chkdsk /r", definition: "Windows command that locates bad sectors on a disk and attempts to recover readable information (implies /f). Requires a restart." },
            { term: "SFC /scannow", definition: "System File Checker. A Windows command that scans integrity of all protected system files and replaces incorrect versions with correct Microsoft versions." },
            { term: "Diskpart", definition: "A Windows command-line utility used to manage disks, partitions, and volumes." },
            { term: "Task Manager", definition: "Utility used in Windows to view running processes, performance data (CPU, memory, disk), and manage system resources." },
            { term: "Device Manager", definition: "A Microsoft Management Console (MMC) snap-in used to view and control the hardware attached to the computer." },
            { term: "Event Viewer", definition: "Utility used to view logs about system events, including security, application, and system issues." },
            { term: "MMC", definition: "Microsoft Management Console. Provides a common framework for administrative tools (snap-ins) in Windows." },
            { term: "Msconfig", definition: "System Configuration utility in Windows used to manage boot options, services, and startup items." },
            { term: "Regedit", definition: "The Windows Registry Editor, a utility used to view and edit the Windows registry." },
            { term: "Ping", definition: "Command-line tool to test connectivity between two hosts on an IP network." },
            { term: "ipconfig /all", definition: "Windows command to display full TCP/IP configuration details, including DHCP server, DNS server, and MAC address." },
            { term: "net use", definition: "Windows command to connect or disconnect from a shared resource (like a network drive)." },
            { term: "net user", definition: "Windows command to view, add, or delete user accounts and change passwords." },
            { term: "ls -l", definition: "Linux/macOS command to display a long listing of files, showing permissions, owner, and size." },
            { term: "chmod", definition: "Linux command used to change the permissions (read, write, execute) of a file or directory." },
            { term: "grep", definition: "Linux/macOS command-line utility for searching plain-text data sets for lines matching a regular expression." },
            { term: "mv", definition: "Linux/macOS command to move or rename a file or directory." },
            { term: "SaaS (Software as a Service)", definition: "Cloud service model where a complete, managed application is delivered over the internet (e.g., Gmail, Office 365)." },
            { term: "IaaS (Infrastructure as a Service)", definition: "Cloud service model providing only the bare metal resources (VMs, storage, network) for the user to manage the OS and apps." },
            { term: "PaaS (Platform as a Service)", definition: "Cloud service model providing a development environment (OS, runtime, databases) for deploying apps without managing the underlying hardware." },
            
            // Domain 2: Security (10 cards)
            { term: "WPA3", definition: "The current, most secure Wi-Fi security protocol, replacing WPA2, offering enhanced encryption and protection against dictionary attacks." },
            { term: "Phishing", definition: "A social engineering attack where an attacker attempts to fraudulently obtain sensitive information by disguising as a trustworthy entity." },
            { term: "Zero-day attack", definition: "An attack that exploits a previously unknown software vulnerability for which a patch is not yet available." },
            { term: "Ransomware", definition: "Malicious software that encrypts a user's files and demands a ransom (usually cryptocurrency) for the decryption key." },
            { term: "Tailgating", definition: "A physical security attack where an unauthorized person follows an authorized person into a secured area." },
            { term: "Shoulder Surfing", definition: "Gaining information by looking over someone's shoulder as they enter sensitive data." },
            { term: "DLP (Data Loss Prevention)", definition: "A set of tools and processes used to ensure that sensitive data is not lost, misused, or accessed by unauthorized users." },
            { term: "MFA (Multi-Factor Authentication)", definition: "An authentication method requiring two or more verification factors to grant access (e.g., password + fingerprint)." },
            { term: "VPN (Virtual Private Network)", definition: "A secure tunnel over a public network (like the Internet) that encrypts data and hides the user's IP address." },
            { term: "BIOS Password", definition: "A password required to access the BIOS/UEFI firmware setup before the OS even loads." },

            // Domain 3: Software Troubleshooting (10 cards)
            { term: "Malware Removal Process Step 1", definition: "Identify and research malware symptoms." },
            { term: "Malware Removal Process Step 2", definition: "Quarantine the infected system." },
            { term: "Malware Removal Process Step 3", definition: "Disable System Restore (in Windows) and schedule scans." },
            { term: "Malware Removal Process Step 4", definition: "Remediate the infected system (update, scan, removal)." },
            { term: "Malware Removal Process Step 5", definition: "Enable System Restore and create a new restore point." },
            { term: "Malware Removal Process Step 6", "definition": "Educate the end user." },
            { term: "BSOD (Blue Screen of Death)", definition: "A full-screen error message in Windows indicating a critical system crash (Stop Error)." },
            { term: "Safe Mode", definition: "A Windows diagnostic startup mode that loads the OS with only a minimal set of drivers and services." },
            { term: "Command: 'dism'", definition: "Deployment Image Servicing and Management. Windows command-line tool used to service a Windows image, including system repair." },
            { term: "Command: 'tracert'", definition: "Windows command to display the path (hops) and measure transit delays of packets across an IP network." },

            // Domain 4: Operational Procedures (10 cards)
            { term: "EULA", definition: "End-User License Agreement. The contract governing the use of software." },
            { term: "Change Management", definition: "Formalized process for making modifications to an IT system to minimize risk (e.g., planning, approval, documentation)." },
            { term: "DRP (Disaster Recovery Plan)", definition: "A documented set of procedures to recover and protect a business IT infrastructure after a major disaster." },
            { term: "Backup: Full", definition: "Copies all selected files. Fastest to restore, slowest to backup. Resets the archive bit." },
            { term: "Backup: Differential", definition: "Copies all files changed since the *last full* backup. Does not reset the archive bit." },
            { term: "Backup: Incremental", definition: "Copies all files changed since the *last full or incremental* backup. Resets the archive bit." },
            { term: "AUP (Acceptable Use Policy)", definition: "Document outlining rules for how an organization's resources (internet, email, computers) should be used." },
            { term: "PII (Personally Identifiable Information)", definition: "Information that can be used to distinguish or trace an individual's identity (e.g., name, SSN, biometric data)." },
            { term: "Communication: Tone", definition: "The attitude conveyed in communication, which should remain positive, non-judgemental, and professional during technical support." },
            { term: "Communication: Etiquette", definition: "The customary code of polite behavior in a technical support setting (e.g., active listening, managing expectations, avoiding jargon)." }
        ];

        let currentCardIndex = 0;
        const flashcardEl = document.getElementById('flashcard');
        const cardFrontEl = document.getElementById('card-front');
        const cardBackEl = document.getElementById('card-back');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressIndicator = document.getElementById('progress-indicator');

        function updateCard() {
            const card = flashcardsData[currentCardIndex];
            
            // Set the content
            cardFrontEl.textContent = card.term;
            cardBackEl.innerHTML = `<h3>${card.term}</h3><p>${card.definition}</p>`;
            
            // Reset the flip state
            flashcardEl.classList.remove('is-flipped');
            
            // Update the buttons and progress
            prevBtn.disabled = currentCardIndex === 0;
            nextBtn.disabled = currentCardIndex === flashcardsData.length - 1;
            progressIndicator.textContent = `Card ${currentCardIndex + 1} of ${flashcardsData.length}`;
        }

        // Event Listener to flip the card
        flashcardEl.addEventListener('click', () => {
            flashcardEl.classList.toggle('is-flipped');
        });

        // Navigation controls
        nextBtn.addEventListener('click', () => {
            if (currentCardIndex < flashcardsData.length - 1) {
                currentCardIndex++;
                updateCard();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCard();
            }
        });

        // Initial Load
        document.addEventListener('DOMContentLoaded', updateCard);
    </script>
</body>
</html>

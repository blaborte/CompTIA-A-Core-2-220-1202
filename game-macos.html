<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Feature Match | A+ Core 2 Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #a8dadc 0%, #457b9d 100%);
            overflow: hidden; padding: 20px; color: #fff;
            /* DEBUG FIX: Added text-shadow for global readability */
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.7; }
        .shape-1 { width: 300px; height: 300px; top: 10%; left: 15%; background: linear-gradient(to right, #e63946, #f1faee); }
        .shape-2 { width: 400px; height: 400px; bottom: 5%; right: 10%; background: linear-gradient(to right, #457b9d, #a8dadc); }

        #game-container {
            width: 90%; max-width: 800px; padding: 40px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        h1 { margin: 0 0 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .game-area { display: flex; justify-content: space-between; gap: 20px; }
        #descriptions-container, #options-container { width: 48%; }
        #descriptions-container h3, #options-container h3 { color: rgba(255,255,255,0.8); margin-bottom: 15px; font-weight: 500; }

        .description-box {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 8px; padding: 20px; margin-bottom: 15px; text-align: left;
            min-height: 120px;
        }
        .feature-option {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
            font-weight: 500; cursor: grab;
        }
        .feature-option:active { cursor: grabbing; }
        .dragging { opacity: 0.5; }
        .drag-over { border-style: solid; background-color: rgba(255, 255, 255, 0.2); }
        
        #feedback { font-size: 1.2em; font-weight: 700; margin-top: 20px; height: 30px; }
        .correct { color: #28a745; text-shadow: 0 0 5px #28a745; }
        .incorrect { color: #e63946; text-shadow: 0 0 5px #e63946; }

        #score-display { font-size: 1.2em; margin-top: 15px; color: #f1faee; opacity: 0.8; }
        .home-link {
            display: inline-block; margin-top: 25px; color: #fff; text-decoration: none; font-weight: 500;
            padding: 5px 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .home-link:hover { color: #457b9d; background: #f1faee; text-shadow: none; }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div id="game-container">
        <h1>macOS Feature Match</h1>
        <div class="game-area">
            <div id="descriptions-container">
                <h3>DESCRIPTIONS</h3>
            </div>
            <div id="options-container">
                <h3>FEATURES</h3>
            </div>
        </div>
        <div id="feedback"></div>
        <div id="score-display">Score: 0</div>
    </div>
    <a href="index.html" class="home-link">&larr; Back to Main Menu</a>

    <script>
        const features = [
            { id: 'time-machine', name: 'Time Machine', description: 'Creates incremental backups of files, allowing the user to restore their Mac to any point in the past.' },
            { id: 'spotlight', name: 'Spotlight', description: 'A system-wide search feature that finds files, apps, emails, and other content on the Mac.' },
            { id: 'filevault', name: 'FileVault', description: 'Provides full-disk encryption for the startup volume to protect data at rest.' },
            { id: 'keychain', name: 'Keychain', description: 'A secure password management system that stores passwords, certificates, and other sensitive information.' },
            { id: 'disk-utility', name: 'Disk Utility', description: 'A tool for managing hard drives and storage volumes, including formatting, partitioning, and repairing disks.' }
        ];

        let score = 0;
        let matchedCount = 0;

        const descriptionsContainer = document.getElementById('descriptions-container');
        const optionsContainer = document.getElementById('options-container');
        const scoreDisplay = document.getElementById('score-display');
        const feedback = document.getElementById('feedback');

        function initializeGame() {
            const shuffledFeatures = [...features].sort(() => 0.5 - Math.random());
            const shuffledDescriptions = [...features].sort(() => 0.5 - Math.random());

            shuffledDescriptions.forEach(item => {
                const descBox = document.createElement('div');
                descBox.classList.add('description-box');
                descBox.dataset.id = item.id;
                descBox.textContent = item.description;
                
                descBox.addEventListener('dragover', e => e.preventDefault());
                descBox.addEventListener('dragenter', () => descBox.classList.add('drag-over'));
                descBox.addEventListener('dragleave', () => descBox.classList.remove('drag-over'));
                descBox.addEventListener('drop', handleDrop);

                descriptionsContainer.appendChild(descBox);
            });

            shuffledFeatures.forEach(item => {
                const option = document.createElement('div');
                option.classList.add('feature-option');
                option.id = item.id;
                option.textContent = item.name;
                option.draggable = true;

                option.addEventListener('dragstart', handleDragStart);
                option.addEventListener('dragend', handleDragEnd);

                optionsContainer.appendChild(option);
            });
        }
        
        function handleDragStart(e) {
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', e.target.id);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }
        
        function handleDrop(e) {
            e.preventDefault();
            const droppedFeatureId = e.dataTransfer.getData('text/plain');
            const targetDescriptionId = e.target.dataset.id;
            
            e.target.classList.remove('drag-over');
            
            const featureElement = document.getElementById(droppedFeatureId);

            if (droppedFeatureId === targetDescriptionId) {
                // Correct match
                score++;
                matchedCount++;
                feedback.textContent = "Correct Match!";
                feedback.className = 'correct';
                
                e.target.style.border = `2px solid #28a745`;
                e.target.style.background = 'rgba(40, 167, 69, 0.3)';
                featureElement.style.display = 'none'; // Hide the dragged element
            } else {
                // Incorrect match
                feedback.textContent = "Incorrect, try again!";
                feedback.className = 'incorrect';
            }
            
            scoreDisplay.textContent = `Score: ${score}`;
            
            if (matchedCount === features.length) {
                endGame();
            }
        }
        
        function endGame() {
            feedback.textContent = `All matched! Final Score: ${score}/${features.length}`;
            feedback.className = 'correct';
        }

        initializeGame();
    </script>
</body>
</html>

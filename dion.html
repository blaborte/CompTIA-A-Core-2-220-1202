            {"id": "D63", "question": "Which of the following commands is used on a Linux system to safely turn off a server?", "options": {"A": "kill", "B": "rm", "C": "shutdown", "D": "ps"}, "answer": "C", "explanation": {"correct": "C. shutdown", "A": "Incorrect. The 'kill' command sends a signal to specified processes or process groups, typically to terminate them.", "B": "Incorrect. The 'rm' command is a command-line utility for removing (deleting) files or directories.", "C": "Correct. The 'shutdown' command brings the system down in a secure way, notifying all logged-in users and processes that the system is going down and disallowing further logins.", "D": "Incorrect. The 'ps' command is used to list the currently running processes."}},
            {"id": "D64", "question": "(This is a simulated Performance-Based Question. If this was the real certification exam, you would be asked to drag-and-drop the correct encryption onto the APs.) Your company has purchased a new office building down the street for its executive suites. You have been asked to choose the BEST encryption for AP1, AP2, and AP3 to establish a wireless connection inside the main building for visitors to use. Your boss has stated that the main building's internal wireless network is only going to be used by visitors and should not require the visitors to set up any special configuration on their devices to connect.Which of the following is the BEST encryption to use from the options below to meet your manager's requirements for the new visitors' Wireless Network?", "options": {"A": "Open", "B": "WEP", "C": "WPA", "D": "WPA-CCMP", "E": "WPA2-TKIP"}, "answer": "A", "explanation": {"correct": "A. Open", "A": "Correct. Since your manager has required that the visitors not be required to configure anything on their devices to connect, the only option you can choose is Open. This option requires no password or setup on the user's devices.", "B": "Incorrect. WEP requires a password and setup.", "C": "Incorrect. WPA requires a password and setup.", "D": "Incorrect. WPA-CCMP requires a password and setup.", "E": "Incorrect. WPA2-TKIP requires a password and setup."}},
            {"id": "D65", "question": "A workstation was patched last night with the latest operating system security update. This morning, the workstation only displays a blank screen. You restart the computer, but the operating system fails to load. What is the NEXT step you should attempt to boot this workstation?", "options": {"A": "Reboot the workstation into safe mode, open RegEdit, and repair the Windows Registry", "B": "Reboot the workstation into safe mode and disable Windows services/applications", "C": "Reboot the workstation into the BIOS and reconfigure boot options", "D": "Reboot the workstation into safe mode and roll back the recent security update"}, "answer": "D", "explanation": {"correct": "D. Reboot the workstation into safe mode and roll back the recent security update", "A": "Incorrect. Repairing the registry is a complex and highly risky step that should only be attempted as a last resort.", "B": "Incorrect. While disabling services can help with slow boots, the system is failing to load the OS completely, indicating a more fundamental issue than a service conflict.", "C": "Incorrect. The issue began after a security update, making a BIOS change unlikely to be the first step.", "D": "Correct. Since the system failed to load after a security update, the most likely cause is a bad patch. The next step should be to boot into Safe Mode and roll back the most recent security update to return the system to its last working state."}},
            {"id": "D66", "question": "Susan is installing several updates on a Windows computer. Nine of the updates were installed without any issues, but one update produced an error and failed to install. Susan restarts the computer as part of the troubleshooting process, and the computer automatically attempts to install the failed update again. Again, the update fails to install. What should Susan do NEXT?", "options": {"A": "Research the error number for the failed update and determine if there is a known issue with this update", "B": "Manually download and install the failed update", "C": "Download the update from a third-party website like Source Forge and install it", "D": "Review the Event Viewer to determine the cause of the failure and address the findings"}, "answer": "A", "explanation": {"correct": "A. Research the error number for the failed update and determine if there is a known issue with this update", "A": "Correct. If an automated system update fails to install, the most appropriate next step is to research the error number to determine if the issue is a known error or if it provides a specific remediation step (like inadequate hard disk space) that needs to be addressed.", "B": "Incorrect. Manually downloading and installing the failed update is generally the third step (after researching the error) in the process, as the error may still occur if the root cause is not fixed.", "C": "Incorrect. Downloading a system update from a third-party website is a significant security risk.", "D": "Incorrect. Reviewing the Event Viewer is an action that precedes the remediation but is not the most efficient step here, as the specific error code is already available."}},
            {"id": "D67", "question": "Employees frequently access confidential company information through web-based applications. To increase security, IT recommends disabling certain browser features. Which browser feature would be most appropriate to disable for enhanced security?", "options": {"A": "Automatic clearing of browsing history after each session.", "B": "Automatic updates for the browser to avoid unexpected changes.", "C": "Browser pop-up blocker to allow all necessary notifications.", "D": "JavaScript execution to limit potential script-based attacks."}, "answer": "D", "explanation": {"correct": "D. JavaScript execution to limit potential script-based attacks.", "A": "Incorrect. Clearing history enhances privacy but does not prevent script-based security threats.", "B": "Incorrect. Disabling automatic updates negatively impacts security because browsers require updates to patch vulnerabilities.", "C": "Incorrect. Disabling pop-up blockers reduces security by allowing disruptive ads and potentially harmful content.", "D": "Correct. Disabling JavaScript execution reduces the risk of script-based attacks (like XSS), effectively protecting confidential data from malicious code that might run in the browser."}},
            {"id": "D68", "question": "A user reports frequent security warnings from outdated antivirus software. What should be done to resolve this?", "options": {"A": "Uninstall and reinstall the antivirus software to reset warnings.", "B": "Disable security alerts to prevent further notifications.", "C": "Enable automatic updates to keep virus definitions current.", "D": "Run a manual scan and ignore update notifications."}, "answer": "C", "explanation": {"correct": "C. Enable automatic updates to keep virus definitions current.", "A": "Incorrect. Reinstalling software may reset settings but does not address the need for updated definitions.", "B": "Incorrect. Disabling security alerts removes notifications but does not fix the underlying issue of outdated definitions.", "C": "Correct. Automatic updates ensure the antivirus program receives the latest threat definitions, maintaining protection against new malware and resolving the 'outdated' status that triggers the warnings.", "D": "Incorrect. Running a manual scan without updating leaves the system vulnerable to new threats."}},
            {"id": "D69", "question": "Which of the following features is UNIQUE to the NTFS file system when compared to FAT32?", "options": {"A": "Case-sensitive file naming", "B": "Lack of file permission settings", "C": "Support for files larger than 4GB", "D": "Compatibility with all major operating systems"}, "answer": "C", "explanation": {"correct": "C. Support for files larger than 4GB", "A": "Incorrect. While NTFS supports case-sensitive file naming, other file systems (such as ext4) also support it, so it is not unique to NTFS.", "B": "Incorrect. NTFS *has* file permission settings, whereas FAT32 *lacks* them.", "C": "Correct. NTFS supports files larger than 4GB, which is a key limitation of FAT32 (a maximum file size of 4GB).", "D": "Incorrect. NTFS is not fully compatible with macOS and Linux without additional software or drivers."}},
            {"id": "D70", "question": "A customer brought in a computer that has been infected with a virus. Since the infection, the computer began redirecting all three of the system's web browsers to a series of malicious websites whenever a valid website is requested. You quarantined the system, disabled the system restore, and then perform the remediation to remove the malware. You have scanned the machine with several anti-virus and anti-malware programs and determined it is now cleaned of all malware. You attempt to test the web browsers again, but a small number of valid websites are still being redirected to a malicious website. Luckily, the updated anti-virus you installed blocked any new malware from infecting the system. Which of the following actions should you perform NEXT to fix the redirection issue with the browsers?", "options": {"A": "Install a secondary anti-malware solution on the system", "B": "Reformat the system and reinstall the OS", "C": "Perform a System Restore to an earlier date before the infection", "D": "Verify the hosts.ini file has not been maliciously modified"}, "answer": "D", "explanation": {"correct": "D. Verify the hosts.ini file has not been maliciously modified", "A": "Incorrect. A secondary anti-malware solution is a good idea but will not resolve the specific redirection issue.", "B": "Incorrect. Reformatting the system is a last resort and is unnecessary if a more targeted fix is available.", "C": "Incorrect. System Restore was disabled, and performing a restore would likely reinfect the system with malware from the restore point.", "D": "Correct. If redirection occurs for a small number of sites or occurs in all web browsers on a system, it is most likely a maliciously modified hosts.ini file, which acts as a local DNS server and can redirect a system's internet connection."}},
            {"id": "D71", "question": "You are working as a technician where your organization has received approval to migrate its email services to a new cloud provider. The IT team has created a detailed plan, including a rollback strategy, communication with end users, and scheduled downtime. They are now ready to execute the migration according to the approved change management process. Which of the following would BEST describe this phase of change management?", "options": {"A": "Risk assessment", "B": "Post-change review", "C": "Implementation", "D": "Change freeze"}, "answer": "C", "explanation": {"correct": "C. Implementation", "A": "Incorrect. Risk assessment is part of the initial planning phase.", "B": "Incorrect. Post-change review occurs after the change is complete to evaluate its success.", "C": "Correct. Implementation is the phase in the change management process where an approved change is executed according to the defined plan, which is what 'ready to execute the migration' describes.", "D": "Incorrect. A change freeze is a restriction on changes during critical periods."}},
            {"id": "D72", "question": "You have decided to have DNA genetic testing and analysis performed to determine your exact ancestry composition and possibly find some lost relatives through their database. Which of the following types of data should this be classified?", "options": {"A": "CUI", "B": "PII", "C": "IP", "D": "PHI"}, "answer": "D", "explanation": {"correct": "D. PHI", "A": "Incorrect. Controlled Unclassified Information (CUI) is federal non-classified government information.", "B": "Incorrect. Personally identifiable information (PII) is data that can be used to identify, contact, or locate an individual (name, SSN, etc.).", "C": "Incorrect. Intellectual property (IP) is information created and owned by the company.", "D": "Correct. Protected health information (PHI) refers to medical and insurance records, plus associated hospital and laboratory test results. Data collected by genetic mapping and heredity companies includes the subject's DNA, making it PHI."}},
            {"id": "D73", "question": "You are working on a Windows 10 workstation with a 1 TB HDD and 16 GB of memory that is operating slowly when reading large files from its storage device. Which of the following commands should you use to speed up this workstation?", "options": {"A": "ipconfig", "B": "format", "C": "chkdsk", "D": "diskpart"}, "answer": "C", "explanation": {"correct": "C. chkdsk", "A": "Incorrect. The 'ipconfig' tool displays all current TCP/IP network configuration values.", "B": "Incorrect. The 'format' command creates a new root directory and file system for the disk, deleting all data.", "C": "Correct. The 'chkdsk' command is used to check the file system and file system metadata of a volume for logical and physical errors. Using parameters like '/f', '/r', '/x', or '/b' to fix errors is essential for resolving performance issues related to file system integrity on a hard disk drive (HDD).", "D": "Incorrect. The 'diskpart' command is a command-line disk-partitioning utility."}},
            {"id": "D74", "question": "Which of the following authentication protocols was developed by Cisco to provide authentication, authorization, and accounting services?", "options": {"A": "CHAP", "B": "RADIUS", "C": "TACACS+", "D": "Kerberos"}, "answer": "C", "explanation": {"correct": "C. TACACS+", "A": "Incorrect. Challenge-Handshake Authentication Protocol (CHAP) is an authentication protocol but does not provide authorization or accounting services.", "B": "Incorrect. Remote Authentication Dial-In User Service (RADIUS) provides AAA management but was not developed by Cisco.", "C": "Correct. TACACS+ (Terminal Access Controller Access-Control System Plus) is an extension to TACACS and was developed as a proprietary protocol by Cisco to provide centralized Authentication, Authorization, and Accounting (AAA) services.", "D": "Incorrect. Kerberos is a network authentication protocol developed by MIT."}},
            {"id": "D75", "question": "Your IT administrator has proposed a new method for deploying security patches to company servers. Before the change is approved, another senior administrator is assigned to review the plan to ensure it follows best practices, minimizes risks, and aligns with company policies. Which of the following would BEST describe this step in the change management process?", "options": {"A": "Standard change", "B": "Change freeze", "C": "Implementation", "D": "Peer review"}, "answer": "D", "explanation": {"correct": "D. Peer review", "A": "Incorrect. Standard changes are low-risk, routine modifications that follow an established process.", "B": "Incorrect. A change freeze is a temporary halt on modifications.", "C": "Incorrect. Implementation refers to executing an approved change.", "D": "Correct. Peer review is the step in the change management process where another knowledgeable team member reviews a proposed change (patch deployment plan) before approval to ensure it meets best practices, minimizes risks, and aligns with company policies."}},
            {"id": "D76", "question": "Which of the following features is supported by Kerberos but not by RADIUS?", "options": {"A": "Services for authentication", "B": "Single sign-on capability", "C": "XML for cross-platform interoperability", "D": "Tickets used to identify authenticated users"}, "answer": "D", "explanation": {"correct": "D. Tickets used to identify authenticated users", "A": "Incorrect. Both Kerberos and RADIUS provide services for authentication.", "B": "Incorrect. Both Kerberos and RADIUS can be part of a Single Sign-On (SSO) solution.", "C": "Incorrect. While RADIUS can use XML, this is not a core differentiating feature for Kerberos.", "D": "Correct. Kerberos uses a system of 'tickets' to allow nodes to communicate over a non-secure network and securely prove their identity. RADIUS does not use tickets in this manner."}},
            {"id": "D77", "question": "Which type of malware is used to actively attempt to steal confidential information by capturing a user's data when typed into a web browser or other application?", "options": {"A": "Spyware", "B": "Rootkit", "C": "Trojan", "D": "Keylogger"}, "answer": "D", "explanation": {"correct": "D. Keylogger", "A": "Incorrect. Spyware is a program that monitors user activity and sends the information to someone else.", "B": "Incorrect. A rootkit is designed to provide continued privileged access while actively hiding its presence.", "C": "Incorrect. A trojan is malware disguised as legitimate software that can take control of your computer.", "D": "Correct. A keylogger actively attempts to steal confidential information by capturing keystrokes (a user's data when typed) entered into a web browser or other application. This is a specific function of some malware."}},
            {"id": "D78", "question": "Jason's company issued him an old 2018 laptop with an internal hardware security key that he uses to connect to his office network over a VPN while traveling. Without this laptop, Jason cannot access his company's internal servers, email, or share drive files. The Windows 10 laptop is extremely slow, and the screen recently cracked and needs to be replaced. When Jason returns to the company's headquarters, the company will provide him with a new laptop due to the broken screen. Until then, he is working out of his hotel room during a 45-day business trip and needs to continue using this laptop. Jason brings the laptop to the computer store you work at and asks for your assistance. Which of the following do you recommend?", "options": {"A": "Replace the display and contact the manufacturer for reimbursement", "B": "Replace the display and charge him for the parts/installation", "C": "Sell him an external 15\" tablet/monitor to connect to the laptop as a workaround", "D": "Purchase a new laptop as the cost to repair might be more than a new laptop"}, "answer": "C", "explanation": {"correct": "C. Sell him an external 15\" tablet/monitor to connect to the laptop as a workaround", "A": "Incorrect. The laptop is outside of the warranty period, making the recommendation of being reimbursed by the manufacturer incorrect.", "B": "Incorrect. This would likely be more expensive than a simple workaround.", "C": "Correct. Since the laptop has an internal hardware security key required for VPN access, it cannot be easily replaced. The quickest, cheapest, and best workaround until he returns to the office for a new corporate laptop is to purchase an external monitor to bypass the cracked screen issue.", "D": "Incorrect. A new laptop would not have the internal hardware security key required for VPN access."}},
            {"id": "D79", "question": "Which command-line entry would be used on a Windows system to test if your system can reach diontraining.com?", "options": {"A": "ping diontraining.com", "B": "ipconfig diontraining.com", "C": "net use diontraining.com", "D": "sfc diontraining.com"}, "answer": "A", "explanation": {"correct": "A. ping diontraining.com", "A": "Correct. The 'ping' command is used to test a host's reachability on an Internet Protocol network by sending a series of ICMP packets to the specified host (like diontraining.com).", "B": "Incorrect. The 'ipconfig' tool displays all current TCP/IP network configuration values on a given system.", "C": "Incorrect. The 'net use' command is used to connect to, remove, and configure connections to shared resources such as mapped drives and network printers.", "D": "Incorrect. The 'sfc' (System File Checker) command is a utility in Windows that allows users to scan for and restore corrupted Windows system files."}},
            {"id": "D80", "question": "Your company wants to ensure that users cannot access USB mass storage devices. You have conducted some research online and found that if you modify the HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\UsbStor key, it will prevent USB storage devices from being used. Which of the following tools should you use to modify this key?", "options": {"A": "RegEdit", "B": "RDS", "C": "MSConfig", "D": "MMC"}, "answer": "A", "explanation": {"correct": "A. RegEdit", "A": "Correct. The registry editor (RegEdit) allows you to view and make changes to system files and programs in the Windows Registry, including modifying the 'UsbStor' key to disable USB storage devices.", "B": "Incorrect. Remote Desktop Services (RDS) is used to connect to a remote desktop session host server.", "C": "Incorrect. MSConfig is a system utility to troubleshoot the Microsoft Windows startup processes.", "D": "Incorrect. The Microsoft management console (MMC) is a utility that uses snap-ins for various Windows tools (like disk management, computer management) but is not used to directly edit the registry."}},
            {"id": "D81", "question": "Your company's IT department routinely deploys software updates to employee workstations every month. These updates follow a predefined approval process, pose minimal risk to system stability, and require no special authorization beyond the usual change request workflow. The IT manager wants to ensure these updates are properly categorized in the change management process to streamline approval and implementation. Which of the following would BEST describe this type of change?", "options": {"A": "Major change", "B": "Emergency change", "C": "Standard change", "D": "Normal change"}, "answer": "C", "explanation": {"correct": "C. Standard change", "A": "Incorrect. Major changes involve significant modifications that require extensive planning and approval.", "B": "Incorrect. Emergency changes are urgent and typically involve immediate fixes for critical issues.", "C": "Correct. A standard change is the best classification because it refers to routine, low-risk modifications (like monthly software updates) that follow an established process and do not require special approvals beyond the normal change management workflow.", "D": "Incorrect. A normal change involves a non-routine but planned modification that requires a full change management process."}},
            {"id": "D82", "question": "Dion Training just released a new corporate policy that dictates all access to network resources will be controlled based on the user's job functions and tasks within the organization. For example, only people working in Human Resources can access employee records, and only the people working in finance can access customer payment histories. Which of the following security concepts is BEST described by this new policy?", "options": {"A": "Acceptable use policy", "B": "Zero trust", "C": "Least privilege", "D": "Defense in depth"}, "answer": "C", "explanation": {"correct": "C. Least privilege", "A": "Incorrect. An acceptable use policy (AUP) is a set of rules that restrict how the network, website, or system may be used.", "B": "Incorrect. Zero trust is a security framework that requires all users to be authenticated, authorized, and continuously validated before being granted access.", "C": "Correct. Least privilege is the concept and practice of restricting access rights for users to only those resources absolutely required to perform routine, legitimate activities (i.e., access is controlled based on the user's job functions and tasks).", "D": "Incorrect. Defense in Depth is an approach to cybersecurity in which a series of defensive mechanisms are layered to protect valuable data and information."}},
            {"id": "D83", "question": "Eduardo is installing Windows 11 (64-bit) in a virtual machine on his macOS desktop. The installation is continually failing and producing an error. Eduardo has configured the virtual machine with a 2.2 GHz processor, 4 GB of memory, a 64 GB hard drive, and a 1280 x 720 screen resolution. Which item in the virtual machine should be increased to fix the installation issue experienced?", "options": {"A": "The screen resolution", "B": "Amount of hard drive space", "C": "Amount of memory", "D": "Number of CPU cores"}, "answer": "D", "explanation": {"correct": "D. Number of CPU cores", "A": "Incorrect. The screen resolution is sufficient (minimum is 720p).", "B": "Incorrect. The amount of hard drive space (64 GB) is the minimum requirement for Windows 11.", "C": "Incorrect. The amount of memory (4 GB) is the minimum requirement for Windows 11.", "D": "Correct. The minimum requirement for the Windows 11 (64-bit) operating system is a dual-core (2) processor. The virtual machine needs to be configured with at least two CPU cores, as one 2.2 GHz core is not sufficient."}},
            {"id": "D84", "question": "A company is integrating an AI-powered virtual assistant into its internal communication system. Employees will use it to process emails, analyze reports, and summarize meetings. The legal team expresses concern that sensitive business information may be accessible by external entities, depending on how the AI processes and stores its data. Which of the following would be the MOST important concern in this scenario?", "options": {"A": "User interface design", "B": "System update frequency", "C": "Data privacy", "D": "Software licensing terms"}, "answer": "C", "explanation": {"correct": "C. Data privacy", "A": "Incorrect. User interface design affects usability but not data confidentiality.", "B": "Incorrect. System update frequency ensures security patches are applied but does not address potential privacy risks in data handling by the AI model.", "C": "Correct. Data privacy is the most important concern because the AI assistant will be processing sensitive business information (emails, reports, meeting summaries), and the legal team is worried that this information may be accessible by external entities based on how the AI processes and stores its data.", "D": "Incorrect. Software licensing terms determine legal usage rights but do not protect sensitive information."}},
            {"id": "D85", "question": "Which low power mode is used with Windows 10 laptops to save power, but it takes longer to turn back on and resume where the user left off?", "options": {"A": "Power saver", "B": "Hibernate", "C": "Sleep", "D": "Balanced"}, "answer": "B", "explanation": {"correct": "B. Hibernate", "A": "Incorrect. Power saver is a power plan that favors energy savings over performance.", "B": "Correct. Hibernate mode is used to save the current session to the hard drive before powering off the computer to save battery life. Since it is loaded from the hard drive, the computer takes longer to start up again from hibernate mode than it does from sleep mode.", "C": "Incorrect. Sleep mode is used to save the current session to memory and put the computer into a minimal power state to save battery life. The computer starts up again faster from sleep mode than from hibernate mode.", "D": "Incorrect. Balanced is a power plan that adjusts the performance to conserve energy on capable hardware."}},
            {"id": "D86", "question": "A client contacts the service desk and complains that their smartphone is warm to the touch and their battery only lasts 4 hours a day, not the 10 hours advertised by your company. You ask them for the status of several settings: Email (never), Maps (always), Calendar (while using), Messages (while using), Photos (never), App Store (while using), Bank (while using), and Weather (while using). Based on the information provided, what should be changed to resolve this client's problem?", "options": {"A": "Change the Weather setting to always", "B": "Change the Email setting to while using", "C": "Change the App Store to never", "D": "Change the Maps setting to while using"}, "answer": "D", "explanation": {"correct": "D. Change the Maps setting to while using", "A": "Incorrect. The Weather setting is already set to 'while using' and does not need to be changed to 'always', as this would increase battery drain.", "B": "Incorrect. The Email setting is set to 'never', and changing it to 'while using' would increase battery drain when the app is open.", "C": "Incorrect. The App Store setting is set to 'while using' and is a good practice.", "D": "Correct. The Maps setting is set to 'always'. This means the app will continue to check the background's GPS location even if the smartphone is in standby mode. Since checking its location uses both the GPS receiver and the cellular modem to triangular its position, it can waste a lot of battery life. Changing it to 'while using' is the best solution."}},
            {"id": "D87", "question": "Which of the following commands is used on a Linux system to change a file's permissions or directory on a system?", "options": {"A": "passwd", "B": "chown", "C": "chmod", "D": "pwd"}, "answer": "C", "explanation": {"correct": "C. chmod", "A": "Incorrect. The 'passwd' command changes passwords for user accounts.", "B": "Incorrect. The 'chown' command is used to change the owner of the file, directory, or link.", "C": "Correct. The 'chmod' command sets the permissions (modes) of files or directories on a Linux system, which restricts the way a file can be accessed.", "D": "Incorrect. The 'pwd' command displays the present working directory (current directory) path to the terminal or display."}},
            {"id": "D88", "question": "A team is working on a shared spreadsheet to track inventory. Some employees report seeing different data than their coworkers. What is the most likely reason?", "options": {"A": "Cached data is being displayed instead of live updates.", "B": "Too many users editing has caused hidden updates.", "C": "A system reboot is needed for changes to sync.", "D": "The spreadsheet automatically created multiple versions."}, "answer": "A", "explanation": {"correct": "A. Cached data is being displayed instead of live updates.", "A": "Correct. If employees see different data in a shared, collaborative application, they may be viewing cached (older) information instead of the real-time updates from the server. A simple browser refresh usually resolves this issue.", "B": "Incorrect. Most collaboration tools allow many users, and hidden updates are not typical; the user's view is simply outdated.", "C": "Incorrect. Rebooting is unnecessary, as synchronization is handled by the application itself.", "D": "Incorrect. Cloud-based spreadsheets do not duplicate automatically; multiple versions would need to be created manually."}},
            {"id": "D89", "question": "Nicole's smartphone works fine when she is at work or the mall, but she has limited bandwidth on the device when she is in her apartment building. Nicole has asked you to help her. What is the FIRST step you should take in troubleshooting this issue?", "options": {"A": "Reset the data usage statistics on the smartphone", "B": "Update the smartphone's applications or OS", "C": "Reset the smartphone's wireless network settings", "D": "Verify the smartphone has adequate signal strength"}, "answer": "D", "explanation": {"correct": "D. Verify the smartphone has adequate signal strength", "A": "Incorrect. Resetting data usage statistics will not solve a bandwidth issue.", "B": "Incorrect. While updates are important, they are not the first step in troubleshooting a localized bandwidth issue.", "C": "Incorrect. Resetting wireless network settings would affect Wi-Fi, not the cellular network which is typically the cause of a localized bandwidth issue.", "D": "Correct. The FIRST step in troubleshooting limited bandwidth on a mobile device that works fine elsewhere is to verify the smartphone has adequate signal strength (cellular signal). Low signal strength in a specific location (like an apartment building) directly leads to significantly reduced bandwidth."}},
            {"id": "D90", "question": "Which of the following policies or plans would describe the access requirements for connecting a user's laptop to the corporate network?", "options": {"A": "Bring your own device policy", "B": "Password policy", "C": "Onboarding policy", "D": "Remote access policy"}, "answer": "D", "explanation": {"correct": "D. Remote access policy", "A": "Incorrect. A bring your own device (BYOD) policy allows employees to access enterprise networks using personal mobile devices, but it does not specifically outline the *access requirements* for connecting a user's laptop to the corporate network over a VPN.", "B": "Incorrect. A password policy is a set of rules for creating and using dependable, secure passwords.", "C": "Incorrect. An onboarding policy is a documented policy that describes all the requirements for integrating a new employee into the company and its cultures.", "D": "Correct. A remote access policy is a document that outlines and defines acceptable methods of remotely connecting to the internal network, including the specific access requirements for a user's laptop (e.g., VPN usage, security posture checks) to connect to corporate resources."}}
        ];

        // Global variables and the rest of the JavaScript functions...
        const quizContainerEl = document.getElementById('quiz-container');
        let quizData = []; 
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answerSubmitted = false;
        let timerInterval;

        function showSetupScreen() {
            quizContainerEl.innerHTML = `
                <div id="setup-screen">
                    <h2>Practice Exam Settings</h2>
                    <div class="setup-option">
                        <label for="num-questions">Number of Questions:</label>
                        <select id="num-questions">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="30">30</option>
                            <option value="all">All (${allQuizData.length})</option>
                        </select>
                    </div>
                    <div class="setup-option">
                        <label for="time-limit">Time Limit:</label>
                        <select id="time-limit">
                            <option value="untimed">Untimed</option>
                            <option value="15">15 Minutes</option>
                            <option value="30">30 Minutes</option>
                            <option value="60">60 Minutes</option>
                            <option value="90" selected>90 Minutes</option>
                        </select>
                    </div>
                    <button id="start-quiz-btn">Start Quiz</button>
                </div>
            `;
            document.getElementById('start-quiz-btn').addEventListener('click', initializeQuiz);
        }

        function initializeQuiz() {
            const numQuestions = document.getElementById('num-questions').value;
            const timeSelection = document.getElementById('time-limit').value;
            
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            
            const shuffled = [...allQuizData].sort(() => 0.5 - Math.random());
            quizData = numQuestions === 'all' ? shuffled : shuffled.slice(0, Number(numQuestions));

            renderQuizUI();
            
            if (timeSelection !== 'untimed') {
                startTimer(Number(timeSelection));
            }
        }
        
        function renderQuizUI() {
            quizContainerEl.innerHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="timer">--:--</div>
                <div id="quiz-header">
                    <h1>Dion Training CompTIA A+ Core 2 (220-1202) Practice Test</h1>
                    <p id="creator-tag">Created by: BLaborte (Data by Dion Training)</p>
                </div>
                <div id="quiz-body">
                    <p id="question-text"></p>
                    <ul id="options-list"></ul>
                    <div id="explanation-container" style="display: none;"></div>
                </div>
                <div id="quiz-footer">
                    <div id="score-text">Score: 0</div>
                    <div id="footer-buttons">
                        <button id="submit-btn">Submit Answer</button>
                    </div>
                </div>
            `;
            document.getElementById('submit-btn').addEventListener('click', checkAnswer);
            loadQuiz();
        }

        function startTimer(minutes) {
            let timeInSeconds = minutes * 60;
            const timerEl = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                const mins = Math.floor(timeInSeconds / 60);
                let secs = timeInSeconds % 60;
                secs = secs < 10 ? '0' + secs : secs;
                timerEl.textContent = `${mins}:${secs}`;
                if (timeInSeconds <= 0) { // Fix: Stop at 0 or below
                    clearInterval(timerInterval);
                    timerEl.textContent = "0:00";
                    if (!answerSubmitted) { // Only auto-submit if not already done
                        showResults();
                    }
                }
                timeInSeconds--;
            }, 1000);
        }

        function loadQuiz() {
            answerSubmitted = false;
            const currentQuestion = quizData[currentQuestionIndex];
            
            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
            const optionsListEl = document.getElementById('options-list');
            optionsListEl.innerHTML = ''; 

            for (const key in currentQuestion.options) {
                const option = document.createElement('li');
                option.classList.add('option');
                // Fix: Put radio inside label for better click target
                option.innerHTML = `<label for="${key}"><input type="radio" name="option" id="${key}" value="${key}">${key}. ${currentQuestion.options[key]}</label>`;
                optionsListEl.appendChild(option);
            }
            
            const explanationContainer = document.getElementById('explanation-container');
            if (explanationContainer) explanationContainer.style.display = 'none';

            document.getElementById('footer-buttons').innerHTML = '<button id="submit-btn">Submit Answer</button>';
            document.getElementById('submit-btn').addEventListener('click', checkAnswer);
        }

        function checkAnswer() {
            if (answerSubmitted) return;
            const selectedOptionInput = document.querySelector('input[name="option"]:checked');
            if (!selectedOptionInput) {
                alert('Please select an answer!');
                return;
            }
            answerSubmitted = true;
            const selectedAnswer = selectedOptionInput.value;
            const correctAnswer = quizData[currentQuestionIndex].answer;
            
            // Handle multi-select answers (for Q7)
            let isCorrect;
            if (Array.isArray(correctAnswer)) {
                const checkedOptions = Array.from(document.querySelectorAll('input[name="option"]:checked')).map(input => input.value);
                // Simple check for exact match of all correct answers selected
                isCorrect = correctAnswer.length === checkedOptions.length && 
                            correctAnswer.every(answer => checkedOptions.includes(answer));

                // Re-colorize logic for multi-select
                const options = document.querySelectorAll('.option');
                options.forEach(option => {
                    option.classList.add('no-click');
                    const input = option.querySelector('input');
                    const isSelected = checkedOptions.includes(input.value);
                    const isCorrectOption = correctAnswer.includes(input.value);

                    if (isCorrectOption) {
                        option.classList.add('correct');
                    } else if (isSelected && !isCorrectOption) {
                        option.classList.add('incorrect');
                    }
                });

            } else {
                // Single select answer logic
                isCorrect = selectedAnswer === correctAnswer;
                
                const options = document.querySelectorAll('.option');
                options.forEach(option => {
                    option.classList.add('no-click');
                    const input = option.querySelector('input');
                    if (input.value === correctAnswer) {
                        option.classList.add('correct');
                    } else if (input.value === selectedAnswer) {
                        option.classList.add('incorrect');
                    }
                });
            }

            userAnswers.push({ question: quizData[currentQuestionIndex], userAnswer: selectedAnswer, isCorrect: isCorrect });

            if (isCorrect) {
                score++;
            }
            document.getElementById('score-text').innerText = `Score: ${score}`;
            
            showExplanation();
            
            const footerButtons = document.getElementById('footer-buttons');
            let nextButtonHTML = '';
            if (currentQuestionIndex < quizData.length - 1) {
                nextButtonHTML = `<button id="next-btn">Next Question</button>`;
            } else {
                nextButtonHTML = `<button id="next-btn">Finish Quiz</button>`;
            }
            
            footerButtons.innerHTML = `<button id="toggle-explanation-btn">Show Explanation</button>${nextButtonHTML}`;
            
            document.getElementById('toggle-explanation-btn').addEventListener('click', toggleExplanation);
            document.getElementById('next-btn').addEventListener('click', () => {
                if (currentQuestionIndex < quizData.length - 1) {
                    currentQuestionIndex++;
                    loadQuiz();
                } else {
                    showResults();
                }
            });
        }

        function showExplanation() {
            const explanationData = quizData[currentQuestionIndex].explanation;
            let explanationContainer = document.getElementById('explanation-container');
            if (!explanationContainer) return;
            
            // Adjusted logic to display correct answer clearly
            let correctAnswerDisplay;
            if (Array.isArray(quizData[currentQuestionIndex].answer)) {
                const correctOptions = quizData[currentQuestionIndex].answer.map(key => `${key}`);
                correctAnswerDisplay = correctOptions.join(' & ');
            } else {
                correctAnswerDisplay = explanationData.correct;
            }

            let explanationHTML = `<div class="explanation-title">Correct Answer: ${correctAnswerDisplay}</div>`;
            explanationHTML += '<div class="explanation-text">';
            
            // Simplified explanation display for multi-option data structure
            const currentQuestion = quizData[currentQuestionIndex];
            for(const key in currentQuestion.explanation) {
                // Skip the special 'correct' key if it's not a narrative explanation
                if(key !== 'correct'){
                    explanationHTML += `<p><strong>${key.toUpperCase()}:</strong> ${currentQuestion.explanation[key]}</p>`;
                }
            }
            // Fallback for a single block of explanation text (like those from the original data)
            if (Object.keys(currentQuestion.explanation).length === 1 && currentQuestion.explanation.hasOwnProperty('correct')) {
                 explanationHTML += `<p>${currentQuestion.explanation.correct}</p>`;
            }

            explanationHTML += '</div>';

            explanationContainer.innerHTML = explanationHTML;
            explanationContainer.style.display = 'block'; // Ensure explanation is visible after submission
        }

        function toggleExplanation() {
            const explanationContainer = document.getElementById('explanation-container');
            const toggleBtn = document.getElementById('toggle-explanation-btn');
            const isHidden = explanationContainer.style.display === 'none';
            
            explanationContainer.style.display = isHidden ? 'block' : 'none';
            toggleBtn.textContent = isHidden ? 'Hide Explanation' : 'Show Explanation';
        }
        
        function showResults() {
            if (timerInterval) clearInterval(timerInterval);
            
            let resultsHTML = `
                <a href="index.html" class="home-link">&larr; Back to Home</a>
                <div id="quiz-header"><h1>Quiz Results</h1></div>
                <div id="quiz-body">
                    <div class="results-summary">
                        <h2>Your final score is ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)</h2>
                    </div>
                    <div class="results-list">
            `;

            userAnswers.forEach((answer, index) => {
                const question = answer.question;
                resultsHTML += `
                    <div class="result-item">
                        <p class="result-question">${index + 1}. ${question.question}</p>
                        <ul class="result-options">
                `;
                
                const isMultiSelect = Array.isArray(question.answer);
                const correctAnswers = isMultiSelect ? question.answer : [question.answer];
                const userAnswersSingleSelect = isMultiSelect ? answer.userAnswer : [answer.userAnswer];


                for(const key in question.options) {
                    let className = 'result-option';
                    const isCorrectAnswer = correctAnswers.includes(key);
                    let isUserSelection = isMultiSelect ? userAnswersSingleSelect.includes(key) : key === answer.userAnswer;
                    
                    if (isCorrectAnswer) {
                        className += ' correct-answer';
                    } else if (isUserSelection && !isCorrectAnswer) {
                        className += ' incorrect-answer';
                    }
                    resultsHTML += `<li class="${className}">${key}. ${question.options[key]}</li>`;
                }

                
                // Construct a simple explanation string from the structured explanation data
                let explanationText = "";
                if (question.explanation.A) { // Check for the structured format
                    for(const key in question.explanation) {
                        if (key !== 'correct' && question.explanation[key].startsWith("Correct")) {
                            explanationText = question.explanation[key];
                            break;
                        }
                    }
                } else if (question.explanation.correct) {
                    explanationText = question.explanation.correct; // Use the general feedback if structured answers are missing
                }
                
                
                resultsHTML += `
                        </ul>
                        <div class="result-explanation">
                            <p><strong>Explanation:</strong> ${explanationText}</p>
                        </div>
                    </div>
                `;
            });

            resultsHTML += `</div></div>`;
            quizContainerEl.innerHTML = resultsHTML;
        }
        
        showSetupScreen();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command-Line Challenge | A+ Core 2 Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #a8dadc 0%, #457b9d 100%);
            overflow: hidden; padding: 20px; color: #fff;
            /* DEBUG FIX: Added text-shadow for global readability */
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.7; }
        .shape-1 { width: 300px; height: 300px; top: 10%; left: 15%; background: linear-gradient(to right, #e63946, #f1faee); }
        .shape-2 { width: 400px; height: 400px; bottom: 5%; right: 10%; background: linear-gradient(to right, #457b9d, #a8dadc); }

        #game-container {
            width: 90%; max-width: 700px; padding: 40px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        h1 { margin: 0 0 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); color: #00aaff; /* Windows Accent */ }
        #task-prompt {
            padding: 20px; border-radius: 10px; margin-bottom: 25px; line-height: 1.6;
            text-align: left; background: rgba(0, 0, 0, 0.2);
        }
        .terminal {
            background: rgba(0, 0, 0, 0.3); padding: 20px; border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace; text-align: left;
        }
        .prompt-user { color: #f1faee; }
        #command-input { background: transparent; border: none; color: #f1faee; font-family: inherit; font-size: 1em; width: 70%; text-shadow: none; }
        #command-input:focus { outline: none; }
        
        #feedback { font-size: 1.2em; font-weight: 700; margin-top: 20px; height: 30px; }
        .correct { color: #28a745; text-shadow: 0 0 5px #28a745; }
        .incorrect { color: #e63946; text-shadow: 0 0 5px #e63946; }
        #score-display, #timer-display { font-size: 1.2em; margin-top: 15px; color: #f1faee; opacity: 0.8; }
        .home-link {
            display: inline-block; margin-top: 25px; color: #fff; text-decoration: none; font-weight: 500;
            padding: 5px 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .home-link:hover { color: #457b9d; background: #f1faee; text-shadow: none; }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div id="game-container">
        <h1>Command-Line Challenge</h1>
        <div id="task-prompt">Loading challenge...</div>
        
        <div class="terminal">
            <label for="command-input" class="prompt-user">C:\Users\Admin&gt;</label>
            <input type="text" id="command-input" autocomplete="off" spellcheck="false">
        </div>

        <div id="feedback"></div>
        <div id="score-display">Score: 0</div>
        <div id="timer-display">Time Left: 20</div>
    </div>
    <a href="index.html" class="home-link">&larr; Back to Main Menu</a>

    <script>
        const challenges = [
            { task: "Display the IP configuration for all network adapters on a Windows machine.", answer: "ipconfig /all" },
            { task: "Test connectivity to the google.com server by sending four echo requests.", answer: "ping google.com" },
            { task: "Force an immediate update of all Group Policy settings on a client computer.", answer: "gpupdate /force" },
            { task: "Scan all protected system files to check their integrity and repair them.", answer: "sfc /scannow" },
            { task: "Check the 'C:' drive for file system errors and attempt to fix them.", answer: "chkdsk /f" },
            { task: "Display the route that network packets take to reach the host 'professormesser.com'.", answer: "tracert professormesser.com" },
            { task: "Display all active network connections and listening ports.", answer: "netstat -a" },
            { task: "Map the network share '\\\\SERVER\\Data' to the 'G:' drive.", answer: "net use g: \\\\server\\data" }
        ];

        let currentChallengeIndex = 0;
        let score = 0;
        let timeLeft = 20;
        let timerInterval;

        const taskEl = document.getElementById('task-prompt');
        const inputEl = document.getElementById('command-input');
        const feedbackEl = document.getElementById('feedback');
        const scoreDisplayEl = document.getElementById('score-display');
        const timerDisplayEl = document.getElementById('timer-display');
        
        function loadChallenge() {
            if (currentChallengeIndex >= challenges.length) {
                endGame();
                return;
            }
            
            feedbackEl.textContent = '';
            inputEl.value = '';
            inputEl.disabled = false;
            timeLeft = 20;
            timerDisplayEl.textContent = `Time Left: ${timeLeft}`;
            
            taskEl.textContent = challenges[currentChallengeIndex].task;
            inputEl.focus();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplayEl.textContent = `Time Left: ${timeLeft}`;
                if (timeLeft < 0) {
                    handleAnswer(true); // Handle timeout as incorrect
                }
            }, 1000);
        }
        
        function handleAnswer(isTimeout = false) {
            clearInterval(timerInterval);
            inputEl.disabled = true;

            const userAnswer = inputEl.value.trim().toLowerCase();
            const correctAnswer = challenges[currentChallengeIndex].answer.toLowerCase();

            if (!isTimeout && userAnswer === correctAnswer) {
                score++;
                feedbackEl.textContent = 'Correct!';
                feedbackEl.className = 'correct';
            } else {
                if(isTimeout) {
                    feedbackEl.textContent = `Time's up! The command was: ${challenges[currentChallengeIndex].answer}`;
                } else {
                    feedbackEl.textContent = `Incorrect! The command was: ${challenges[currentChallengeIndex].answer}`;
                }
                feedbackEl.className = 'incorrect';
            }
            scoreDisplayEl.textContent = `Score: ${score}`;
            
            setTimeout(() => {
                currentChallengeIndex++;
                loadChallenge();
            }, 3000); // Wait 3 seconds to show the correct answer
        }

        function endGame() {
            taskEl.textContent = 'Challenge Complete!';
            inputEl.style.display = 'none';
            document.querySelector('.prompt-user').style.display = 'none';
            feedbackEl.textContent = `Your final score is ${score} out of ${challenges.length}.`;
            timerDisplayEl.style.display = 'none';
        }

        inputEl.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                handleAnswer();
            }
        });
        
        // Start the game
        challenges.sort(() => 0.5 - Math.random());
        loadChallenge();
    </script>
</body>
</html>

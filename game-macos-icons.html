<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Icon Challenge | A+ Core 2 Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #a8dadc 0%, #457b9d 100%);
            overflow: hidden; padding: 20px; color: #fff;
            /* DEBUG FIX: Added text-shadow for global readability */
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.7; }
        .shape-1 { width: 300px; height: 300px; top: 10%; left: 15%; background: linear-gradient(to right, #e63946, #f1faee); }
        .shape-2 { width: 400px; height: 400px; bottom: 5%; right: 10%; background: linear-gradient(to right, #457b9d, #a8dadc); }

        #game-container {
            width: 90%; max-width: 600px; padding: 40px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        h1 { margin: 0 0 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        #icon-display {
            font-size: 5rem; margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        #icon-display svg { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }

        .option-btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 10px;
            font-size: 1.1em; font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            color: #f1faee;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px; cursor: pointer;
            transition: background-color 0.2s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .option-btn:not(:disabled):hover { background-color: rgba(255, 255, 255, 0.2); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.5; }
        
        #feedback { font-size: 1.2em; font-weight: 700; margin-top: 20px; height: 30px; }
        .correct { color: #28a745; text-shadow: 0 0 5px #28a745; }
        .incorrect { color: #e63946; text-shadow: 0 0 5px #e63946; }

        #score-display, #timer-display { font-size: 1.2em; margin-top: 15px; color: #f1faee; opacity: 0.8; }
        .home-link {
            display: inline-block; margin-top: 25px; color: #fff; text-decoration: none; font-weight: 500;
            padding: 5px 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .home-link:hover { color: #457b9d; background: #f1faee; text-shadow: none; }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div id="game-container">
        <h1>Menu Bar Icon Challenge</h1>
        <div id="icon-display">?</div>
        <div id="options-container"></div>
        <div id="feedback"></div>
        <div id="score-display">Score: 0</div>
        <div id="timer-display">Time Left: 10</div>
    </div>
    <a href="index.html" class="home-link">&larr; Back to Main Menu</a>

    <script>
        const icons = [
            { icon: '🔍', name: 'Spotlight', id: 'spotlight' },
            { icon: 'Wi-Fi', name: 'Wi-Fi', id: 'wifi' },
            { icon: '🔊', name: 'Sound/Volume', id: 'sound' },
            { icon: '🔋', name: 'Battery', id: 'battery' },
            { icon: '🕒', name: 'Time Machine', id: 'timemachine' },
            { icon: 'B', name: 'Bluetooth', id: 'bluetooth' }
        ];

        let currentIcon;
        let score = 0;
        let timeLeft = 10;
        let timerInterval;
        let gameActive = true;
        let rounds = 0;
        const maxRounds = 10;

        const iconDisplayEl = document.getElementById('icon-display');
        const optionsContainerEl = document.getElementById('options-container');
        const feedbackEl = document.getElementById('feedback');
        const scoreDisplayEl = document.getElementById('score-display');
        const timerDisplayEl = document.getElementById('timer-display');

        function generateOptions(correctAnswer) {
            const options = [correctAnswer];
            while (options.length < 4) {
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                if (!options.some(opt => opt.id === randomIcon.id)) {
                    options.push(randomIcon);
                }
            }
            return options.sort(() => 0.5 - Math.random());
        }

        function loadRound() {
            if (rounds >= maxRounds) {
                endGame();
                return;
            }
            rounds++;

            feedbackEl.textContent = '';
            optionsContainerEl.innerHTML = '';
            timeLeft = 10;
            timerDisplayEl.textContent = `Time Left: ${timeLeft}`;

            currentIcon = icons[Math.floor(Math.random() * icons.length)];
            
            // Special SVG rendering for Wi-Fi and Bluetooth icons
            if (currentIcon.id === 'wifi') {
                iconDisplayEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16"><path d="M15.384 6.115a.485.485 0 0 0-.047-.736C12.518 2.525 8.047 1.5 4.5 1.5s-8.018 1.025-10.837 3.879a.485.485 0 0 0-.048.736.518.518 0 0 0 .735.047c2.46-2.525 6.382-3.5 9.15-3.5s6.69 1.025 9.15 3.5c.209.21.527.21.735-.047z"/><path d="M9.708 8.163a.5.5 0 0 0-.708 0l-1.5 1.5a.5.5 0 0 0 0 .708l1.5 1.5a.5.5 0 0 0 .708 0l1.5-1.5a.5.5 0 0 0 0-.708l-1.5-1.5z"/><path d="M13.229 8.271a.482.482 0 0 0-.063-.745C11.316 5.922 8.047 5 4.5 5s-6.816.922-8.666 2.526a.482.482 0 0 0-.063.745.525.525 0 0 0 .75.063c1.6-1.425 4.472-2.34 7.979-2.34s6.379.915 7.979 2.34c.224.198.526.18.75-.063z"/></svg>`;
            } else if (currentIcon.id === 'bluetooth') {
                 iconDisplayEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8.5 2.134a.5.5 0 0 0-.904.26L5.223 6.03H2.073a.5.5 0 0 0-.37.843l3.563 2.964-2.54 4.143a.5.5 0 0 0 .758.638L7.5 11.233v2.633a.5.5 0 0 0 .904.26l2.373-3.84-1.332.888a.5.5 0 0 0-.232.899l.48.32a.5.5 0 0 0 .758-.638L8 8.003l2.54 2.112a.5.5 0 0 0 .758-.638l-2.54-4.143 3.563-2.964a.5.5 0 0 0-.37-.843H10.777L8.5 2.134zM7.148 6.533l.852-1.372v2.744L7.148 6.533zm1.704 0l.852 1.372L8.852 5.16v2.744z"/></svg>`;
            } else {
                iconDisplayEl.textContent = currentIcon.icon;
            }

            const options = generateOptions(currentIcon);
            options.forEach(opt => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = opt.name;
                button.dataset.id = opt.id;
                button.addEventListener('click', selectAnswer);
                optionsContainerEl.appendChild(button);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplayEl.textContent = `Time Left: ${timeLeft}`;
                if (timeLeft < 0) {
                    selectAnswer({ target: { dataset: { id: 'timeout' } } }); // Simulate a wrong answer on timeout
                }
            }, 1000);
        }

        function selectAnswer(e) {
            if (!gameActive) return;
            clearInterval(timerInterval);
            
            const selectedId = e.target.dataset.id;
            
            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

            if (selectedId === currentIcon.id) {
                score++;
                feedbackEl.textContent = 'Correct!';
                feedbackEl.className = 'correct';
            } else {
                feedbackEl.textContent = `Incorrect! The answer was ${currentIcon.name}.`;
                feedbackEl.className = 'incorrect';
            }
            scoreDisplayEl.textContent = `Score: ${score}`;

            setTimeout(loadRound, 2000);
        }

        function endGame() {
            gameActive = false;
            iconDisplayEl.style.display = 'none';
            optionsContainerEl.innerHTML = `<h2>Game Over!</h2><p>Your final score is ${score} out of ${maxRounds}.</p>`;
            feedbackEl.textContent = '';
            timerDisplayEl.style.display = 'none';
        }
        
        // Start Game
        loadRound();

    </script>
</body>
</html>

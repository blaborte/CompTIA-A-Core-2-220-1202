<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Messer's CompTIA A+ Core 2 (220-1202) Practice Test A</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        #quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            overflow: hidden;
        }

        #quiz-header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        #quiz-header h1 {
            margin-bottom: 5px;
        }
        
        #creator-tag {
            margin-top: 5px;
            font-weight: 300;
            font-size: 0.9em;
            opacity: 0.9;
        }

        #quiz-body {
            padding: 30px;
        }

        #question-text {
            font-size: 1.2em;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-wrap; /* Preserves newlines in questions */
        }

        #options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .option:hover {
            background-color: #e9ecef;
        }

        .option input {
            margin-right: 10px;
        }
        
        /* Styles for feedback */
        .option.correct {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            font-weight: bold;
        }
        .option.incorrect {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
            font-weight: bold;
        }


        #quiz-footer {
            padding: 20px 30px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #feedback {
            font-weight: bold;
        }
        
        #score-text {
            font-size: 1.1em;
            font-weight: bold;
        }

        button {
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }
        
        button#next-btn {
            background-color: #28a745;
        }
        
        button#next-btn:hover {
             background-color: #218838;
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <div id="quiz-header">
            <h1>Professor Messer's CompTIA A+ Core 2 (220-1202) Practice Test A</h1>
            <p id="creator-tag">Created by: BLaborte</p>
        </div>
        <div id="quiz-body">
            <p id="question-text">Loading question...</p>
            <ul id="options-list">
                </ul>
        </div>
        <div id="quiz-footer">
            <div id="score-text">Score: 0</div>
            <button id="submit-btn">Submit Answer</button>
            <button id="next-btn" style="display:none;">Next Question</button>
        </div>
    </div>

    <script>
        // Paste the JSON data here
        const quizData = [
          {
            "id": "A6",
            "question": "A system administrator is installing a new server into the metal racks in a data center. During the installation process, the administrator can feel a faint tingling sensation when mounting the server. Which of the following safety systems should be tested and verified first?",
            "options": {
              "A": "Equipment grounding",
              "B": "Air filtration",
              "C": "Cable management",
              "D": "Waste disposal regulations"
            },
            "answer": "A"
          },
          {
            "id": "A7",
            "question": "A user has opened a help desk ticket regarding the battery life on their mobile phone. The battery in the phone held a charge for most of the day prior to connecting to the corporate network. The battery now only lasts about half a day and the back of the phone is warmer than usual. The phone is configured as follows:\n\nStorage: 216.2 GB of 512 GB used\nDisplay and Brightness: Automatic\nWi-Fi: Enabled\nAuto-lock: Disabled\nVPN: Not connected\nLow Power Mode: Disabled\nBattery Maximum Capacity: 100%\n\nWhich of the following changes would have the best impact on battery performance?",
            "options": {
              "A": "Enable auto-lock",
              "B": "Connect to the VPN",
              "C": "Increase available storage space",
              "D": "Disable Wi-Fi"
            },
            "answer": "A"
          },
          {
            "id": "A8",
            "question": "A user in the accounting department is trying to install an app on their new corporate mobile phone, but the installation fails each time. Which of the following would be the most likely reason for this issue?",
            "options": {
              "A": "Incorrect file system type",
              "B": "MDM policy restriction",
              "C": "Slow CPU speeds",
              "D": "Low battery level"
            },
            "answer": "B"
          },
          { "id": "A9", "question": "A system administrator has required the use of FRT for authentication on all laptops, mobile phones, and tablets. Which of the following will be required to meet this requirement?", "options": { "A": "Fingerprint reader", "B": "Badge reader", "C": "Token generator", "D": "Integrated camera" }, "answer": "D" },
          { "id": "A10", "question": "A desktop technician is cleaning the outside of computers used on a manufacturing assembly line. The assembly line creates sawdust and wood chips, so most of the computers are protected with enclosed computer cases. Which of the following would be the most important item for the technician to include during this cleaning process?", "options": { "A": "Surge suppressor", "B": "Temperature sensor", "C": "Air filter mask", "D": "ESD mat" }, "answer": "C" },
          { "id": "A11", "question": "After a user authenticates to a web site, the browser performs very slowly and some of the items on the page will not properly display. Which of the following would be the best way to resolve this issue?", "options": { "A": "Disable browser notifications", "B": "Update the web server certificate", "C": "Update the system BIOS", "D": "Clear the browser cache" }, "answer": "D" },
          { "id": "A12", "question": "The motherboard of a server in the corporate data center has started smoking, and flames can be seen inside the computer case. Which of the following would be the best way to extinguish this fire?", "options": { "A": "Water hose", "B": "Foam-based extinguisher", "C": "Disconnect the power", "D": "Carbon dioxide extinguisher" }, "answer": "D" },
          { "id": "A13", "question": "Which of these Windows features provides full disk encryption for all data on a storage drive?", "options": { "A": "Domain Services", "B": "EFS", "C": "RDP", "D": "BitLocker" }, "answer": "D" },
          { "id": "A14", "question": "A company maintains data retention requirements of five years for all customer names, addresses, and phone numbers. Which of the following would best describe this data?", "options": { "A": "Credit card transactions", "B": "Government-issued information", "C": "PII", "D": "Healthcare data" }, "answer": "C" },
          { "id": "A15", "question": "A user in the accounting department would like to ensure their mobile device data is always available. If the user's smartphone is damaged or stolen, they would like to replace the device and restore all data as quickly as possible. Which of the following would provide this functionality?", "options": { "A": "Full device encryption", "B": "Remote backup", "C": "IoT isolation", "D": "Remote wipe" }, "answer": "B" }
          // Add the rest of your questions here if you have more
        ];

        // Get references to HTML elements
        const questionTextEl = document.getElementById('question-text');
        const optionsListEl = document.getElementById('options-list');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreTextEl = document.getElementById('score-text');
        const quizContainerEl = document.getElementById('quiz-container');

        // Quiz state variables
        let currentQuestionIndex = 0;
        let score = 0;
        let answerSubmitted = false;

        // Function to load the current question and options
        function loadQuiz() {
            answerSubmitted = false;
            const currentQuestion = quizData[currentQuestionIndex];
            
            questionTextEl.innerText = `${currentQuestion.id}: ${currentQuestion.question}`;
            optionsListEl.innerHTML = ''; // Clear previous options

            for (const key in currentQuestion.options) {
                const option = document.createElement('li');
                option.classList.add('option');
                option.innerHTML = `
                    <input type="radio" name="option" id="${key}" value="${key}">
                    <label for="${key}">${key}. ${currentQuestion.options[key]}</label>
                `;
                optionsListEl.appendChild(option);
            }

            submitBtn.style.display = 'block';
            nextBtn.style.display = 'none';
        }

        // Function to check the selected answer
        function checkAnswer() {
            if (answerSubmitted) return;

            const selectedOptionInput = document.querySelector('input[name="option"]:checked');
            if (!selectedOptionInput) {
                alert('Please select an answer!');
                return;
            }

            answerSubmitted = true;
            const selectedAnswer = selectedOptionInput.value;
            const correctAnswer = quizData[currentQuestionIndex].answer;
            
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                const input = option.querySelector('input');
                if (input.value === correctAnswer) {
                    option.classList.add('correct');
                } else if (input.value === selectedAnswer) {
                    option.classList.add('incorrect');
                }
            });

            if (selectedAnswer === correctAnswer) {
                score++;
                scoreTextEl.innerText = `Score: ${score}`;
            }

            submitBtn.style.display = 'none';
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.style.display = 'block';
            } else {
                showResults();
            }
        }

        // Function to show final results
        function showResults() {
             quizContainerEl.innerHTML = `
                <div id="quiz-header"><h1>Quiz Complete!</h1></div>
                <div id="quiz-body" style="text-align:center;">
                    <h2>Your final score is ${score} out of ${quizData.length}</h2>
                    <button onclick="location.reload()">Restart Quiz</button>
                </div>
            `;
        }

        // Event listeners for buttons
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            loadQuiz();
        });

        // Initial load of the first question
        loadQuiz();
    </script>

</body>
</html>
